      try {
        const response = await fetch("/vr/current", { cache: "no-store" });
        if (!response.ok) {
          setStatus("In der MeLE-App ist kein Panorama gewählt.");
          return false;
        }
        const data = await response.json();
        rememberSite(data);
        urls = {
          preview: data.preview || "",
          png: data.png || "",
          original: data.original || "",
        };
        tex = data.tex || "preview";
        imageUrl = urls[tex] || urls.preview || urls.png || "";
        const srcw = Number(data.srcw || 0);
        const north = Number(data.north || 0);
        applyNorth(srcw > 0 ? (360 * north / srcw) : 0);
      } catch {
        setStatus("Panorama der MeLE-App nicht erreichbar.");
        return false;
      }
      if (!imageUrl) {
        setStatus("In der MeLE-App ist kein Panorama gewählt.");
        return false;
      }
      return true;
    }

    function loadTexture() {
      if (!imageUrl) {
        setStatus("In der MeLE-App ist kein Panorama gewählt.");
        return;
      }
      setStatus("Lade Panorama …");
      const loader = new THREE.TextureLoader();
      loader.load(
        imageUrl,
        (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.minFilter = THREE.LinearFilter;
          texture.generateMipmaps = false;
          material.map = texture;
          material.needsUpdate = true;
          textureReady = true;
          const kind = tex === "png" ? "Transparentes PNG" : (tex === "original" ? "Original" : "Vorschau");
          setStatus(`${kind} · ${northLabel()} · lade Ansicht …`);
          refreshEnterButton();
          startSky();
        },
        undefined,
        () => {
          textureReady = false;
          enterBtn.disabled = true;
          setStatus(`Panorama konnte nicht geladen werden: ${imageUrl}`);
        },
      );
    }

    function formatCoord(value, positive, negative) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "fehlt";
      const hemisphere = number >= 0 ? positive : negative;
      return `${Math.abs(number).toFixed(5)}° ${hemisphere}`;
    }

    function formatWhen(value) {
      if (!value) return "noch keins";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 19);
      return date.toISOString().slice(0, 19).replace("T", " ") + " UTC";
    }

    function dashboardSections() {
      const utc = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
      const when = formatWhen(skyWhen);
      const system = skyFault
        ? ["Overlay Fehler", skyFault.slice(0, 42)]
        : ["Overlay " + skyLink, "Abruf " + when];
      return [
        { title: "Zeit", lines: [utc, skyView.live ? "Live" : "Fest"] },
        { title: "Standort", lines: [formatCoord(siteLat, "N", "S"), formatCoord(siteLon, "E", "W")] },
        { title: "Himmel", lines: [`${skyStars} Sterne`, `${skyNames} Sternbilder`, "Overlay " + when] },
        { title: "System", lines: system },
      ];
    }

    function fmtRa(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      const hours = (((value % 360) + 360) % 360) / 15;
      const h = Math.floor(hours);
      const minutes = (hours - h) * 60;
      const m = Math.floor(minutes);
      const s = (minutes - m) * 60;
      return `${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${s.toFixed(2)}s`;
    }

    function fmtDec(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      const sign = value >= 0 ? "+" : "-";
      const abs = Math.abs(value);
      const d = Math.floor(abs);
      const minutes = (abs - d) * 60;
      const m = Math.floor(minutes);
      const s = (minutes - m) * 60;
      return `${sign}${String(d).padStart(2, "0")}° ${String(m).padStart(2, "0")}' ${s.toFixed(1)}"`;
    }

    function fmtDeg(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      return `${value >= 0 ? "+" : ""}${value.toFixed(1)}°`;
    }

    function objectKey(item) {
      if (!item) return "";
      const kind = item.kind || (item.hip ? "star" : "object");
      if (item.hip) return `${kind}:hip:${item.hip}`;
      if (item.id) return `${kind}:id:${item.id}`;
      return `${kind}:name:${item.name || ""}`;
    }

    function objectChoices() {
      const named = lastStars.filter((star) => star && star.name).slice().sort((a, b) => {
        const mag = Number(a.mag) - Number(b.mag);
        if (mag) return mag;
        return String(a.name).localeCompare(String(b.name), "de");
      });
      return lastBodies.concat(named).slice(0, 6);
    }

    function findByKey(key) {
      if (!key) return null;
      for (const body of lastBodies) if (objectKey(body) === key) return body;
      for (const star of lastStars) if (objectKey(star) === key) return star;
      if (skyView.messier) {
        for (const item of lastDso) if (objectKey(item) === key) return item;
      }
      if (skyView.ngcMode !== "off") {
        for (const item of lastNgc) if (objectKey(item) === key) return item;
      }
      return null;
    }

    function kindLabel(item) {
      if (item.kind === "sun") return "Sonne";
      if (item.kind === "moon") return "Mond";
      if (item.kind === "planet") return "Planet";
      if (item.kind === "messier") return "Messier";
      if (item.kind === "ngc") return String(item.id || "").startsWith("IC") ? "IC" : "NGC";
      if (item.kind === "star" || item.hip) return "Stern";
      return item.kind || "Objekt";
    }

    function dsoTypeLabel(code) {
      const names = {
        "*": "Stern",
        "**": "Doppelstern",
        "*Ass": "Sterngruppe",
        OCl: "Offener Sternhaufen",
        GCl: "Kugelsternhaufen",
        "Cl+N": "Haufen mit Nebel",
        G: "Galaxie",
        PN: "Planetarischer Nebel",
        Neb: "Nebel",
        HII: "H-II-Gebiet",
        SNR: "Supernovaüberrest",
      };
      const text = String(code || "").trim();
      if (!text) return "";
      return names[text] || text;
    }

    function detailLines(item, missing) {
      const lines = [
        item.name || item.id || "Objekt",
        kindLabel(item),
      ];
      if (item.type) {
        const type = dsoTypeLabel(item.type);
        if (type) lines.push(type);
      }
      lines.push(
        `RA ${fmtRa(item.ra)}`,
        `Dec ${fmtDec(item.dec)}`,
        `Az ${fmtDeg(item.az)}`,
        `Höhe ${fmtDeg(item.alt)}`,
      );
      if (item.mag != null && Number.isFinite(Number(item.mag))) {
        const band = item.mag_band ? ` ${item.mag_band}` : "";
        lines.push(`${Number(item.mag).toFixed(2)} mag${band}`);
      }
      if (item.phase != null && Number.isFinite(Number(item.phase))) {
        lines.push(`Phase ${Math.round(Number(item.phase) * 100)}%`);
      }
      if (item.above === false || (item.fromSearch && Number(item.alt) <= 0)) lines.push("unter Horizont");
      if (detailNote) lines.push(detailNote);
      if (missing) lines.push("nicht mehr in der Liste");
      return lines;
    }

    function hideObjectRows() {
      for (const row of objectRows) {
        row.visible = false;
        row.userData.item = null;
      }
    }

    function updateObjectRows() {
      const choices = objectChoices();
      objectRows.forEach((row, index) => {
        const item = choices[index];
        if (!item) {
          row.visible = false;
          row.userData.item = null;
          row.userData.key = "";
          return;
        }
        const key = objectKey(item);
        const label = item.name || item.id || "Objekt";
        row.visible = true;
        row.userData.action = "object";
        row.userData.item = item;
        if (row.userData.key === key && row.userData.label === label) return;
        row.userData.key = key;
        row.userData.label = label;
        paintTextButton(row, label);
      });
    }

    function showHome() {
      if (axisMode && panelMode === "mount") leaveAxisMode("");
      skyPointMode = false;
      panelMode = "home";
      panelReturn = "home";
      selectedItem = null;
      selectedKey = "";
      selectedMissing = false;
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showHimmel() {
      panelMode = "himmel";
      panelReturn = "home";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showMount() {
      panelMode = "mount";
      panelReturn = "home";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showCamera() {
      if (panelMode === "sessions") cameraReturn = "sessions";
      else cameraReturn = panelMode === "detail" ? "detail" : "home";
      panelMode = "camera";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
      void pollCamera();
      if (cameraPollTimer) clearInterval(cameraPollTimer);
      cameraPollTimer = setInterval(() => {
        if (panelMode === "camera") void pollCamera();
      }, 1000);
    }

    function remainingFrames(session, imageType) {
      const dark = imageType === "DARK";
      if (!session) return dark ? 0 : 1;
      const planned = dark ? session.darks_planned : session.lights_planned;
      const done = Number((dark ? session.darks_completed : session.lights_completed) || 0);
      if (planned == null || Number(planned) <= 0) return dark ? 0 : 1;
      return Math.max(0, Number(planned) - done);
    }

    function rememberFrameCount() {
      const count = Math.max(cameraDraft.image_type === "DARK" ? 0 : 1, Number(cameraDraft.frames) || 0);
      cameraDraft.frames = count;
      if (cameraDraft.image_type === "DARK") cameraDraft.dark_frames = count;
      else cameraDraft.light_frames = count;
    }

    function selectFrameType(next) {
      rememberFrameCount();
      cameraDraft.image_type = next;
      const stored = next === "DARK" ? cameraDraft.dark_frames : cameraDraft.light_frames;
      cameraDraft.frames = stored != null ? Number(stored) : (next === "DARK" ? 0 : 1);
    }

    function frameTypeColor(button) {
      if (button !== camLightsButton && button !== camDarksButton) return null;
      const dark = cameraDraft.image_type === "DARK";
      if (button === camDarksButton) return dark ? 0x38bdf8 : testRest;
      return dark ? testRest : 0x38bdf8;
    }

    function paintFrameTypeButtons() {
      const lights = frameTypeColor(camLightsButton);
      const darks = frameTypeColor(camDarksButton);
      if (camLightsButton !== hoveredButton && lights != null) camLightsButton.material.color.setHex(lights);
      if (camDarksButton !== hoveredButton && darks != null) camDarksButton.material.color.setHex(darks);
    }

    function leaveCamera() {
      if (cameraPollTimer) {
        clearInterval(cameraPollTimer);
        cameraPollTimer = null;
      }
      if (cameraReturn === "sessions") showSessions();
      else if (cameraReturn === "detail" && selectedItem) showObjectDetail(selectedItem);
      else showHome();
    }

    async function closeCameraSession() {
      if (cameraLockedNow()) {
        cameraNote = "Aufnahme läuft.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      const sessionId = cameraDraft.session_id;
      if (sessionId) monitorSessionId = sessionId;
      if (!sessionId) {
        leaveCamera();
        return;
      }
      const headers = { "Content-Type": "application/json" };
      if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
      try {
        const response = await fetch("/astro/capture/session-close", {
          method: "POST",
          credentials: "same-origin",
          headers,
          body: JSON.stringify({ session_id: sessionId }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          cameraNote = "Zuerst an der Montierung koppeln.";
        } else if (!response.ok || data.ok === false) {
          cameraNote = data.error || "Session nicht gespeichert";
        } else {
          const weather = data.weather && data.weather.export_status;
          const samples = data.weather && data.weather.sample_count;
          cameraNote = weather
            ? `Session gespeichert · Wetter ${weather}${samples != null ? ` (${samples})` : ""}`
            : "Session gespeichert";
          const closed = data.session || {};
          savedSessionRow = {
            id: sessionId,
            catalog_key: closed.catalog_key || cameraDraft.catalog_key || catalogQueryOf(selectedItem),
            started_utc: closed.started_utc || closed.session_start_utc || "",
            lifecycle_status: "closed",
            saved: true,
            note: cameraNote,
          };
          cameraDraft.session_id = null;
          cameraDarksPrompt = false;
          leaveCamera();
          return;
        }
      } catch (err) {
        cameraNote = "Session nicht gespeichert";
      }
      dashboardKey = "";
      paintDashboard();
    }

    function sessionDateText(session) {
      const raw = String(session.started_utc || "").slice(0, 10);
      const parts = raw.split("-");
      return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : "ohne Datum";
    }

    function sessionRowLabel(session, sessions) {
      const raw = String(session.started_utc || "").slice(0, 10);
      const date = sessionDateText(session);
      const same = sessions.filter((row) => String(row.started_utc || "").slice(0, 10) === raw).length;
      const code = `s${String(session.id).padStart(5, "0")}`;
      return same > 1 ? `Session vom ${date} · ${code}` : `Session vom ${date}`;
    }

    function adoptSessionDraft(session) {
      cameraDraft = {
        session_id: session.id,
        catalog_key: session.catalog_key || catalogQueryOf(selectedItem),
        exposure_s: session.exposure_s,
        iso: session.iso,
        gain: session.gain,
        frames: remainingFrames(session, "LIGHT"),
        light_frames: remainingFrames(session, "LIGHT"),
        dark_frames: remainingFrames(session, "DARK"),
        image_type: "LIGHT",
        session_label: `Session vom ${sessionDateText(session)}`,
      };
    }

    function paintSessionRows() {
      const profiles = sessionPickMode === "profile";
      sessionRows.forEach((row, index) => {
        const item = sessionRowsData[index];
        if (!item || panelMode !== "sessions") {
          row.visible = false;
          row.userData.session = null;
          row.userData.profileId = null;
          return;
        }
        row.visible = true;
        if (profiles) {
          row.userData.action = "session-profile";
          row.userData.profileId = item.id;
          row.userData.session = null;
          paintTextButton(row, item.label || `Profil ${item.id}`);
          return;
        }
        row.userData.action = "session-pick";
        row.userData.session = item;
        row.userData.profileId = null;
        const saved = item.saved ? " · gespeichert" : "";
        paintTextButton(row, `${sessionRowLabel(item, sessionRowsData)}${saved}`);
      });
      sessionNewButton.visible = panelMode === "sessions" && !profiles && Boolean(catalogQueryOf(selectedItem));
    }

    function showSessions() {
      panelMode = "sessions";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
      void loadQuestSessions();
    }

    async function openCameraEntry() {
      sessionsReturn = panelMode === "detail" ? "detail" : "home";
      try {
        const response = await fetch("/astro/capture/status", { cache: "no-store", credentials: "same-origin" });
        const data = await response.json().catch(() => ({}));
        const state = data && data.job && data.job.state;
        if (state === "running" || state === "stop_requested") {
          showCamera();
          return;
        }
      } catch (_err) {
        sessionNote = "";
      }
      showSessions();
    }

    async function loadQuestSessions() {
      const key = catalogQueryOf(selectedItem);
      sessionPickMode = "session";
      if (!key) {
        sessionRowsData = [];
        sessionNote = "Objekt auf der Quest wählen.";
        syncPanelButtons();
        dashboardKey = "";
        paintDashboard();
        return;
      }
      try {
        const response = await fetch(`/astro/sessions?catalog_key=${encodeURIComponent(key)}`, {
          cache: "no-store",
          credentials: "same-origin",
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          sessionRowsData = [];
          sessionNote = data.error || "Sessions nicht lesbar";
        } else {
          const rows = Array.isArray(data.sessions) ? data.sessions : [];
          sessionRowsData = rows.filter((row) => String(row.lifecycle_status || "open") !== "closed");
          if (savedSessionRow && savedSessionRow.catalog_key === key) {
            sessionRowsData = sessionRowsData.filter((row) => row.id !== savedSessionRow.id);
            sessionRowsData.unshift(savedSessionRow);
          }
          sessionNote = savedSessionRow && savedSessionRow.catalog_key === key && savedSessionRow.note
            ? savedSessionRow.note
            : (sessionRowsData.length > sessionRows.length
              ? "Weitere offene Sessions am Desktop."
              : "");
          sessionRowsData = sessionRowsData.slice(0, sessionRows.length);
        }
      } catch (_err) {
        sessionRowsData = [];
        sessionNote = "Sessions nicht lesbar";
      }
      if (panelMode === "sessions") {
        syncPanelButtons();
        dashboardKey = "";
        paintDashboard();
      }
    }

    async function createQuestSession(profileId) {
      const key = catalogQueryOf(selectedItem);
      if (!key) {
        sessionNote = "Objekt auf der Quest wählen.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      const headers = { "Content-Type": "application/json" };
      if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
      const body = {
        catalog_key: key,
        display_name: selectedItem ? (selectedItem.name || "") : "",
      };
      if (profileId != null) body.profile_id = profileId;
      try {
        const response = await fetch("/astro/sessions", {
          method: "POST",
          credentials: "same-origin",
          headers,
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          sessionNote = "Zuerst an der Montierung koppeln.";
        } else if (data.code === "profile_ambiguous") {
          sessionPickMode = "profile";
          sessionRowsData = Array.isArray(data.profiles) ? data.profiles : [];
          sessionNote = data.error || "Mehrere Profile. Eines auswählen.";
          syncPanelButtons();
          dashboardKey = "";
          paintDashboard();
          return;
        } else if (!response.ok || data.ok === false || !data.session) {
          sessionNote = data.error || "Session nicht erstellt";
        } else {
          adoptSessionDraft(data.session);
          cameraNote = "Session erstellt";
          showCamera();
          return;
        }
      } catch (_err) {
        sessionNote = "Session nicht erstellt";
      }
      if (panelMode === "sessions") {
        syncPanelButtons();
        dashboardKey = "";
        paintDashboard();
      }
    }

    function cameraLockedNow() {
      return Boolean(cameraView && cameraView.locked);
    }

    function paintCameraLabels() {
      const exp = cameraView && cameraView.locked && cameraView.job
        ? cameraView.job.exposure_s
        : cameraDraft.exposure_s;
      const iso = cameraView && cameraView.locked && cameraView.job
        ? cameraView.job.iso
        : cameraDraft.iso;
      const gain = cameraView && cameraView.locked && cameraView.job
        ? cameraView.job.gain
        : cameraDraft.gain;
      const frames = cameraView && cameraView.locked && cameraView.job
        ? cameraView.job.planned
        : cameraDraft.frames;
      paintTextButton(camExpLabel, exp != null ? `${exp} s` : "— s");
      const isoText = iso != null ? `ISO ${iso}` : (gain != null ? `Gain ${gain}` : "ISO —");
      paintTextButton(camIsoLabel, isoText);
      paintTextButton(camCountLabel, frames != null ? `${frames} Bilder` : "— Bilder");
    }

    function stepList(steps, current, dir) {
      const list = Array.isArray(steps) ? steps.map(Number).filter((n) => Number.isFinite(n)) : [];
      if (!list.length) return current;
      const value = Number(current);
      if (!Number.isFinite(value)) return dir < 0 ? list[list.length - 1] : list[0];
      if (dir > 0) {
        const next = list.find((step) => step > value + 1e-9);
        return next == null ? list[list.length - 1] : next;
      }
      for (let index = list.length - 1; index >= 0; index -= 1) {
        if (list[index] < value - 1e-9) return list[index];
      }
      return list[0];
    }

    function noteFinishedLights(data) {
      if (!data) return;
      const job = data && data.job;
      if (data && data.locked && job && job.image_type !== "DARK") cameraLightJobId = job.job_id;
      if (!job || data.locked || job.job_id !== cameraLightJobId) return;
      cameraLightJobId = null;
      if (job.state === "completed" && job.image_type !== "DARK" && Number(job.planned) === 1) {
        monitorSessionId = job.session_id || cameraDraft.session_id;
        placeMonitor();
      }
      if (job.state !== "completed" || job.image_type === "DARK") return;
      const darks = Number(cameraDraft.dark_frames || 0);
      if (darks < 1) return;
      cameraDarksPrompt = true;
      cameraDraft.image_type = "LIGHT";
      cameraNote = `Lights fertig. Bitte den Tubus abdecken, kein Licht. Danach ${darks} Darks.`;
    }

    function applyCameraContext(data) {
      noteFinishedLights(data);
      cameraView = data || null;
      const session = data && data.session;
      if (data && !data.locked && session && data.session_code === "ok") {
        if (cameraDraft.session_id == null) {
          cameraDraft = {
            session_id: session.id,
            catalog_key: session.catalog_key || "",
            exposure_s: session.exposure_s,
            iso: session.iso,
            gain: session.gain,
            frames: remainingFrames(session, "LIGHT"),
            light_frames: remainingFrames(session, "LIGHT"),
            dark_frames: remainingFrames(session, "DARK"),
            image_type: "LIGHT",
            session_label: `Session vom ${sessionDateText(session)}`,
          };
        }
      }
      if (panelMode === "camera") {
        syncPanelButtons();
        dashboardKey = "";
        paintDashboard();
      }
    }

    async function pollCamera() {
      const key = catalogQueryOf(selectedItem);
      const query = key ? `?catalog_key=${encodeURIComponent(key)}` : "";
      try {
        const response = await fetch(`/astro/capture/context${query}`, { cache: "no-store", credentials: "same-origin" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) {
          cameraNote = data.error || "Kamerastatus nicht lesbar";
          if (panelMode === "camera") {
            dashboardKey = "";
            paintDashboard();
          }
          return;
        }
        applyCameraContext(data);
      } catch (err) {
        cameraNote = "Kamerastatus nicht lesbar";
        if (panelMode === "camera") {
          dashboardKey = "";
          paintDashboard();
        }
      }
    }

    function adoptCameraProfile() {
      if (cameraLockedNow()) return;
      const profile = cameraView && cameraView.profile;
      if (!profile) {
        cameraNote = (cameraView && cameraView.profile_message) || "Kein Profil.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      cameraDraft.exposure_s = profile.exposure_s;
      cameraDraft.iso = profile.iso;
      cameraDraft.gain = profile.gain;
      cameraDraft.frames = profile.frames != null ? Number(profile.frames) : cameraDraft.frames;
      cameraNote = "Profil übernommen. Gespeichert wird es nicht.";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    async function startCameraCapture() {
      if (cameraLockedNow()) return;
      const key = catalogQueryOf(selectedItem) || cameraDraft.catalog_key;
      if (!cameraDraft.session_id || !key) {
        cameraNote = "Keine Session gewählt.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      const headers = { "Content-Type": "application/json" };
      if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
      try {
        const response = await fetch("/astro/capture/start", {
          method: "POST",
          credentials: "same-origin",
          headers,
          body: JSON.stringify({
            catalog_key: key,
            display_name: selectedItem ? (selectedItem.name || "") : "",
            session_id: cameraDraft.session_id,
            exposure_s: cameraDraft.exposure_s,
            gain: cameraDraft.gain,
            iso: cameraDraft.iso,
            frames: cameraDraft.frames,
            image_type: cameraDraft.image_type === "DARK" ? "DARK" : "LIGHT",
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) cameraNote = "Zuerst an der Montierung koppeln.";
        else if (!response.ok || data.ok === false) cameraNote = data.error || "Start abgelehnt";
        else cameraNote = "";
      } catch (err) {
        cameraNote = "Start nicht gesendet";
      }
      await pollCamera();
    }

    async function stopCameraCapture() {
      const headers = {};
      if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
      try {
        const response = await fetch("/astro/capture/stop", {
          method: "POST",
          credentials: "same-origin",
          headers,
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) cameraNote = "Zuerst an der Montierung koppeln.";
        else if (!response.ok || data.ok === false) cameraNote = data.error || "Stopp abgelehnt";
        else cameraNote = "Stopp nach dem aktuellen Bild.";
      } catch (err) {
        cameraNote = "Stopp nicht gesendet";
      }
      await pollCamera();
    }

    function showObjectList() {
      panelMode = "list";
      panelReturn = "home";
      selectedItem = null;
      selectedKey = "";
      selectedMissing = false;
      syncPanelButtons();
      updateObjectRows();
      dashboardKey = "";
      paintDashboard();
    }

    function showObjectDetail(item) {
      if (trackItemKey && trackItemKey !== objectKey(item)) clearDayTrack();
      if (panelMode !== "detail") {
        panelReturn = panelMode === "list" || panelMode === "himmel" || panelMode === "prefs"
          ? panelMode
          : "home";
      }
      panelMode = "detail";
      if (!item.fromSearch) detailNote = "";
      selectedItem = item;
      selectedKey = objectKey(item);
      selectedMissing = false;
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function catalogQueryOf(item) {
      if (!item) return "";
      if (item.kind === "planet" || item.kind === "sun" || item.kind === "moon") {
        return String(item.name || item.id || "").trim();
      }
      return String(item.key || item.id || item.name || "").trim();
    }

    function searchHitLabel(hit) {
      const name = String(hit.name || "").trim();
      if (hit.kind === "planet") return `${name || "Planet"} · Planet`;
      if (hit.kind === "sun") return `${name || "Sonne"} · Sonne`;
      if (hit.kind === "moon") return `${name || "Mond"} · Mond`;
      const key = String(hit.key || hit.id || "").trim();
      if (key && name && name !== key) return `${key} · ${name}`;
      return name || key || "Objekt";
    }

    function updateSearchRows() {
      if (!searchHits.length) {
        objectRows.forEach((row, index) => {
          if (index !== 0 || !searchNote) {
            row.visible = false;
            row.userData.item = null;
            row.userData.action = "object";
            return;
          }
          row.visible = true;
          row.userData.action = "";
          row.userData.item = null;
          row.userData.key = "";
          paintTextButton(row, searchNote);
        });
        return;
      }
      const pageHits = searchHits.slice(searchPage * 6, searchPage * 6 + 6);
      objectRows.forEach((row, index) => {
        const hit = pageHits[index];
        if (!hit) {
          row.visible = false;
          row.userData.item = null;
          row.userData.key = "";
          return;
        }
        const label = searchHitLabel(hit);
        row.visible = true;
        row.userData.action = "search-hit";
        row.userData.item = hit;
        row.userData.key = hit.key || hit.id || label;
        row.userData.label = label;
        paintTextButton(row, label);
      });
    }

    function showSearchResults() {
      panelMode = "search";
      panelReturn = "list";
      syncPanelButtons();
      updateSearchRows();
      dashboardKey = "";
      paintDashboard();
    }

    function stepSearchPage(dir) {
      const pages = Math.max(1, Math.ceil(searchHits.length / 6));
      const next = Math.min(pages - 1, Math.max(0, searchPage + dir));
      if (next === searchPage) return;
      searchPage = next;
      updateSearchRows();
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function skyWhenParam() {
      if (skyView.live || !skyView.when) return "";
      return skyView.when.toISOString();
    }

    function catalogResolveParams(query) {
      const params = new URLSearchParams({
        q: String(query || "").trim(),
        lat: String(siteLat),
        lon: String(siteLon),
      });
      const when = skyWhenParam();
      if (when) params.set("when", when);
      if (siteStem) params.set("stem", siteStem);
      return params;
    }

    async function runCatalogSearch(query) {
      const serial = ++searchSerial;
      const q = String(query || "").trim();
      searchQuery = q;
      searchPage = 0;
      searchHits = [];
      searchBusyNote(q ? `Suche ${q} …` : "Suchbegriff fehlt");
      if (!q) return;
      try {
        const response = await fetch(`/catalog/search?q=${encodeURIComponent(q)}&limit=48`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== searchSerial) return;
        if (!response.ok || data.ok === false) {
          searchHits = [];
          searchNote = data.error || "Suche fehlgeschlagen";
        } else {
          searchHits = Array.isArray(data.hits) ? data.hits : [];
          searchNote = searchHits.length ? "" : "Keine Treffer";
        }
      } catch (_err) {
        if (serial !== searchSerial) return;
        searchHits = [];
        searchNote = "Suche nicht erreichbar";
      }
      showSearchResults();
    }

    function searchBusyNote(text) {
      searchNote = text;
      showSearchResults();
    }

    async function openSearchHit(hit) {
      const serial = ++hitSerial;
      const query = catalogQueryOf(hit);
      searchNote = "Auflösen …";
      dashboardKey = "";
      if (panelMode === "search") paintDashboard();
      try {
        const response = await fetch(`/catalog/resolve?${catalogResolveParams(query)}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== hitSerial) return;
        if (!response.ok || !data.ok || !data.object) {
          searchNote = data.error || "Nicht aufgelöst";
          showSearchResults();
          return;
        }
        searchNote = "";
        detailNote = "";
        const item = data.object;
        item.fromSearch = true;
        showObjectDetail(item);
        panelReturn = "search";
      } catch (_err) {
        if (serial !== hitSerial) return;
        searchNote = "Auflösen nicht erreichbar";
        showSearchResults();
      }
    }

    async function aimResolvedTarget(item) {
      const serial = ++aimSerial;
      const query = catalogQueryOf(item);
      detailNote = "Auflösen …";
      dashboardKey = "";
      if (panelMode === "detail") paintDashboard();
      try {
        const response = await fetch(`/catalog/resolve?${catalogResolveParams(query)}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== aimSerial) return;
        if (!response.ok || !data.ok || !data.object) {
          detailNote = data.error || "Nicht aufgelöst";
          dashboardKey = "";
          if (panelMode === "detail") paintDashboard();
          return;
        }
        const obj = data.object;
        obj.fromSearch = true;
        detailNote = "";
        selectedItem = obj;
        selectedKey = objectKey(obj);
        adoptNavTarget(obj, "resolve");
        dashboardKey = "";
        if (panelMode === "detail") paintDashboard();
      } catch (_err) {
        if (serial !== aimSerial) return;
        detailNote = "Auflösen nicht erreichbar";
        dashboardKey = "";
        if (panelMode === "detail") paintDashboard();
      }
    }

    function itemHasEquatorial(item) {
      return Boolean(item) && Number.isFinite(Number(item.ra)) && Number.isFinite(Number(item.dec));
    }

    function trackSkyWhen() {
      if (!skyView.live && skyView.when) return skyView.when;
      return skyWhen ? new Date(skyWhen) : new Date();
    }

    function trackClock(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    function disposeTrackMeshes() {
      while (trackGroup.children.length) {
        const child = trackGroup.children[0];
        trackGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
    }

    function clearDayTrack() {
      trackSerial += 1;
      trackData = null;
      trackNote = "";
      trackItemKey = "";
      trackRa = null;
      trackDec = null;
      disposeTrackMeshes();
    }

    function trackStyle(light, above) {
      if (light === "night") {
        return above
          ? { kind: "solid", color: 0x5eead4, radius: 1.45, opacity: 0.95 }
          : { kind: "solid", color: 0x64748b, radius: 0.45, opacity: 0.35 };
      }
      if (light === "twilight") {
        return above
          ? { kind: "dash", color: 0xfbbf24, radius: 0.9, opacity: 0.92, on: 2, off: 1 }
          : { kind: "dash", color: 0x78716c, radius: 0.4, opacity: 0.3, on: 2, off: 1 };
      }
      return above
        ? { kind: "dot", color: 0xfb923c, radius: 0.45, opacity: 0.75, on: 1, off: 2 }
        : { kind: "dot", color: 0x57534e, radius: 0.32, opacity: 0.25, on: 1, off: 2 };
    }

    function trackRuns(points) {
      const runs = [];
      let run = [];
      let styleAt = null;
      const turnOf = (left, right) => Math.abs(((((left.az - right.az) % 360) + 540) % 360) - 180);
      const joined = (left, right) => {
        if (!left) return false;
        if (left.light !== right.light || left.above !== right.above) return false;
        return turnOf(left, right) < 25;
      };
      for (const point of points) {
        if (run.length && !joined(run[run.length - 1], point)) {
          const prev = run[run.length - 1];
          const turn = turnOf(prev, point);
          runs.push({ points: run, style: styleAt || run[0] });
          run = turn < 25 ? [prev] : [];
          styleAt = point;
        }
        if (!styleAt) styleAt = point;
        run.push(point);
      }
      if (run.length) runs.push({ points: run, style: styleAt || run[0] });
      return runs;
    }

    function addTrackTube(points, radius, color, opacity) {
      if (points.length < 2) return;
      const vectors = points.map((item) => azAltToVec(item.az, item.alt, vrTune.shellRadius - 8));
      const curve = new THREE.CatmullRomCurve3(vectors);
      const geometry = new THREE.TubeGeometry(curve, Math.max(2, (vectors.length - 1) * 3), radius, 5, false);
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        color, transparent: true, opacity, depthWrite: false,
      }));
      trackGroup.add(mesh);
    }

    function drawSkyTrack(points) {
      disposeTrackMeshes();
      const list = Array.isArray(points) ? points : [];
      for (const run of trackRuns(list)) {
        if (run.points.length < 2) continue;
        const sample = run.style || run.points[0];
        const style = trackStyle(sample.light || "night", sample.above);
        if (style.kind === "solid") {
          addTrackTube(run.points, style.radius, style.color, style.opacity);
          continue;
        }
        let index = 0;
        while (index < run.points.length - 1) {
          addTrackTube(run.points.slice(index, index + style.on + 1), style.radius, style.color, style.opacity);
          index += style.on + style.off;
        }
      }
      const now = trackSkyWhen().getTime();
      let nearest = null;
      for (const point of list) {
        const distance = Math.abs(new Date(point.when).getTime() - now);
        if (!nearest || distance < nearest.distance) nearest = { point, distance };
      }
      addHourMarks(list);
      if (!nearest || nearest.distance > 20 * 60 * 1000) return;
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(nearest.point.above ? 2.2 : 1.2, 10, 8),
        new THREE.MeshBasicMaterial({
          color: 0xf8fafc,
          transparent: true,
          opacity: nearest.point.above ? 0.95 : 0.45,
          depthWrite: false,
        }),
      );
      marker.position.copy(azAltToVec(nearest.point.az, nearest.point.alt, vrTune.shellRadius - 8));
      trackGroup.add(marker);
    }

    function hourMarks(points) {
      const list = Array.isArray(points) ? points : [];
      const exact = list.filter((item) => {
        if (!item.when) return false;
        const stamp = new Date(item.when);
        return stamp.getMinutes() === 0 && stamp.getSeconds() === 0;
      });
      if (exact.length) return exact;
      const byHour = new Map();
      for (const item of list) {
        if (!item.when) continue;
        const stamp = new Date(item.when);
        const key = `${stamp.getFullYear()}-${stamp.getMonth()}-${stamp.getDate()}-${stamp.getHours()}`;
        const dist = Math.abs(stamp.getMinutes() * 60 + stamp.getSeconds());
        const prev = byHour.get(key);
        if (!prev || dist < prev.dist) byHour.set(key, { item, dist });
      }
      return [...byHour.values()]
        .filter((entry) => entry.dist <= 20 * 60)
        .map((entry) => entry.item);
    }

    function addHourMarks(points) {
      for (const item of hourMarks(points)) {
        if (!(Number(item.alt) > 0)) continue;
        const style = trackStyle(item.light || "night", item.above);
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(item.above ? 1.9 : 1.15, 10, 8),
          new THREE.MeshBasicMaterial({
            color: style.color,
            transparent: true,
            opacity: item.above ? 0.95 : 0.85,
            depthWrite: false,
          }),
        );
        dot.position.copy(azAltToVec(item.az, item.alt, vrTune.shellRadius - 8));
        trackGroup.add(dot);
        const stamp = new Date(item.when);
        const label = stamp.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", hour12: false });
        const sprite = makeLabelSprite({
          iau: `hour:${item.when}`,
          name: label,
          az: item.az,
          alt: Number(item.alt) + 1.4,
        });
        if (!sprite) continue;
        sprite.material.opacity = 1;
        trackGroup.add(sprite);
      }
    }

    function trackSlice(data, start) {
      const from = start.getTime();
      const to = from + 12 * 60 * 60 * 1000;
      return (data && data.points ? data.points : []).filter((point) => {
        const stamp = new Date(point.when).getTime();
        return stamp >= from - 8 * 60 * 1000 && stamp <= to;
      });
    }

    function trackCovers(start) {
      if (!trackData || !Array.isArray(trackData.points) || !trackData.points.length) return false;
      const end = new Date(trackData.points[trackData.points.length - 1].when).getTime();
      return start.getTime() + 12 * 60 * 60 * 1000 <= end + 16 * 60 * 1000;
    }

    function slicePeak(slice) {
      if (!slice.length) return null;
      let best = slice[0];
      for (const point of slice) if (Number(point.alt) > Number(best.alt)) best = point;
      return {
        point: best,
        interior: best !== slice[0] && best !== slice[slice.length - 1],
      };
    }

    function overlappingWindows(windows, start) {
      const from = start.getTime();
      const to = from + 12 * 60 * 60 * 1000;
      return (Array.isArray(windows) ? windows : []).filter((slot) => {
        const begin = new Date(slot.start).getTime();
        const end = new Date(slot.end).getTime();
        return Number.isFinite(begin) && Number.isFinite(end) && end > from && begin < to;
      });
    }

    async function loadDayTrack() {
      const serial = ++trackSerial;
      const fromSelection = itemHasEquatorial(selectedItem);
      const ra = fromSelection ? Number(selectedItem.ra) : trackRa;
      const dec = fromSelection ? Number(selectedItem.dec) : trackDec;
      const key = fromSelection ? objectKey(selectedItem) : trackItemKey;
      if (!Number.isFinite(ra) || !Number.isFinite(dec)) {
        if (!trackData) {
          trackNote = "Keine RA/Dec für die Bahn.";
          disposeTrackMeshes();
          dashboardKey = "";
          if (panelMode === "track") paintDashboard();
        }
        return;
      }
      trackNote = trackData ? "" : "Lade Bahn …";
      dashboardKey = "";
      if (panelMode === "track") paintDashboard();
      const when = trackSkyWhen();
      const params = new URLSearchParams({
        ra: String(ra),
        dec: String(dec),
        lat: String(siteLat),
        lon: String(siteLon),
        when: when.toISOString(),
        tz_offset_min: String(-new Date().getTimezoneOffset()),
      });
      if (siteStem) params.set("stem", siteStem);
      try {
        const response = await fetch(`/sky-track?${params}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== trackSerial) return;
        if (!response.ok || data.error || !Array.isArray(data.points) || data.points.length < 2) {
          if (!trackData) {
            trackNote = data.error || "Keine Tagesbahndaten";
            disposeTrackMeshes();
          }
        } else {
          trackData = data;
          trackItemKey = key;
          trackRa = ra;
          trackDec = dec;
          trackNote = "";
          drawSkyTrack(data.points);
        }
      } catch (_err) {
        if (serial !== trackSerial) return;
        if (!trackData) {
          trackNote = "Bahn nicht erreichbar";
          disposeTrackMeshes();
        }
      }
      dashboardKey = "";
      if (panelMode === "track") paintDashboard();
    }

    function ensureDayTrack() {
      if (selectedItem && trackItemKey && objectKey(selectedItem) !== trackItemKey) return;
      const when = trackSkyWhen();
      if (trackData && trackItemKey && trackCovers(when)) {
        drawSkyTrack(trackData.points);
        if (panelMode === "track") dashboardKey = "";
        return;
      }
      if (trackData && trackItemKey && !itemHasEquatorial(selectedItem)) {
        drawSkyTrack(trackData.points);
        return;
      }
      loadDayTrack();
    }

    function showDayTrack() {
      if (panelMode !== "track") trackReturn = panelReturn;
      panelMode = "track";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
      ensureDayTrack();
    }

    function closeDayTrack() {
      panelMode = "detail";
      panelReturn = trackReturn || "list";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function paintAltitudeChart(ctx, slice, start) {
      const left = 78;
      const right = 980;
      const top = 196;
      const bottom = 520;
      let minAlt = 0;
      let maxAlt = 20;
      for (const point of slice) {
        minAlt = Math.min(minAlt, Number(point.alt));
        maxAlt = Math.max(maxAlt, Number(point.alt));
      }
      minAlt = Math.floor(minAlt / 10) * 10;
      maxAlt = Math.ceil(maxAlt / 10) * 10;
      if (maxAlt - minAlt < 20) maxAlt = minAlt + 20;
      const xAt = (index) => left + (right - left) * (index / Math.max(1, slice.length - 1));
      const yAt = (alt) => bottom - (bottom - top) * ((alt - minAlt) / (maxAlt - minAlt));
      ctx.strokeStyle = "rgba(148, 163, 184, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left, bottom);
      ctx.lineTo(right, bottom);
      ctx.stroke();
      if (minAlt < 0 && maxAlt > 0) {
        ctx.strokeStyle = "rgba(248, 250, 252, 0.85)";
        ctx.beginPath();
        ctx.moveTo(left, yAt(0));
        ctx.lineTo(right, yAt(0));
        ctx.stroke();
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "22px sans-serif";
        ctx.fillText("0°", 28, yAt(0) + 6);
      }
      ctx.fillStyle = "#94a3b8";
      ctx.font = "22px sans-serif";
      ctx.fillText(`${Math.round(maxAlt)}°`, 18, top + 8);
      ctx.fillText(`${Math.round(minAlt)}°`, 18, bottom);
      const colors = { night: "#5eead4", twilight: "#fbbf24", day: "#fb923c" };
      for (let index = 1; index < slice.length; index += 1) {
        const point = slice[index];
        ctx.strokeStyle = colors[point.light] || "#e2e8f0";
        ctx.globalAlpha = point.above ? 1 : 0.4;
        ctx.lineWidth = point.above ? 5 : 3;
        ctx.beginPath();
        ctx.moveTo(xAt(index - 1), yAt(Number(slice[index - 1].alt)));
        ctx.lineTo(xAt(index), yAt(Number(point.alt)));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const now = start.getTime();
      let nowIndex = 0;
      let nowDistance = Infinity;
      slice.forEach((point, index) => {
        const distance = Math.abs(new Date(point.when).getTime() - now);
        if (distance < nowDistance) {
          nowDistance = distance;
          nowIndex = index;
        }
      });
      ctx.strokeStyle = "#f8fafc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xAt(nowIndex), top);
      ctx.lineTo(xAt(nowIndex), bottom);
      ctx.stroke();
      const peak = slicePeak(slice);
      if (peak) {
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(xAt(slice.indexOf(peak.point)), yAt(Number(peak.point.alt)), 7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#94a3b8";
      ctx.font = "22px sans-serif";
      ctx.fillText(trackClock(slice[0].when), left, bottom + 28);
      ctx.fillText(trackClock(slice[slice.length - 1].when), right - 70, bottom + 28);
    }

    function goBack() {
      if (panelMode === "track") {
        closeDayTrack();
        return;
      }
      if (panelMode === "camera") {
        void closeCameraSession();
        return;
      }
      if (panelMode === "sessions") {
        if (sessionsReturn === "detail" && selectedItem) showObjectDetail(selectedItem);
        else showHome();
        return;
      }
      if (panelMode === "search") {
        showObjectList();
        return;
      }
      if (panelMode === "detail" && panelReturn === "search") {
        showSearchResults();
        return;
      }
      if (panelMode === "detail" && panelReturn === "list") {
        showObjectList();
        return;
      }
      if (panelMode === "detail" && panelReturn === "himmel") {
        showHimmel();
        return;
      }
      if (panelMode === "detail" && panelReturn === "prefs") {
        showPrefs();
        return;
      }
      showHome();
    }

    function resetObjectPanel() {
      showHome();
    }

    function refreshObjectPanel() {
      if (panelMode === "list") {
        updateObjectRows();
        return;
      }
      if (panelMode === "search") {
        updateSearchRows();
        return;
      }
      if (panelMode !== "detail" || !selectedKey || !selectedItem) return;
      if (selectedItem.fromSearch) return;
      const found = findByKey(selectedKey);
      if (found) {
        selectedItem = found;
        selectedMissing = false;
      } else {
        selectedMissing = true;
      }
    }

    function paintDashboard() {
      const ctx = dashboardCanvas.getContext("2d");
      const width = dashboardCanvas.width;
      const height = dashboardCanvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(15, 23, 42, 0.86)";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(125, 211, 252, 0.85)";
      ctx.lineWidth = 6;
      ctx.strokeRect(8, 8, width - 16, height - 16);
      if (panelMode === "list") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Objekte", 48, 28);
        if (!objectChoices().length) {
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "34px sans-serif";
          ctx.fillText("Keine Gestirne in der letzten Antwort.", 48, 100);
        }
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "search") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Suche", 48, 22);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "28px sans-serif";
        const pages = Math.max(1, Math.ceil(searchHits.length / 6));
        const pageText = searchHits.length ? `   Seite ${searchPage + 1} / ${pages}` : "";
        ctx.fillText(`${searchQuery || "—"}${pageText}`, 48, 72);
        if (searchNote) ctx.fillText(searchNote, 48, 112);
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "prefs") {
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "himmel") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Himmel", 48, 22);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "26px sans-serif";
        const markNote = (skyView.messier || skyView.ngcMode !== "off")
          ? `  ·  ${skyView.icons ? "Typen" : "Scheiben"}${skyView.seeing ? " · Unruhe" : ""}`
          : "";
        const ngcNote = skyView.ngcMode === "off"
          ? ""
          : `  ·  ${lastNgc.length} NGC`;
        ctx.fillText(`${skyClockLabel()}  ·  ${lastDso.length} Messier${ngcNote}${markNote}`, 48, 68);
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "track") {
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 36px sans-serif";

        ? "prefs"

        : panelMode === "list"
        ? `list|${objectChoices().map(objectKey).join(",")}|${overlayStateText}`
        : panelMode === "search"
        ? `search|${searchQuery}|${searchPage}|${searchNote}|${searchHits.map((hit) => hit.key || hit.id).join(",")}`
        : panelMode === "track"
        ? `track|${trackItemKey}|${trackNote}|${skyClockLabel()}|${siteStem}`
        : panelMode === "mount"
        ? `mount|${mountView.lines.join("|")}|${questGotoNote}|${axisStatus}|${axisNote}|${axisReadout}|${axisRateIndex}|${skyPointMode}|${skyPick ? `${skyPick.ra}|${skyPick.dec}|${skyPick.blocked}|${skyPick.whenLabel}` : ""}`
        : panelMode === "sessions"
        ? `sessions|${sessionNote}|${sessionPickMode}|${sessionRowsData.map((row) => row.id).join(",")}|${catalogQueryOf(selectedItem)}`

    function paintMenuButton(mesh, title, subtitle) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(title, canvas.width / 2, 34);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "28px sans-serif";
      ctx.fillText(subtitle, canvas.width / 2, 70);
      mesh.userData.texture.needsUpdate = true;
    }

    function paintTextButton(mesh, text) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#f8fafc";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let size = 40;
      ctx.font = `bold ${size}px sans-serif`;
      while (size > 22 && ctx.measureText(text).width > canvas.width - 36) {
        size -= 2;
        ctx.font = `bold ${size}px sans-serif`;
      }
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      mesh.userData.texture.needsUpdate = true;
    }

    function paintAlertButton(mesh, text) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#9f1239";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#fecdd3";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#fff1f2";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      mesh.userData.texture.needsUpdate = true;

    function makeTextButton(label, action, x, y, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 96;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({
          map: texture,
          color: testRest,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          side: THREE.FrontSide,
        }),
      );
      mesh.position.set(x, y, 0.004);
      mesh.renderOrder = 11;
      mesh.userData.action = action;
      mesh.userData.canvas = canvas;
      mesh.userData.texture = texture;
      dashboard.add(mesh);
      paintTextButton(mesh, label);
      return mesh;
    }

    function tabColor(tab) {
      return panelMode === "prefs" && tab.userData.page === prefsPage ? 0xbae6fd : testRest;

    function setHoveredButton(button) {
      if (hoveredButton === button) return;
      if (hoveredButton) {
        const frameColor = frameTypeColor(hoveredButton);
        hoveredButton.material.color.setHex(
          frameColor != null ? frameColor : (prefTabs.includes(hoveredButton) ? tabColor(hoveredButton) : testRest)

      hoveredButton = button;
      if (hoveredButton) hoveredButton.material.color.setHex(testHoverColor);

    function clearPointerHits() {
      pointerHits.clear();
      setHoveredButton(null);
    }

    function takeNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function roundTo(value, step) {
      const places = (String(step).split(".")[1] || "").length;
      return Number(value.toFixed(places));
    }

    function fmtTune(value, digits) {
      let text = value.toFixed(digits);
      if (text.includes(".")) text = text.replace(/0+$/, "").replace(/\.$/, "");
      return text.replace(".", ",");
    }

    function roleLabel(role) {
      if (role === "select") return "Abzug";
      if (role === "squeeze") return "Griff";
      return "Keine";
    }

    function prefText(pref) {
      if (pref === "acquire") return `Treffer ${fmtTune(vrTune.pickAcquireDeg, 2)}°`;
      if (pref === "hold") return `Halten ${fmtTune(vrTune.pickHoldDeg, 2)}°`;
      if (pref === "switch") return `Wechsel ${fmtTune(vrTune.pickSwitchDeg, 2)}°`;
      if (pref === "ray") return `Strahl ${fmtTune(vrTune.rayMeters, 1)} m`;
      if (pref === "ring0") return `Innen ${fmtTune(vrTune.telradHalfDeg[0] * 2, 1)}°`;
      if (pref === "ring1") return `Mitte ${fmtTune(vrTune.telradHalfDeg[1] * 2, 1)}°`;
      if (pref === "ring2") return `Außen ${fmtTune(vrTune.telradHalfDeg[2] * 2, 1)}°`;
      if (pref === "label") return `Namen ${fmtTune(vrTune.labelHeight, 0)}`;
      if (pref === "panel") return `Tafel ${Math.round(vrTune.panelScale * 100)} %`;
      if (pref === "pano") return `Foto ${Math.round(vrTune.panoBrightness)} %`;
      if (pref === "mark") return "Markierung Telrad";
      if (pref === "dashboard") return `Öffnen ${roleLabel(controlRoles.dashboard)}`;
      if (pref === "aim") return `Zielhilfe ${roleLabel(controlRoles.aimToggle)}`;
      return pref;
    }

      camSkipDarksButton.visible = cameraPrompt;

      try {
        const response = await fetch("/mount-session", { cache: "no-store", credentials: "same-origin" });
        const data = await response.json();

        mountPaired = false;
      }

    function showQuestGoto() {
      if (!selectedItem || !itemHasEquatorial(selectedItem)) return;
      if (selectedItem.fromSky && selectedItem.blocked) {
        questGotoNote = selectedItem.blocked;
        dashboardKey = "";
        paintDashboard();
        return;
      }
      questGotoNote = "";
      panelMode = "goto";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();

      questGotoNote = "";

      else if (selectedItem) showObjectDetail(selectedItem);
      else showHome();

    function worldPointToAzAlt(world) {
      skyLocal.copy(world);
      sphere.worldToLocal(skyLocal);
      const radius = skyLocal.length();
      if (radius < 1) return null;
      const alt = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(skyLocal.y / radius, -1, 1)));
      const viewLon = (THREE.MathUtils.radToDeg(Math.atan2(skyLocal.z, skyLocal.x)) + 360) % 360;
      const az = (viewLon - northOffset + 360) % 360;
      return { az, alt };
    }

    function skyPointWhenLabel(iso, frozen) {
      if (!frozen) return "Zeit live";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "Zeit fest";
      const clock = date.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", hour12: false });
      return `Zeit fest ${clock}`;
    }

    function skyPointLines() {
      if (!skyPick) {
        return skyPointMode ? ["Abzug auf den Himmel übernimmt den Punkt. Keine Fahrt."] : [];
