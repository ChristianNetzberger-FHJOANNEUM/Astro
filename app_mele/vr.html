      const lines = [
        `Punkt Az ${fmtMountDeg(skyPick.az, false)}    Höhe ${fmtMountDeg(skyPick.alt, true)}`,
        `RA ${fmtRa(skyPick.ra)}`,
        `Dec ${fmtDec(skyPick.dec)}`,
        skyPick.whenLabel || "Zeit live",
      ];
      if (skyPick.blocked) lines.push(skyPick.blocked);
      else if (skyPointMode) lines.push("Abzug setzt einen neuen Punkt.");
      return lines;
    }

    function toggleSkyPointMode() {
      skyPointMode = !skyPointMode;
      questGotoNote = skyPointMode ? "Abzug auf den Himmel übernimmt den Punkt." : "";
      dashboardKey = "";
      syncPanelButtons();
      paintDashboard();
    }

    async function adoptSkyPoint(az, alt) {
      const serial = ++skyPointSerial;
      const params = new URLSearchParams({ az: String(az), alt: String(alt) });
      const when = skyWhenParam();
      if (when) params.set("when", when);
      try {
        const response = await fetch(`/sky/point?${params}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== skyPointSerial) return;
        if (!response.ok || !data.ok) {
          skyPick = null;
          questGotoNote = (data && data.error) || "Punkt nicht auflösbar";
          dashboardKey = "";
          syncPanelButtons();
          paintDashboard();
          return;
        }
        skyPick = {
          id: "sky-point",
          kind: "sky",
          name: "Himmelspunkt",
          fromSky: true,
          az: Number(data.az),
          alt: Number(data.alt),
          ra: Number(data.ra),
          dec: Number(data.dec),
          blocked: data.blocked || "",
          whenLabel: skyPointWhenLabel(data.when, Boolean(data.frozen)),
        };
        questGotoNote = skyPick.blocked || "";
        adoptNavTarget(skyPick, "sky");
      } catch (_err) {
        if (serial !== skyPointSerial) return;
        skyPick = null;
        questGotoNote = "Punkt nicht erreichbar";
      }
      dashboardKey = "";
      syncPanelButtons();
      paintDashboard();
    }

    async function confirmSkyPointGoto(item) {
      if (!item || item.blocked || !itemHasEquatorial(item)) {
        questGotoNote = (item && item.blocked) || "Punkt fehlt";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (!mountCsrf) {
        questGotoNote = "Zuerst mit dem Code am MeLE koppeln.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      questGotoNote = "GoTo wird gesendet …";
      dashboardKey = "";
      paintDashboard();
      adoptNavTarget(item, "sky");
      mountView.targetName = "Himmelspunkt";
      try {
        const response = await fetch(
          `/nina/mount/slew?ra=${encodeURIComponent(item.ra)}&dec=${encodeURIComponent(item.dec)}`,
          {
            method: "POST",
            credentials: "same-origin",
            headers: { "X-Astro-Csrf": mountCsrf },
          },
        );
        const data = await response.json();
        if (!response.ok || !data.ok) {
          questGotoNote = data.error || "GoTo abgelehnt";
          dashboardKey = "";
          paintDashboard();
          return;
        }
        questGotoNote = "GoTo gesendet. Stillstand erst nach der Montierungsmeldung.";
        showMount();
      } catch (err) {
        questGotoNote = err && err.message ? err.message : "GoTo nicht gesendet";
        dashboardKey = "";
        paintDashboard();
      }
    }

    async function confirmQuestGoto() {
      const item = selectedItem;
      if (item && item.fromSky) {
        confirmSkyPointGoto(item);
        return;
      }
      const target = questTargetOf(item);
      if (!item || !target) return;
      if (!mountCsrf) {
        questGotoNote = "Zuerst mit dem Code am MeLE koppeln.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      questGotoNote = "GoTo wird gesendet …";
      dashboardKey = "";
      paintDashboard();
      adoptNavTarget(item, item.fromSearch ? "resolve" : "overlay");
      mountView.targetName = item.name || item.id || target;
      try {
        const response = await fetch(`/nina/mount/slew?target=${encodeURIComponent(target)}`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "X-Astro-Csrf": mountCsrf },
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          questGotoNote = data.error || "GoTo abgelehnt";
          dashboardKey = "";
          paintDashboard();
          return;
        }
        questGotoNote = "GoTo gesendet. Stillstand erst nach der Montierungsmeldung.";
        showMount();
      } catch (err) {
        questGotoNote = err && err.message ? err.message : "GoTo nicht gesendet";
        dashboardKey = "";
        paintDashboard();
      }
    }

    function axisRateText() {
      const value = AXIS_RATES[axisRateIndex];
      const text = Number(value).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
      return `${text.replace(".", ",")} °/s`;
    }

    function paintAxisRate() {
      paintTextButton(axisRateLabel, axisRateText());
    }

    function stepAxisRate(dir) {
      const next = axisRateIndex + dir;
      if (next < 0 || next >= AXIS_RATES.length) return;
      axisRateIndex = next;
      paintAxisRate();
      dashboardKey = "";
      paintDashboard();
    }

    function mountPollText() {
      const ms = MOUNT_POLL_MS[mountPollIndex];
      if (ms >= 1000) return "Lage 1 s";
      const text = (ms / 1000).toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
      return `Lage ${text.replace(".", ",")} s`;
    }

    function paintMountPoll() {
      paintTextButton(mountPollLabel, mountPollText());
    }

    function applyMountPoll() {
      if (mountPollTimer) clearInterval(mountPollTimer);
      mountPollTimer = setInterval(pollMount, MOUNT_POLL_MS[mountPollIndex]);
    }

    function stepMountPoll(dir) {
      const next = mountPollIndex + dir;
      if (next < 0 || next >= MOUNT_POLL_MS.length) return;
      mountPollIndex = next;
      applyMountPoll();
      paintMountPoll();
      dashboardKey = "";
      paintDashboard();
    }

    function questStickDirection(x, y) {
      if (!Number.isFinite(x) || !Number.isFinite(y)) return "";
      const ax = Math.abs(x);
      const ay = Math.abs(y);
      if (ax < AXIS_DEADZONE && ay < AXIS_DEADZONE) return "";
      if (ax >= ay) return x > 0 ? "east" : "west";
      return y > 0 ? "north" : "south";
    }

    function axisDirectionLabel(direction) {
      if (direction === "east") return "RA Ost";
      if (direction === "west") return "RA West";
      if (direction === "north") return "Dec Nord";
      if (direction === "south") return "Dec Süd";
      return "Mitte";
    }

    function questThumbstick(pad) {
      if (!pad || pad.mapping !== "xr-standard" || !pad.axes) return null;
      if (pad.axes.length >= 4) {
        const x = Number(pad.axes[2]);
        const y = -Number(pad.axes[3]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
        return { x: x, y: y };
      }
      if (pad.axes.length >= 2) {
        const x = Number(pad.axes[0]);
        const y = Number(pad.axes[1]);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
        return { x: x, y: y };
      }
      return null;
    }

    function rightAxisGamepad(session) {
      const sources = session && session.inputSources ? Array.from(session.inputSources) : [];
      for (const source of sources) {
        if (!source || source.handedness !== "right") continue;
        const pad = source.gamepad;
        if (!questThumbstick(pad)) continue;
        const profiles = source.profiles || [];
        if (profiles.length && !profiles.some((name) => AXIS_PROFILES.indexOf(name) >= 0)) continue;
        return pad;
      }
      return null;
    }

    function leaveAxisMode(note) {
      if (!axisMode) return;
      const token = axisToken;
      axisMode = false;
      axisArmed = false;
      axisDirection = "";
      axisStatus = note ? "FEHLER" : "AUS";
      axisNote = note || "Aus";
      if (token) requestAxisStop(token, false);
      dashboardKey = "";
    }

    function enableAxisMode() {
      if (!mountCsrf || !mountPaired) {
        axisStatus = "GESPERRT";
        axisNote = "Zuerst koppeln.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (mountView.motionLabel === "GoTo aktiv" || mountView.slewing) {
        axisStatus = "GESPERRT";
        axisNote = "GoTo läuft.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (mountView.motion === "unklar" || mountView.motion === "faehrt" || mountView.motion === "stoppt") {
        axisStatus = "GESPERRT";
        axisNote = mountView.motionDetail || mountView.status || "Zustand nicht frei.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      axisMode = true;
      axisArmed = false;
      axisDirection = "";
      axisStatus = "BEREIT";
      axisNote = "Joystick zuerst in die Mitte.";
      dashboardKey = "";
      syncPanelButtons();
      paintDashboard();
    }

    async function requestAxisStop(token, force) {
      if (!token) return;
      if (!force && token === axisStopToken) return;
      axisStopToken = token;
      try {
        const headers = { "Content-Type": "application/json" };
        if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
        const response = await fetch("/nina/mount/move/stop", {
          method: "POST",
          credentials: "same-origin",
          headers,
          body: JSON.stringify({ token: token }),
        });
        const data = await response.json();
        if (token !== axisToken && axisToken) return;
        if (data && data.message === "älterer Achsen-Stopp verworfen") return;
        if (data && data.message === "GoTo läuft, Achsen-Stopp nicht gesendet") {
          axisStatus = "GESPERRT";
          axisNote = data.message;
          dashboardKey = "";
          return;
        }
        if (!response.ok || !data.rate0_sent) {
          axisStatus = "FEHLER";
          axisNote = (data && (data.error || data.message)) || "STOP ACHSE nicht bestätigt";
          dashboardKey = "";
          return;
        }
        if (axisMode) axisStatus = "STOPPT";
        axisNote = "Rate 0 gesendet. Stillstand ist nicht bestätigt.";
      } catch (_err) {
        if (token !== axisToken && axisToken) return;
        axisStatus = "FEHLER";
        axisNote = "STOP ACHSE nicht gesendet";
      }
      dashboardKey = "";
    }

    async function sendAxisPulse(token, direction) {
      if (axisBusy) return;
      if (token !== axisToken || !axisMode || !axisArmed) return;
      axisBusy = true;
      axisPulseAt = performance.now();
      try {
        const headers = { "Content-Type": "application/json" };
        if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
        const response = await fetch("/nina/mount/move", {
          method: "POST",
          credentials: "same-origin",
          headers,
          body: JSON.stringify({ direction: direction, rate: AXIS_RATES[axisRateIndex], token: token }),
        });
        const data = await response.json();
        if (token !== axisToken || !axisMode) return;
        if (!response.ok || !data.ok) {
          const error = (data && data.error) || "Achse abgelehnt";
          axisArmed = false;
          axisDirection = "";
          if (error.indexOf("PHD2") >= 0 || error.indexOf("GoTo") >= 0) {
            axisStatus = "GESPERRT";
          } else if (error.indexOf("überholt") >= 0 || error.indexOf("Stopp") >= 0) {
            axisStatus = "STOPPT";
          } else {
            axisStatus = "FEHLER";
            requestAxisStop(token, true);
          }
          axisNote = error;
          return;
        }
        if (axisDirection === direction && axisArmed) {
          axisStatus = "BEWEGT";
          axisNote = axisDirectionLabel(direction);
        }
      } catch (_err) {
        if (token !== axisToken || !axisMode) return;
        axisArmed = false;
        axisDirection = "";
        axisStatus = "FEHLER";
        axisNote = "Verbindung unterbrochen";
        requestAxisStop(token, true);
      } finally {
        axisBusy = false;
        dashboardKey = "";
      }
    }

    function noteAxisPanel() {
      const key = `${axisStatus}|${axisNote}|${axisReadout}`;
      if (key === axisPanelKey) return;
      axisPanelKey = key;
      dashboardKey = "";
    }

    function pollAxisStick() {
      const session = renderer.xr.getSession();
      const pad = rightAxisGamepad(session);
      if (!pad) {
        axisReadout = "Rechter Joystick nicht erkannt";
        if (axisMode) leaveAxisMode("Rechter Controller weg. Achse gestoppt.");
        noteAxisPanel();
        return;
      }
      const stick = questThumbstick(pad);
      const direction = stick ? questStickDirection(stick.x, stick.y) : "";
      const sx = stick ? stick.x.toFixed(2).replace(".", ",") : "—";
      const sy = stick ? stick.y.toFixed(2).replace(".", ",") : "—";
      axisReadout = `Joystick ${axisDirectionLabel(direction)}  ${sx} / ${sy}`;
      if (!axisMode) {
        noteAxisPanel();
        return;
      }
      if (!axisArmed) {
        if (mountView.motion === "stoppt") {
          axisStatus = "STOPPT";
          axisNote = "Warten auf Bereit.";
          noteAxisPanel();
          return;
        }
        if (mountView.motion === "unklar" || mountView.slewing || mountView.motionLabel === "GoTo aktiv") {
          axisStatus = "GESPERRT";
          axisNote = mountView.motionDetail || mountView.status || "Zustand nicht frei.";
          noteAxisPanel();
          return;
        }
        if (!direction && mountView.motion === "bereit") {
          axisArmed = true;
          axisToken += 1;
          axisStatus = "BEREIT";
          axisNote = "Mitte erkannt. Auslenken bewegt langsam.";
          noteAxisPanel();
          return;
        }
        axisStatus = "BEREIT";
        axisNote = "Joystick zuerst in die Mitte.";
        noteAxisPanel();
        return;
      }
      if (mountView.motionDetail === "Rate 0 nicht gesendet") {
        axisArmed = false;
        axisDirection = "";
        axisStatus = "FEHLER";
        axisNote = "Rate 0 nicht gesendet";
        noteAxisPanel();
        return;
      }
      if (mountView.motion === "faehrt" && mountView.motionLabel !== "Achsbewegung aktiv" && mountView.motionLabel !== "GoTo aktiv") {
        axisArmed = false;
        axisDirection = "";
        axisStatus = "GESPERRT";
        axisNote = "Andere Bewegung aktiv.";
        noteAxisPanel();
        return;
      }
      if (mountView.motionLabel === "GoTo aktiv") {
        const token = axisToken;
        axisArmed = false;
        axisDirection = "";
        axisStatus = "GESPERRT";
        axisNote = "GoTo läuft.";
        requestAxisStop(token, true);
        noteAxisPanel();
        return;
      }
      if (!direction) {
        if (axisDirection) {
          const token = axisToken;
          axisDirection = "";
          axisArmed = false;
          axisStatus = "STOPPT";
          axisNote = "Joystick Mitte. STOP ACHSE.";
          requestAxisStop(token, false);
        }
        noteAxisPanel();
        return;
      }
      if (mountView.motion === "stoppt" || mountView.motion === "unklar") {
        axisArmed = false;
        axisDirection = "";
        axisStatus = mountView.motion === "unklar" ? "FEHLER" : "STOPPT";
        axisNote = mountView.motion === "unklar" ? (mountView.motionDetail || "Zustand unklar.") : "Warten auf Bereit.";
        noteAxisPanel();
        return;
      }
      const now = performance.now();
      if (direction === axisDirection && now - axisPulseAt < AXIS_PULSE_MS) {
        noteAxisPanel();
        return;
      }
      axisDirection = direction;
      sendAxisPulse(axisToken, direction);
      noteAxisPanel();
    }

    async function requestMountStop() {
      questGotoNote = "STOP wird gesendet …";
      try {
        const headers = {};
        if (mountCsrf) headers["X-Astro-Csrf"] = mountCsrf;
        const response = await fetch("/nina/mount/slew/stop", {
          method: "POST",
          credentials: "same-origin",
          headers,
        });
        const data = await response.json();
        const label = data.motion && data.motion.label ? data.motion.label : "";
        if (!response.ok || !data.ok) {
          questGotoNote = `${data.error || "STOP nicht bestätigt"}${label ? ` · ${label}` : ""}`;
        } else {
          questGotoNote = `STOP gesendet. Stillstand ist nicht bestätigt.${label ? ` · ${label}` : ""}`;
        }
      } catch (err) {
        questGotoNote = err && err.message ? err.message : "STOP nicht gesendet";
      }
      if (!dashboard.visible) placeDashboard();
      if (panelMode === "home" || panelMode === "detail" || panelMode === "goto") showMount();
      else {
        dashboardKey = "";
        paintDashboard();
      }
    }

    function showPair() {
      if (axisMode) leaveAxisMode("");
      pairEntry = "";
      questGotoNote = "";
      panelMode = "pair";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    async function submitPair() {
      if (pairEntry.length !== 6) {
        questGotoNote = "Sechs Ziffern vom MeLE-Bildschirm.";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      try {
        const response = await fetch("/mount-session/pair", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: pairEntry }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok || !data.csrf) {
          questGotoNote = data.error || "Kopplung abgelehnt";
          dashboardKey = "";
          paintDashboard();
          return;
        }
        mountCsrf = data.csrf;
        mountPaired = true;
        pairEntry = "";
        questGotoNote = "Gekoppelt.";
        showMount();
      } catch (err) {
        questGotoNote = err && err.message ? err.message : "Kopplung nicht gesendet";
        dashboardKey = "";
        paintDashboard();
      }
    }

    function skyClockLabel() {
      const stamp = skyView.live || !skyView.when
        ? formatWhen(skyWhen)
        : formatWhen(skyView.when.toISOString());
      return `${stamp} · ${skyView.live ? "Live" : "fest"}`;
    }

    function paintHimmelButtons() {
      paintTextButton(skyStarsBtn, skyView.stars ? "Sterne EIN" : "Sterne AUS");
      paintTextButton(skyConstBtn, skyView.constellations ? "Sternbilder EIN" : "Sternbilder AUS");
      paintTextButton(skyMessierBtn, skyView.messier ? "Messier EIN" : "Messier AUS");
      paintTextButton(skyMagLabel, `${skyView.mag.toFixed(1).replace(".", ",")} mag`);
      paintTextButton(skyLiveBtn, skyView.live ? "LIVE EIN" : "LIVE AUS");
      paintTextButton(skyIconBtn, skyView.icons ? "Form TYPEN" : "Form SCHEIBE");
      paintTextButton(skySeeingBtn, skyView.seeing ? "Unruhe EIN" : "Unruhe AUS");
      const ngcLabel = skyView.ngcMode === "mine" ? "NGC MEINE" : skyView.ngcMode === "all" ? "NGC ALLE" : "NGC AUS";
      paintTextButton(skyNgcBtn, ngcLabel);
      paintTextButton(skyNgcMinLabel, `≥ ${skyView.ngcMin}`);
      const marksOn = panelMode === "himmel" && (skyView.messier || skyView.ngcMode !== "off");
      skyIconBtn.visible = marksOn;
      skySeeingBtn.visible = marksOn;
      const mine = panelMode === "himmel" && skyView.ngcMode === "mine";
      skyNgcMinMinus.visible = mine;
      skyNgcMinLabel.visible = mine;
      skyNgcMinPlus.visible = mine;
    }

    function applyMessierSeeing(timeMs) {
      for (const object of skyObjects) {
        if (!object.userData.dsoPoints) continue;
        const uniforms = object.material && object.material.uniforms;
        if (!uniforms || !uniforms.uSeeing) continue;
        uniforms.uSeeing.value = skyView.seeing ? 1 : 0;
        if (skyView.seeing && uniforms.uTime) uniforms.uTime.value = timeMs * 0.001;
      }
    }

    function toggleMessierIcons() {
      skyView.icons = !skyView.icons;
      paintHimmelButtons();
      dashboardKey = "";
      rebuildDsoMarks();
      savePrefs();
    }

    function cycleNgcMode() {
      skyView.ngcMode = skyView.ngcMode === "off" ? "mine" : skyView.ngcMode === "mine" ? "all" : "off";
      if (skyKey && !findByKey(skyKey)) {
        skyKey = "";
        skyMark.visible = false;
      }
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
      savePrefs();
    }

    function stepNgcMin(dir) {
      const next = Math.min(5, Math.max(1, skyView.ngcMin + dir));
      if (next === skyView.ngcMin) return;
      skyView.ngcMin = next;
      paintHimmelButtons();
      dashboardKey = "";
      if (skyView.ngcMode === "mine") requestSky(true);
      savePrefs();
    }

    function toggleMessierSeeing() {
      skyView.seeing = !skyView.seeing;
      applyMessierSeeing(performance.now());
      paintHimmelButtons();
      dashboardKey = "";
      savePrefs();
    }

    function toggleSky(which) {
      if (which === "stars") skyView.stars = !skyView.stars;
      else if (which === "const") skyView.constellations = !skyView.constellations;
      else if (which === "messier") {
        skyView.messier = !skyView.messier;
        if (!skyView.messier) hideMessierMarks();
        if (skyKey && !findByKey(skyKey)) {
          skyKey = "";
          skyMark.visible = false;
        }
        refreshObjectPanel();
      }
      else if (which === "live") {
        skyView.live = !skyView.live;
        if (skyView.live) skyView.when = null;
        else if (!skyView.when) skyView.when = skyWhen ? new Date(skyWhen) : new Date();
        syncSkyClock();
        paintHimmelButtons();
        dashboardKey = "";
        if (skyView.live) requestSky(true);
        return;
      }
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
      savePrefs();
    }

    function stepSkyMag(dir) {
      const next = Math.min(9, Math.max(0, Math.round((skyView.mag + dir * 0.5) * 2) / 2));
      if (next === skyView.mag) return;
      skyView.mag = next;
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
      savePrefs();
    }

    function freezeSkyNow() {
      skyView.live = false;
      skyView.when = new Date();
      syncSkyClock();
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function stepSkyTime(seconds) {
      skyView.live = false;
      const base = skyView.when ? skyView.when.getTime() : Date.now();
      skyView.when = new Date(base + seconds * 1000);
      syncSkyClock();
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function showPrefs() {
      panelMode = "prefs";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function closePrefs() {
      showHome();
    }

    function applyRayLength() {
      for (const pointer of pointers) pointer.line.scale.z = vrTune.rayMeters;
    }

    function rebuildTelrad() {
      while (telrad.children.length) {
        const child = telrad.children[0];
        telrad.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      for (const halfDeg of vrTune.telradHalfDeg) {
        const ring = makeRing(
          vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(halfDeg)),
          vrTune.telradColor,
        );
        ring.renderOrder = 5;
        telrad.add(ring);
      }
      fillGreenTelrad();
    }

    function applyPanelScale() {
      dashboard.scale.setScalar(vrTune.panelScale);
    }

    function applyLabelHeight() {
      const height = vrTune.labelHeight;
      sky.traverse((object) => {
        if (!object.userData || !object.userData.labelSprite || !object.material) return;
        const image = object.material.map && object.material.map.image;
        const aspect = image && image.height ? image.width / image.height : 4;
        const factor = Number(object.userData.labelScale) || 1;
        object.scale.set(height * factor * aspect, height * factor, 1);
      });
      if (!skyLabelText) return;
      const name = skyLabelText;
      skyLabelText = "";
      paintSkyLabel(name);
    }

    function enforceRoles() {
      if (controlRoles.dashboard !== "select" && controlRoles.dashboard !== "squeeze") {
        controlRoles.dashboard = controlDefaults.dashboard;
      }
      if (controlRoles.aimToggle !== "" && controlRoles.aimToggle !== "select" && controlRoles.aimToggle !== "squeeze") {
        controlRoles.aimToggle = "";
      }
      if (controlRoles.aimToggle === controlRoles.dashboard) controlRoles.aimToggle = "";
    }

    function bindControlRoles() {
      const session = renderer.xr.getSession();
      if (!session) return;
      unbindControlRoles(session);
      session.addEventListener(controlRoles.dashboard, onSelect);
      session.addEventListener("selectstart", onDragStart);
      session.addEventListener("selectend", onDragEnd);
      if (controlRoles.aimToggle) session.addEventListener(controlRoles.aimToggle, onAimToggle);
    }

    function unbindControlRoles(session) {
      if (!session) return;
      session.removeEventListener("select", onSelect);
      session.removeEventListener("squeeze", onSelect);
      session.removeEventListener("selectstart", onDragStart);
      session.removeEventListener("selectend", onDragEnd);
      session.removeEventListener("select", onAimToggle);
      session.removeEventListener("squeeze", onAimToggle);
    }

    function savePrefs() {
      const payload = {
        v: 1,
        tune: {
          labelHeight: vrTune.labelHeight,
          rayMeters: vrTune.rayMeters,
          telradHalfDeg: vrTune.telradHalfDeg.slice(),
          pickAcquireDeg: vrTune.pickAcquireDeg,
          pickHoldDeg: vrTune.pickHoldDeg,
          pickSwitchDeg: vrTune.pickSwitchDeg,
          panelScale: vrTune.panelScale,
          panoBrightness: vrTune.panoBrightness,
        },
        roles: {
          dashboard: controlRoles.dashboard,
          aimToggle: controlRoles.aimToggle,
        },
        sky: {
          stars: skyView.stars,
          constellations: skyView.constellations,
          messier: skyView.messier,
          icons: skyView.icons,
          seeing: skyView.seeing,
          ngcMode: skyView.ngcMode,
          ngcMin: skyView.ngcMin,
          mag: skyView.mag,
        },
      };
      try {
        localStorage.setItem(prefKey, JSON.stringify(payload));
      } catch (err) {
        /* Der Browser kann die Ablage verweigern. Die Werte gelten dann nur für diese Seite. */
      }
    }

    function loadPrefs() {
      let data = null;
      try {
        data = JSON.parse(localStorage.getItem(prefKey) || "null");
      } catch (err) {
        data = null;
      }
      if (!data || data.v !== 1 || typeof data !== "object") return;
      const tune = data.tune || {};
      vrTune.labelHeight = takeNumber(tune.labelHeight, 4, 12, vrDefaults.labelHeight);
      vrTune.rayMeters = takeNumber(tune.rayMeters, 0.5, 6, vrDefaults.rayMeters);
      vrTune.pickAcquireDeg = takeNumber(tune.pickAcquireDeg, 0.05, 1.5, vrDefaults.pickAcquireDeg);
      vrTune.pickHoldDeg = takeNumber(tune.pickHoldDeg, 0.1, 2, vrDefaults.pickHoldDeg);
      vrTune.pickSwitchDeg = takeNumber(tune.pickSwitchDeg, 0.02, 0.5, vrDefaults.pickSwitchDeg);
      vrTune.panelScale = takeNumber(tune.panelScale, 1, 2, vrDefaults.panelScale);
      vrTune.panoBrightness = takeNumber(tune.panoBrightness, 0, 100, vrDefaults.panoBrightness);
      if (vrTune.pickHoldDeg < vrTune.pickAcquireDeg) vrTune.pickHoldDeg = vrTune.pickAcquireDeg;
      if (Array.isArray(tune.telradHalfDeg) && tune.telradHalfDeg.length === 3) {
        vrTune.telradHalfDeg = [0, 1, 2].map((index) => takeNumber(
          tune.telradHalfDeg[index],
          0.1,
          5,
          vrDefaults.telradHalfDeg[index],
        ));
      }
      const roles = data.roles || {};
      if (roles.dashboard === "select" || roles.dashboard === "squeeze") controlRoles.dashboard = roles.dashboard;
      if (roles.aimToggle === "" || roles.aimToggle === "select" || roles.aimToggle === "squeeze") {
        controlRoles.aimToggle = roles.aimToggle;
      }
      enforceRoles();
      applyRayLength();
      rebuildTelrad();
      applyPanelScale();
      applyPanoBrightness();
      const sky = data.sky || {};
      if (typeof sky.stars === "boolean") skyView.stars = sky.stars;
      if (typeof sky.constellations === "boolean") skyView.constellations = sky.constellations;
      if (typeof sky.messier === "boolean") skyView.messier = sky.messier;
      if (typeof sky.icons === "boolean") skyView.icons = sky.icons;
      if (typeof sky.seeing === "boolean") skyView.seeing = sky.seeing;
      if (sky.ngcMode === "off" || sky.ngcMode === "mine" || sky.ngcMode === "all") skyView.ngcMode = sky.ngcMode;
      skyView.ngcMin = Math.min(5, Math.max(1, Math.round(Number(sky.ngcMin) || skyView.ngcMin)));
      skyView.mag = takeNumber(sky.mag, 0, 9, skyView.mag);
      skyView.live = true;
      skyView.when = null;
    }

    function stepPref(pref, dir) {
      const specs = {
        acquire: [() => vrTune.pickAcquireDeg, (value) => { vrTune.pickAcquireDeg = value; }, 0.05, 1.5, 0.05],
        hold: [() => vrTune.pickHoldDeg, (value) => { vrTune.pickHoldDeg = value; }, 0.1, 2, 0.05],
        switch: [() => vrTune.pickSwitchDeg, (value) => { vrTune.pickSwitchDeg = value; }, 0.02, 0.5, 0.02],
        ray: [() => vrTune.rayMeters, (value) => { vrTune.rayMeters = value; applyRayLength(); }, 0.5, 6, 0.5],
        label: [() => vrTune.labelHeight, (value) => { vrTune.labelHeight = value; applyLabelHeight(); }, 4, 12, 1],
        panel: [() => vrTune.panelScale, (value) => { vrTune.panelScale = value; applyPanelScale(); }, 1, 2, 0.1],
        pano: [() => vrTune.panoBrightness, (value) => { vrTune.panoBrightness = value; applyPanoBrightness(); }, 0, 100, 10],
        ring0: [() => vrTune.telradHalfDeg[0] * 2, (value) => { vrTune.telradHalfDeg[0] = value / 2; }, 0.2, 10, 0.1],
        ring1: [() => vrTune.telradHalfDeg[1] * 2, (value) => { vrTune.telradHalfDeg[1] = value / 2; }, 0.2, 10, 0.1],
        ring2: [() => vrTune.telradHalfDeg[2] * 2, (value) => { vrTune.telradHalfDeg[2] = value / 2; }, 0.2, 10, 0.1],
      };
      const spec = specs[pref];
      if (!spec) return;
      const [read, write, min, max, step] = spec;
      const next = roundTo(Math.min(max, Math.max(min, read() + dir * step)), step);
      if (next === roundTo(read(), step)) return;
      write(next);
      if (vrTune.pickHoldDeg < vrTune.pickAcquireDeg) {
        if (pref === "acquire") vrTune.pickHoldDeg = vrTune.pickAcquireDeg;
        else vrTune.pickAcquireDeg = vrTune.pickHoldDeg;
      }
      if (pref === "ring0" || pref === "ring1" || pref === "ring2") rebuildTelrad();
      savePrefs();
      refreshPrefLabels();
    }

    function cycleRole(pref) {
      if (pref === "dashboard") {
        controlRoles.dashboard = controlRoles.dashboard === "squeeze" ? "select" : "squeeze";
      } else if (pref === "aim") {
        const free = controlRoles.dashboard === "select" ? "squeeze" : "select";
        controlRoles.aimToggle = controlRoles.aimToggle === free ? "" : free;
      } else {
        return;
      }
      aimEnabled = true;
      enforceRoles();
      bindControlRoles();
      savePrefs();
      refreshPrefLabels();
    }

    function resetPrefs() {
      vrTune.labelHeight = vrDefaults.labelHeight;
      vrTune.rayMeters = vrDefaults.rayMeters;
      vrTune.telradHalfDeg = vrDefaults.telradHalfDeg.slice();
      vrTune.pickAcquireDeg = vrDefaults.pickAcquireDeg;
      vrTune.pickHoldDeg = vrDefaults.pickHoldDeg;
      vrTune.pickSwitchDeg = vrDefaults.pickSwitchDeg;
      vrTune.panelScale = vrDefaults.panelScale;
      vrTune.panoBrightness = vrDefaults.panoBrightness;
      controlRoles.dashboard = controlDefaults.dashboard;
      controlRoles.aimToggle = controlDefaults.aimToggle;
      aimEnabled = true;
      try {
        localStorage.removeItem(prefKey);
      } catch (err) {
        /* Bleibt der alte Eintrag stehen, setzt der nächste Wechsel ihn neu. */
      }
      applyRayLength();
      rebuildTelrad();
      applyLabelHeight();
      applyPanelScale();
      applyPanoBrightness();
      bindControlRoles();
      refreshPrefLabels();
    }

    function aimActive() {
      return !controlRoles.aimToggle || aimEnabled;
    }

    function onAimToggle() {
      aimEnabled = !aimEnabled;
      if (aimActive()) return;
      clearNavTarget();
      clearSkyCandidate();
      hideSkyAim();
      for (const pointer of pointers) pointer.line.visible = false;
    }

    function fillGreenTelrad() {
      while (greenTelrad.children.length) {
        const child = greenTelrad.children[0];
        greenTelrad.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      while (navTurn.children.length) {
        const child = navTurn.children[0];
        navTurn.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      const outer = Math.max(...vrTune.telradHalfDeg);
      for (const halfDeg of vrTune.telradHalfDeg) {
        const ring = makeRing(
          vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(halfDeg)),
          navColor,
        );
        ring.renderOrder = 5;
        greenTelrad.add(ring);
      }
      const turn = makeRing(
        vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(outer + 0.35)),
        navColor,
      );
      turn.renderOrder = 7;
      navTurn.add(turn);
      navReachedDrawn = false;
      fillMountTelrad();
    }

    function fillMountTelrad() {
      const rings = mountTelrad.children.slice();
      for (const child of rings) {
        mountTelrad.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      for (const halfDeg of vrTune.telradHalfDeg) {
        const ring = makeRing(
          vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(halfDeg)),
          mountColor,
        );
        ring.renderOrder = 4;
        mountTelrad.add(ring);
      }
    }

    function hideMountTelrad() {
      mountTelrad.visible = false;
      mountLabel.visible = false;
    }

    function placeMountTelrad() {
      if (!mountView.valid || !Number.isFinite(mountView.az) || !Number.isFinite(mountView.alt)) {
        hideMountTelrad();
        return;
      }
      mountPoint.copy(azAltToVec(mountView.az, mountView.alt, vrTune.shellRadius));
      sphere.localToWorld(mountPoint);
      if (mountPoint.lengthSq() < 1) {
        hideMountTelrad();
        return;
      }
      mountTelrad.position.copy(mountPoint);
      mountTelrad.lookAt(0, 0, 0);
      mountTelrad.visible = true;
      tangentUp(mountPoint, navLocalY);
      mountLabel.position.copy(mountPoint).addScaledVector(navLocalY, navOuterReach(8));
      mountLabel.visible = true;
    }

    function paintGreen(reached) {
      if (navReachedDrawn === reached) return;
      navReachedDrawn = reached;
      const color = reached ? navReachedColor : navColor;
      const opacity = reached ? 1 : 0.85;
      for (const ring of greenTelrad.children) {
        ring.material.color.setHex(color);
        ring.material.opacity = opacity;
      }
    }

    function navOuterReach(extra) {
      const outer = Math.max(...vrTune.telradHalfDeg);
      return vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(outer)) + extra;
    }

    function hideNavCue() {
      navArrow.visible = false;
      navTurn.visible = false;
      navReadout.visible = false;
    }

    function clearNavTarget() {
      navTarget.active = false;
      navTarget.key = "";
      navTarget.below = false;
      navTarget.stale = false;
      navTarget.source = "";
      navTarget.query = "";
      navTarget.pending = false;
      resolveSerial += 1;
      greenTelrad.visible = false;
      paintGreen(false);
      hideNavCue();
    }

    function navDisplayOff(target) {
      if (target.kind === "messier") return !skyView.messier;
      if (target.kind === "ngc") return skyView.ngcMode === "off";
      if (target.kind === "star") return !skyView.stars;
      return false;
    }

    function findNavSource(key) {
      if (!key) return null;
      for (const body of lastBodies) if (objectKey(body) === key) return body;
      for (const star of lastStars) if (objectKey(star) === key) return star;
      for (const item of lastDso) if (objectKey(item) === key) return item;
      for (const item of lastNgc) if (objectKey(item) === key) return item;
      return null;
    }

    function syncNavTarget() {
      if (!navTarget.active || !navTarget.key) return;
      const found = findNavSource(navTarget.key);
      if (found && Number.isFinite(Number(found.az)) && Number.isFinite(Number(found.alt))) {
        navTarget.az = Number(found.az);
        navTarget.alt = Number(found.alt);
        navTarget.name = found.name || found.id || navTarget.name;
        navTarget.below = false;
        navTarget.stale = false;
        return;
      }
      if (navTarget.source === "resolve") {
        refreshResolveTarget();
        return;
      }
      if (navTarget.source === "sky") {
        navTarget.below = !(Number.isFinite(navTarget.alt) && navTarget.alt > 0);
        navTarget.stale = false;
        return;
      }
      if (navDisplayOff(navTarget)) {
        navTarget.below = false;
        navTarget.stale = true;
        return;
      }
      navTarget.below = true;
      navTarget.stale = false;
    }

    function adoptNavTarget(item, source) {
      const az = Number(item && item.az);
      const alt = Number(item && item.alt);
      if (!Number.isFinite(az) || !Number.isFinite(alt)) return;
      navTarget.active = true;
      navTarget.key = objectKey(item);
      navTarget.name = item.name || item.id || "Objekt";
      navTarget.kind = item.kind || (item.hip ? "star" : "");
      navTarget.id = item.id || "";
      navTarget.az = az;
      navTarget.alt = alt;
      navTarget.ra = Number.isFinite(Number(item.ra)) ? Number(item.ra) : null;
      navTarget.dec = Number.isFinite(Number(item.dec)) ? Number(item.dec) : null;
      const origin = source || "overlay";
      navTarget.source = origin;
      navTarget.query = catalogQueryOf(item);
      navTarget.pending = false;
      navTarget.below = origin === "resolve" && (item.above === false || alt <= 0);
      navTarget.stale = false;
      if (origin !== "resolve") syncNavTarget();
    }

    async function refreshResolveTarget() {
      if (!navTarget.active || navTarget.source !== "resolve" || !navTarget.query) return;
      if (findNavSource(navTarget.key)) return;
      const serial = ++resolveSerial;
      const query = navTarget.query;
      try {
        const response = await fetch(`/catalog/resolve?${catalogResolveParams(query)}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== resolveSerial || navTarget.query !== query || navTarget.source !== "resolve") return;
        const obj = data.object;
        if (!response.ok || !data.ok || !obj || !Number.isFinite(Number(obj.az)) || !Number.isFinite(Number(obj.alt))) {
          navTarget.pending = true;
          return;
        }
        navTarget.az = Number(obj.az);
        navTarget.alt = Number(obj.alt);
        navTarget.below = obj.above === false || Number(obj.alt) <= 0;
        navTarget.pending = false;
        navTarget.stale = false;
        if (panelMode === "detail" && selectedItem && selectedItem.fromSearch && objectKey(selectedItem) === navTarget.key) {
          selectedItem.az = navTarget.az;
          selectedItem.alt = navTarget.alt;
          selectedItem.above = obj.above;
          selectedItem.ra = obj.ra;
          selectedItem.dec = obj.dec;
          dashboardKey = "";
        }
      } catch (_err) {
        if (serial !== resolveSerial) return;
        navTarget.pending = true;
      }
    }

    function navCaption(angle, reached) {
      const name = navTarget.name || "Ziel";
      if (navTarget.pending) return `${name} · Position nicht erneuert`;
      if (navTarget.below) return `${name} · Ziel unter Horizont`;
      if (!Number.isFinite(angle)) return "";
      let text = `${name} · ${angle.toFixed(1).replace(".", ",")}°`;
      if (reached) text += " · erreicht";
      else if (navTarget.stale) text += " · fest";
      return text;
    }

    function paintNavReadout(text) {
      if (text !== navReadoutText) {
        navReadoutText = text;
        const previous = navReadout.material.map;
        const texture = makeLabelTexture(text);
        navReadout.material.map = texture;
        navReadout.material.needsUpdate = true;
        if (previous) previous.dispose();
      }
      const height = Math.max(7, vrTune.labelHeight);
      const image = navReadout.material.map && navReadout.material.map.image;
      const aspect = image && image.height ? image.width / image.height : 4;
      navReadout.scale.set(height * aspect, height, 1);
    }

    function tangentUp(radial, target) {
      const scale = radial.length() || 1;
      target.set(0, 1, 0).addScaledVector(radial, -(radial.y / scale) / scale);
      if (target.lengthSq() < 1e-4) target.set(1, 0, 0);
      else target.normalize();
      return target;
    }

    function placeNavReadout(hitPoint, text) {
      if (!text) {
        navReadout.visible = false;
        return;
      }
      paintNavReadout(text);
      tangentUp(hitPoint, navLocalY);
      navReadout.position.copy(hitPoint).addScaledVector(navLocalY, navOuterReach(22));
      navReadout.visible = true;
    }

    function placeNavArrow(hitPoint, heading) {
      navArrow.position.copy(hitPoint).addScaledVector(heading, navOuterReach(7));
      navArrow.up.copy(heading);
      navArrow.lookAt(0, 0, 0);
      navArrow.visible = true;
    }

    function placeNavTurn(hitPoint) {
      navTurn.position.copy(hitPoint);
      navTurn.up.set(0, 1, 0);
      navTurn.lookAt(0, 0, 0);
      navTurn.visible = true;
    }

    function placeGreenTelrad() {
      if (!navTarget.active || navTarget.below || navTarget.pending || !Number.isFinite(navTarget.az) || !Number.isFinite(navTarget.alt)) {
        greenTelrad.visible = false;
        return;
      }
      navPoint.copy(azAltToVec(navTarget.az, navTarget.alt, vrTune.shellRadius));
      sphere.localToWorld(navPoint);
      if (navPoint.lengthSq() < 1) {
        greenTelrad.visible = false;
        return;
      }
      greenTelrad.position.copy(navPoint);
      greenTelrad.lookAt(0, 0, 0);
      greenTelrad.visible = true;
    }

    function updateNavCue(direction, hitPoint) {
      if (!navTarget.active) {
        hideNavCue();
        paintGreen(false);
        return;
      }
      const aimOk = Boolean(direction && direction.lengthSq() > 0.5 && hitPoint);
      if (navTarget.below || navTarget.pending || !Number.isFinite(navTarget.az) || !Number.isFinite(navTarget.alt)) {
        navArrow.visible = false;
        navTurn.visible = false;
        paintGreen(false);
        if (aimOk && (navTarget.below || navTarget.pending)) placeNavReadout(hitPoint, navCaption(null, false));
        else navReadout.visible = false;
        return;
      }
      if (!objectWorldDir(navTarget, navTargetDir)) {
        hideNavCue();
        return;
      }
      const dot = THREE.MathUtils.clamp(direction.dot(navTargetDir), -1, 1);
      const angle = THREE.MathUtils.radToDeg(Math.acos(dot));
      const reached = angle <= vrTune.pickAcquireDeg;
      paintGreen(reached);
      if (aimOk) placeNavReadout(hitPoint, navCaption(angle, reached));
      else navReadout.visible = false;
      if (!aimOk) {
        navArrow.visible = false;
        navTurn.visible = false;
        return;
      }
      if (angle >= 165) {
        navArrow.visible = false;
        placeNavTurn(hitPoint);
        return;
      }
      navTurn.visible = false;
      if (angle < 3) {
        navArrow.visible = false;
        return;
      }
      navPerp.copy(navTargetDir).addScaledVector(direction, -dot);
      if (navPerp.lengthSq() < 1e-4) {
        navArrow.visible = false;
        return;
      }
      navPerp.normalize();
      placeNavArrow(hitPoint, navPerp);
    }

    function hideSkyAim() {
      telrad.visible = false;
      skyMark.visible = false;
    }

    function clearSkyCandidate() {
      skyKey = "";
      skyMark.visible = false;
    }

    function paintSkyLabel(name) {
      if (name === skyLabelText) return;
      skyLabelText = name;
      const previous = skyLabel.material.map;
      const texture = makeLabelTexture(name);
      skyLabel.material.map = texture;
      skyLabel.material.needsUpdate = true;
      if (previous) previous.dispose();
      const height = vrTune.labelHeight;
      skyLabel.scale.set(height * (texture.image.width / texture.image.height), height, 1);
      skyLabel.position.set(0, height * 0.55 + vrTune.markRadius, 0);
    }

    function skyHit(origin, direction) {
      const radius = vrTune.shellRadius;
      const b = origin.dot(direction);
      const disc = b * b - origin.lengthSq() + radius * radius;
      if (disc < 0) return null;
      const t = -b + Math.sqrt(disc);
      if (t <= 0) return null;
      skyPoint.copy(origin).addScaledVector(direction, t);
      return skyPoint;
    }

    function objectWorldDir(item, target) {
      target.copy(azAltToVec(Number(item.az), Number(item.alt), vrTune.shellRadius));
      sphere.localToWorld(target);
      if (target.lengthSq() < 1) return false;
      target.normalize();
      return true;
    }

    function angleDeg(a, b) {
      return THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)));
    }

    function chooseCandidate(direction) {
      let best = null;
      let bestAng = Infinity;
      const pool = lastBodies.concat(lastStars.filter((star) => star && star.name));
      if (skyView.messier) {
        for (const item of lastDso) pool.push(item);
      }
      if (skyView.ngcMode !== "off") {
        for (const item of lastNgc) pool.push(item);
      }
      for (const item of pool) {
        if (!objectWorldDir(item, objDir)) continue;
        const angle = angleDeg(direction, objDir);
        if (angle < bestAng) {
          bestAng = angle;
          best = item;
        }
      }
      if (skyKey) {
        const held = findByKey(skyKey);
        let heldAng = Infinity;
        if (held && objectWorldDir(held, objDir)) heldAng = angleDeg(direction, objDir);
        if (held && heldAng <= vrTune.pickHoldDeg) {
          if (best && objectKey(best) !== skyKey && bestAng <= heldAng - vrTune.pickSwitchDeg) {
            return { item: best, key: objectKey(best) };
          }
          return { item: held, key: skyKey };
        }
      }
      if (best && bestAng <= vrTune.pickAcquireDeg) return { item: best, key: objectKey(best) };
      return null;
    }

    function updateSkyAim() {
      placeGreenTelrad();
      const pointAim = skyPointMode && panelMode === "mount";
      if (!aimActive() && !pointAim) {
        hideSkyAim();
        hideNavCue();
        return;
      }
      const pointer = activeAim >= 0 ? pointers[activeAim] : null;
      if (!pointer || !pointer.ready || pointer.buttonHit) {
        hideSkyAim();
        hideNavCue();
        if (!pointer || !pointer.ready) clearSkyCandidate();
        return;
      }
      const hit = skyHit(pointer.origin, pointer.direction);
      if (!hit) {
        hideSkyAim();
        hideNavCue();
        clearSkyCandidate();
        return;
      }
      telrad.position.copy(hit);
      telrad.lookAt(0, 0, 0);
      telrad.visible = true;
      aimDir.copy(hit).normalize();
      updateNavCue(aimDir, hit);
      if (!aimActive()) {
        clearSkyCandidate();
        return;
      }
      const pick = chooseCandidate(aimDir);
      if (!pick) {
        clearSkyCandidate();
        return;
      }
      skyKey = pick.key;
      if (!objectWorldDir(pick.item, objDir)) {
        clearSkyCandidate();
        return;
      }
      objDir.multiplyScalar(vrTune.shellRadius);
      skyMark.position.copy(objDir);
      skyMark.lookAt(0, 0, 0);
      skyMark.visible = true;
      paintSkyLabel(pick.item.name || pick.item.id || "Objekt");
    }

    function updatePointers() {
      let nextHover = null;
      const live = new Set();
      let movedIndex = -1;
      let movedAmount = vrTune.aimMotion;
      if (!renderer.xr.isPresenting) {
        clearPointerHits();
        clearSkyCandidate();
        hideSkyAim();
        hideNavCue();
        greenTelrad.visible = false;
        for (const pointer of pointers) pointer.line.visible = false;
        return;
      }
      if (dashboard.visible) dashboard.updateWorldMatrix(true, true);
      if (monitor.visible) monitor.updateWorldMatrix(true, true);
      for (const pointer of pointers) {
        const index = pointers.indexOf(pointer);
        const source = pointer.source;
        const ready = Boolean(
          source && source.targetRayMode === "tracked-pointer" && pointer.space.visible
        );
        pointer.ready = ready;
        pointer.buttonHit = false;
        pointer.line.visible = ready && (aimActive() || (skyPointMode && panelMode === "mount"));
        if (!ready) {
          if (source) {
            pointerHits.delete(source);
            monitorHits.delete(source);
          }
          continue;
        }
        live.add(source);
        pointer.space.updateWorldMatrix(true, false);
        pointer.origin.setFromMatrixPosition(pointer.space.matrixWorld);
        pointer.direction.set(0, 0, -1).transformDirection(pointer.space.matrixWorld);
        const rot = pointer.seenPose
          ? 2 * Math.acos(THREE.MathUtils.clamp(Math.abs(pointer.space.quaternion.dot(pointer.lastQuat)), 0, 1))
          : 0;
        const motion = pointer.seenPose
          ? pointer.origin.distanceTo(pointer.lastPos) + rot * vrTune.aimRotWeight
          : 0;
        pointer.seenPose = true;
        pointer.lastPos.copy(pointer.origin);
        pointer.lastQuat.copy(pointer.space.quaternion);
        if (motion > movedAmount) {
          movedAmount = motion;
          movedIndex = index;
        }
        if (!dashboard.visible) {
          pointerHits.delete(source);
        } else {
          pointerRaycaster.set(pointer.origin, pointer.direction);
          const hits = pointerRaycaster.intersectObjects(pointerButtons, false);
          let button = null;
          for (const hit of hits) {
            const object = hit.object;
            if (object.visible && object.userData.action && object.parent === dashboard) {
              button = object;
              break;
            }
          }
          if (button) {
            pointer.buttonHit = true;
            pointerHits.set(source, button);
            nextHover = button;
          } else {
            pointerHits.delete(source);
          }
        }
        if (monitor.visible) {
          pointerRaycaster.set(pointer.origin, pointer.direction);
          const hits = pointerRaycaster.intersectObjects(monitorButtons, false);
          let button = null;
          for (const hit of hits) {
            const object = hit.object;
            if (object.visible && object.userData.action && object.parent === monitor) {
              button = object;
              break;
            }
          }
          if (button) {
            pointer.buttonHit = true;
            monitorHits.set(source, button);
            if (!nextHover) nextHover = button;
          } else {
            monitorHits.delete(source);
          }
        } else {
          monitorHits.delete(source);
        }
      }
      if (movedIndex >= 0) {
        if (movedIndex !== activeAim) skyKey = "";
        activeAim = movedIndex;
      } else if (activeAim < 0) {
        const first = pointers.findIndex((item) => item.ready);
        if (first >= 0) activeAim = first;
      }
      for (const source of pointerHits.keys()) {
        if (!live.has(source)) pointerHits.delete(source);
      }
      for (const source of monitorHits.keys()) {
        if (!live.has(source)) monitorHits.delete(source);
      }
      if (!dashboard.visible) pointerHits.clear();
      setHoveredButton(nextHover);
      updateSkyAim();
    }

    function onDragStart(event) {
      const source = event && event.inputSource;
      if (!dragSource && dragArm === source) dragArm = null;
      const pointer = pointers.find((item) => item.source === source);
      if (!pointer || !pointer.ready) return;
      if (!dashboard.visible && !monitor.visible) return;
      pointerRaycaster.set(pointer.origin, pointer.direction);
      let choice = null;
      if (dashboard.visible) {
        const hits = pointerRaycaster.intersectObjects([closeButton, dragHandle], false);
        const top = hits.find((item) => item.object.visible);
        if (top && top.object === dragHandle) choice = { group: dashboard, hit: top };
      }
      if (monitor.visible) {
        const hits = pointerRaycaster.intersectObjects([monitorHideButton, monitorDragButton], false);
        const top = hits.find((item) => item.object.visible);
        if (top && top.object === monitorDragButton && (!choice || top.distance < choice.hit.distance)) {
          choice = { group: monitor, hit: top };
        }
      }
      if (!choice) return;
      dragGroup = choice.group;
      dragGroup.updateMatrixWorld(true);
      dragLocal.copy(dragGroup.worldToLocal(choice.hit.point.clone()));
      dragDistance = choice.hit.distance;
      dragSource = source;
      dragArm = source;
    }

    function moveDraggedDashboard() {
      if (!dragSource || !dragGroup) return;
      const pointer = pointers.find((item) => item.source === dragSource);
      if (!pointer || !pointer.ready) return;
      renderer.xr.getCamera().getWorldPosition(dragHead);
      dragRayPoint.copy(pointer.origin).addScaledVector(pointer.direction, dragDistance);
      dragGroup.lookAt(dragHead);
      dragGroup.updateMatrixWorld(true);
      dragGrabWorld.copy(dragLocal).applyMatrix4(dragGroup.matrixWorld);
      dragGroup.position.add(dragRayPoint.sub(dragGrabWorld));
    }

    function onDragEnd(event) {
      if (event && event.inputSource === dragSource) {
        dragSource = null;
        dragGroup = null;
      }
    }

    function onSelect(event) {
      const source = event && event.inputSource;
      if (dragArm && source === dragArm) {
        dragArm = null;
        dragSource = null;
        dragGroup = null;
        return;
      }
      const monitorHit = source && monitor.visible ? monitorHits.get(source) : null;
      if (
        monitorHit && monitorHit.visible && monitorHit.parent === monitor && monitorHit.userData.action
      ) {
        if (source) monitorHits.delete(source);
        if (monitorHit.userData.action === "monitor-hide") hideMonitor();
        return;
      }
      const now = performance.now();
      if (now - dashboardToggleAt < vrTune.selectGapMs) return;
      dashboardToggleAt = now;
      const hit = source && dashboard.visible ? pointerHits.get(source) : null;
      const sameHand = Boolean(
        hit && hit.visible && hit.parent === dashboard && hit.userData.action && dashboard.visible
      );
      if (source && !sameHand) pointerHits.delete(source);
      if (sameHand && hit.userData.action === "close-panel") {
        hideDashboard();
        return;
      }
      if (sameHand && hit.userData.action === "objects") {
        showObjectList();
        return;
      }
      if (sameHand && hit.userData.action === "himmel") {
        showHimmel();
        return;
      }
      if (sameHand && hit.userData.action === "back") {
        goBack();
        return;
      }
      if (sameHand && hit.userData.action === "object" && hit.userData.item) {
        showObjectDetail(hit.userData.item);
        return;
      }
      if (sameHand && hit.userData.action === "prefs") {
        showPrefs();
        return;
      }
      if (sameHand && hit.userData.action === "mount") {
        showMount();
        return;
      }
      if (sameHand && hit.userData.action === "camera") {
        openCameraEntry();
        return;
      }
      if (sameHand && hit.userData.action === "session-pick" && hit.userData.session) {
        if (hit.userData.session.saved || hit.userData.session.lifecycle_status === "closed") {
          sessionNote = hit.userData.session.note || "Session ist gespeichert.";
          dashboardKey = "";
          paintDashboard();
          return;
        }
        adoptSessionDraft(hit.userData.session);
        cameraNote = "";
        showCamera();
        return;
      }
      if (sameHand && hit.userData.action === "session-profile") {
        void createQuestSession(hit.userData.profileId);
        return;
      }
      if (sameHand && hit.userData.action === "session-new") {
        void createQuestSession(null);
        return;
      }
      if (sameHand && hit.userData.action === "cam-monitor") {
        if (cameraDraft.session_id != null) monitorSessionId = cameraDraft.session_id;
        placeMonitor();
        return;
      }
      if (sameHand && hit.userData.action === "cam-exp") {
        if (!cameraLockedNow()) {
          cameraDraft.exposure_s = stepList(cameraView && cameraView.exposure_steps_s, cameraDraft.exposure_s, hit.userData.dir);
          cameraNote = "";
          syncPanelButtons();
          dashboardKey = "";
          paintDashboard();
        }
        return;
      }
      if (sameHand && hit.userData.action === "cam-iso") {
        if (!cameraLockedNow()) {
          const steps = cameraView && cameraView.iso_steps;
          const adjustable = cameraView && cameraView.iso_adjustable === true && steps && steps.length > 1;
          if (!adjustable) {
            cameraNote = steps && steps.length ? "ISO fest vom Profil." : "Keine ISO-Stufen vom Server.";
          } else {
            cameraDraft.iso = stepList(steps, cameraDraft.iso, hit.userData.dir);
            cameraDraft.gain = cameraDraft.iso;
            cameraNote = "";
          }
          syncPanelButtons();
          dashboardKey = "";
          paintDashboard();
        }
        return;
      }
      if (sameHand && hit.userData.action === "cam-count") {
        if (!cameraLockedNow()) {
          const min = cameraDraft.image_type === "DARK" ? 0 : ((cameraView && cameraView.frame_min) || 1);
          const max = (cameraView && cameraView.frame_max) || 999;
          const next = Number(cameraDraft.frames || 0) + Number(hit.userData.dir || 0);
          cameraDraft.frames = Math.min(max, Math.max(min, next));
          rememberFrameCount();
          cameraNote = "";
          syncPanelButtons();
          dashboardKey = "";
          paintDashboard();
        }
        return;
      }
      if (sameHand && hit.userData.action === "cam-profile") {
        adoptCameraProfile();
        return;
      }
      if (sameHand && (hit.userData.action === "cam-lights" || hit.userData.action === "cam-darks")) {
        if (!cameraLockedNow() && !cameraDarksPrompt) {
          selectFrameType(hit.userData.action === "cam-darks" ? "DARK" : "LIGHT");
          cameraNote = "";
          syncPanelButtons();
          dashboardKey = "";
          paintDashboard();
        }
        return;
      }
      if (sameHand && hit.userData.action === "cam-cover") {
        cameraDarksPrompt = false;
        cameraDraft.image_type = "DARK";
        cameraDraft.frames = Number(cameraDraft.dark_frames || 0);
        cameraNote = "";
        if (cameraDraft.frames < 1) {
          cameraNote = "Keine Darks gewählt.";
          syncPanelButtons();
          dashboardKey = "";
          paintDashboard();
          return;
        }
        void startCameraCapture();
        return;
      }
      if (sameHand && hit.userData.action === "cam-skip-darks") {
        cameraDarksPrompt = false;
        cameraNote = "Darks übersprungen.";
        syncPanelButtons();
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (sameHand && hit.userData.action === "cam-start") {
        void startCameraCapture();
        return;
      }
      if (sameHand && hit.userData.action === "cam-stop") {
        void stopCameraCapture();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-page") {
        prefsPage = hit.userData.page;
        syncPanelButtons();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-step") {
        stepPref(hit.userData.pref, hit.userData.dir);
        return;
      }
      if (sameHand && hit.userData.action === "prefs-cycle") {
        cycleRole(hit.userData.pref);
        return;
      }
      if (sameHand && hit.userData.action === "prefs-reset") {
        resetPrefs();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-done" || sameHand && hit.userData.action === "prefs-hold") {
        if (hit.userData.action === "prefs-done") closePrefs();
        return;
      }
      if (sameHand && hit.userData.action === "sky-toggle") {
        toggleSky(hit.userData.sky);
        return;
      }
      if (sameHand && hit.userData.action === "sky-mag") {
        stepSkyMag(hit.userData.dir);
        return;
      }
      if (sameHand && hit.userData.action === "sky-now") {
        freezeSkyNow();
        return;
      }
      if (sameHand && hit.userData.action === "sky-step") {
        stepSkyTime(hit.userData.seconds);
        return;
      }
      if (sameHand && hit.userData.action === "sky-hold") return;
      if (sameHand && hit.userData.action === "sky-icons") {
        toggleMessierIcons();
        return;
      }
      if (sameHand && hit.userData.action === "sky-seeing") {
        toggleMessierSeeing();
        return;
      }
      if (sameHand && hit.userData.action === "sky-ngc") {
        cycleNgcMode();
        return;
      }
      if (sameHand && hit.userData.action === "sky-ngc-min") {
        stepNgcMin(hit.userData.dir || 0);
        return;
      }
      if (sameHand && hit.userData.action === "quest-goto") {
        showQuestGoto();
        return;
      }
      if (sameHand && hit.userData.action === "quest-sky-point") {
        toggleSkyPointMode();
        return;
      }
      if (sameHand && hit.userData.action === "quest-sky-goto") {
        if (!skyPick || skyPick.blocked) return;
        selectedItem = skyPick;
        selectedKey = objectKey(skyPick);
        showQuestGoto();
        return;
      }
      if (sameHand && hit.userData.action === "quest-goto-cancel") {
        cancelQuestGoto();
        return;
      }
      if (sameHand && hit.userData.action === "quest-goto-confirm") {
        confirmQuestGoto();
        return;
      }
      if (sameHand && hit.userData.action === "quest-stop") {
        requestMountStop();
        return;
      }
      if (sameHand && hit.userData.action === "quest-axis-rate") {
        stepAxisRate(hit.userData.dir || 0);
        return;
      }
      if (sameHand && hit.userData.action === "quest-axis-hold") return;
      if (sameHand && hit.userData.action === "quest-poll") {
        stepMountPoll(hit.userData.dir || 0);
        return;
      }
      if (sameHand && hit.userData.action === "quest-poll-hold") return;
      if (sameHand && hit.userData.action === "quest-axis") {
        if (axisMode) leaveAxisMode("");
        else enableAxisMode();
        return;
      }
      if (sameHand && hit.userData.action === "quest-axis-stop") {
        axisArmed = false;
        axisDirection = "";
        axisStatus = "STOPPT";
        axisNote = "STOP ACHSE wird gesendet.";
        requestAxisStop(axisToken, true);
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (sameHand && hit.userData.action === "quest-pair") {
        showPair();
        return;
      }
      if (sameHand && hit.userData.action === "pair-digit") {
        if (pairEntry.length < 6) pairEntry += hit.userData.digit || "";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (sameHand && hit.userData.action === "pair-clear") {
        pairEntry = "";
        dashboardKey = "";
        paintDashboard();
        return;
      }
      if (sameHand && hit.userData.action === "pair-submit") {
        submitPair();
        return;
      }
      if (sameHand && hit.userData.action === "day-track") {
        showDayTrack();
        return;
      }
      if (sameHand && hit.userData.action === "nav-goal") {
        if (selectedItem && selectedItem.fromSearch) aimResolvedTarget(selectedItem);
        else if (selectedItem) adoptNavTarget(selectedItem, "overlay");
        return;
      }
      if (sameHand && hit.userData.action === "kb-test") {
        openKeyboardTest();
        return;
      }
      if (sameHand && hit.userData.action === "search-page") {
        stepSearchPage(hit.userData.dir || 0);
        return;
      }
      if (sameHand && hit.userData.action === "search-hit" && hit.userData.item) {
        openSearchHit(hit.userData.item);
        return;
      }
      if (skyPointMode && panelMode === "mount" && source && !sameHand) {
        const pointer = pointers.find((item) => item.source === source);
        if (pointer && pointer.ready && !pointer.buttonHit) {
          dashboard.updateWorldMatrix(true, true);
          pointerRaycaster.set(pointer.origin, pointer.direction);
          const panelHits = pointerRaycaster.intersectObject(dashboardPanel, false);
          if (!panelHits.length) {
            const hitPoint = skyHit(pointer.origin, pointer.direction);
            const horizontal = hitPoint ? worldPointToAzAlt(hitPoint) : null;
            if (horizontal) adoptSkyPoint(horizontal.az, horizontal.alt);
          }
        }
        return;
      }
      const aim = activeAim >= 0 ? pointers[activeAim] : null;
      const aimedObject = aimActive() && aim && source === aim.source && !aim.buttonHit
        ? findByKey(skyKey) : null;
      if (aimedObject) {
        if (!dashboard.visible) placeDashboard();
        showObjectDetail(aimedObject);
        return;
      }
      if (dashboard.visible) return;
      placeDashboard();
    }

    function hideDashboard() {
      dashboard.visible = false;
      if (dragGroup !== monitor) {
        dragSource = null;
        dragArm = null;
        dragGroup = null;
      }
      clearPointerHits();
    }

    function placeDashboard() {
      const xrCamera = renderer.xr.getCamera();
      const headPos = new THREE.Vector3();
      const headQuat = new THREE.Quaternion();
      xrCamera.getWorldPosition(headPos);
      xrCamera.getWorldQuaternion(headQuat);
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(headQuat);
      const down = new THREE.Vector3(0, -1, 0).applyQuaternion(headQuat);
      dashboard.position.copy(headPos).addScaledVector(forward, 1.75).addScaledVector(down, 0.22);
      dashboard.lookAt(headPos);
      resetObjectPanel();
      dashboard.visible = true;
      dashboardPlaced = true;
      dashboardKey = "";
      refreshDashboard();
    }

    function hideMonitor() {
      monitor.visible = false;
      if (dragGroup === monitor) {
        dragSource = null;
        dragArm = null;
        dragGroup = null;
      }
      monitorHits.clear();
    }

    function placeMonitor() {
      const sid = monitorSessionId || cameraDraft.session_id;
      if (sid != null) monitorSessionId = sid;
      if (!monitorPlaced) {
        if (dashboardPlaced) {
          const offset = new THREE.Vector3(0.86, 0, 0);
          dashboard.updateMatrixWorld(true);
          dashboard.localToWorld(offset);
          monitor.position.copy(offset);
          monitor.quaternion.copy(dashboard.quaternion);
        } else {
          const xrCamera = renderer.xr.getCamera();
          const headPos = new THREE.Vector3();
          const headQuat = new THREE.Quaternion();
          xrCamera.getWorldPosition(headPos);
          xrCamera.getWorldQuaternion(headQuat);
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(headQuat);
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(headQuat);
          monitor.position.copy(headPos).addScaledVector(forward, 1.75).addScaledVector(right, 0.7);
          monitor.lookAt(headPos);
        }
        monitorPlaced = true;
      }
      monitor.visible = true;
      void refreshMonitor();
    }

    function paintMonitor(text, bins) {
      const ctx = monitorCanvas.getContext("2d");
      ctx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, monitorCanvas.width, monitorCanvas.height);
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "28px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const lines = String(text || "").split("\n");
      lines.forEach((line, index) => ctx.fillText(line, 24, 16 + index * 34));
      const counts = Array.isArray(bins) ? bins : [];
      if (!counts.length) {
        monitorTexture.needsUpdate = true;
        return;
      }
      const peak = counts.reduce((max, count) => Math.max(max, Math.log1p(Number(count) || 0)), 0) || 1;
      const left = 24;
      const top = 200;
      const width = monitorCanvas.width - 48;
      const height = 140;
      const bar = width / counts.length;
      ctx.fillStyle = "#7dd3fc";
      counts.forEach((count, index) => {
        const share = Math.log1p(Number(count) || 0) / peak;
        const barHeight = Math.max(1, share * height);
        ctx.fillRect(left + index * bar, top + height - barHeight, Math.max(1, bar - 1), barHeight);
      });
      monitorTexture.needsUpdate = true;
    }

    async function refreshMonitor() {
      if (!monitor.visible) return;
      const sid = monitorSessionId || cameraDraft.session_id;
      if (!sid) {
        paintMonitor("LIGHT-PREVIEW\nKeine Session", null);
        return;
      }
      try {
        const response = await fetch(
          `/astro/capture/preview?session_id=${encodeURIComponent(sid)}&source=${encodeURIComponent(monitorSource)}`,
          { cache: "no-store", credentials: "same-origin" },
        );
        const data = await response.json().catch(() => ({}));
        if (!monitor.visible) return;
        if (!response.ok || data.ok === false) {
          paintMonitor(`LIGHT-PREVIEW\n${data.error || "Preview folgt"}`, null);
          return;
        }
        const analysis = data.analysis || null;
        const name = data.image_id || data.file_name || "";
        if (data.preview_ready && data.preview_url && name && name !== monitorImageId) {
          monitorImageId = name;
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            canvas.getContext("2d").drawImage(img, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.needsUpdate = true;
            monitorImage.material.map = texture;
            monitorImage.material.transparent = true;
            monitorImage.material.color.setHex(0xffffff);
            monitorImage.material.needsUpdate = true;
            if (monitorMap) monitorMap.dispose();
            monitorMap = texture;
          };
          img.onerror = () => {
            paintMonitor(`${name}\nBild nicht geladen`, null);
          };
          img.src = data.preview_url;
        }
        const sourceName = monitorSources.includes(data.source) ? data.source : monitorSource;
        if (!analysis) {
          paintMonitor(`${sourceName}\n${name}\nStatistik folgt`, null);
          return;
        }
        const sat = Number(analysis.saturated_fraction);
        const satText = Number.isFinite(sat) ? `${(sat * 100).toFixed(3)} %` : "—";
        paintMonitor(
          [
            sourceName,
            name,
            `Median ${Math.round(Number(analysis.background_median) || 0)}   Rauschen ${Math.round(Number(analysis.background_noise) || 0)}`,
            `Max ${Math.round(Number(analysis.max_raw) || 0)}   99,9 % ${Math.round(Number(analysis.percentile_99_9) || 0)}`,
            `Sättigung ${satText}   Schwarz ${Math.round(Number(analysis.black_level) || 0)}   Weiß ${Math.round(Number(analysis.white_level) || 0)}`,
          ].join("\n"),
          analysis.histogram_bins,
        );
      } catch (_err) {
        paintMonitor("LIGHT-PREVIEW\nPreview nicht lesbar", null);
      }
    }

    function mountClock(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    function fmtMountDeg(value, signed) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const text = Math.abs(number).toFixed(2).replace(".", ",");
      if (!signed) return `${number.toFixed(2).replace(".", ",")}°`;
      return `${number >= 0 ? "+" : "−"}${text}°`;
    }

    function syncMountAngleLine() {
      const lines = mountView.lines.filter((line) => !String(line).startsWith("Abstand Ziel"));
      const angle = mountTargetAngle();
      if (Number.isFinite(angle)) lines.push(`Abstand Ziel–Montierung: ${angle.toFixed(1).replace(".", ",")}°`);
      mountView.lines = lines;
    }

    function mountTargetAngle() {
      if (!mountView.valid || !Number.isFinite(mountView.az) || !Number.isFinite(mountView.alt)) return null;
      if (!navTarget.active || navTarget.pending || navTarget.stale) return null;
      if (!Number.isFinite(navTarget.az) || !Number.isFinite(navTarget.alt)) return null;
      const fromMount = azAltToVec(mountView.az, mountView.alt, 1).normalize();
      const fromTarget = azAltToVec(navTarget.az, navTarget.alt, 1).normalize();
      return angleDeg(fromMount, fromTarget);
    }

    function paintMountLines(mount) {
      const lines = [mountView.status];
      if (!mountView.valid || !mount) {
        lines.push(mountView.seenAt ? `Zuletzt ${mountClock(mountView.seenAt)}` : "Noch keine Position");
        mountView.lines = lines;
        return;
      }
      const ra = mount.right_ascension_string || (Number.isFinite(Number(mount.right_ascension_hours))
        ? `${Number(mount.right_ascension_hours).toFixed(3).replace(".", ",")} h`
        : "—");
      const dec = mount.declination_string || fmtMountDeg(mount.declination_deg, true);
      lines.push(`RA ${ra}`);
      lines.push(`Dec ${dec}`);
      lines.push(`Az ${fmtMountDeg(mount.azimuth_deg, false)}    Höhe ${fmtMountDeg(mount.altitude_deg, true)}`);
      const tracking = mount.tracking_enabled ? (mount.tracking_mode || "an") : "aus";
      lines.push(`Tracking ${tracking}    Slew ${mount.slewing ? "ja" : "nein"}`);
      if (mountView.targetName && (mountView.motion === "faehrt" || mountView.motion === "stoppt")) {
        lines.push(`Ziel ${mountView.targetName}`);
      }
      if (questGotoNote) lines.push(questGotoNote);
      lines.push(`${mount.at_park ? "geparkt" : "nicht geparkt"}    Pier ${mount.side_of_pier || "—"}`);
      lines.push(`Stand ${mountClock(mountView.seenAt)}`);
      const angle = mountTargetAngle();
      if (Number.isFinite(angle)) {
        lines.push(`Abstand Ziel–Montierung: ${angle.toFixed(1).replace(".", ",")}°`);
      }
      mountView.lines = lines;
    }

    function applyMountStatus(data) {
      const mount = data && data.mount;
      const az = mount ? Number(mount.azimuth_deg) : NaN;
      const alt = mount ? Number(mount.altitude_deg) : NaN;
      const valid = Boolean(data && data.api_online && mount && mount.connected && Number.isFinite(az) && Number.isFinite(alt));
      const motion = data && data.motion ? data.motion : null;
      mountView.motion = motion && motion.state ? motion.state : "";
      mountView.motionLabel = motion && motion.label ? motion.label : "";
      mountView.motionDetail = motion && motion.detail ? motion.detail : "";
      mountView.slewing = Boolean(mount && mount.slewing);
      if (mountView.motion === "bereit" && !mountView.slewing) {
        mountView.targetName = "";
        if (!axisMode && axisStatus === "GESPERRT") {
          axisStatus = "AUS";
          axisNote = "Aus";
        }
        if (questGotoNote.indexOf("GoTo gesendet") === 0) questGotoNote = "";
      }
      if (!data || data.api_online === false) mountView.status = "NINA nicht erreichbar";
      else if (!mount || !mount.connected) mountView.status = "Montierung nicht verbunden";
      else if (mountView.motion === "faehrt") mountView.status = "Montierung fährt";
      else if (mountView.motion === "stoppt") mountView.status = "STOP läuft";
      else if (mountView.motion === "unklar") mountView.status = (motion && motion.label) || "Zustand unklar";
      else if (mountView.motion === "bereit") mountView.status = "Bereit";
      else if (!Number.isFinite(az) || !Number.isFinite(alt)) mountView.status = "Azimut oder Höhe fehlt";
      else mountView.status = "verbunden";
      mountView.valid = valid;
      mountView.az = valid ? az : null;
      mountView.alt = valid ? alt : null;
      if (valid) mountView.seenAt = new Date();
      if (!valid) hideMountTelrad();
      paintMountLines(valid ? mount : null);
      syncPanelButtons();
      if (panelMode === "mount" || panelMode === "goto") dashboardKey = "";
    }

    async function pollMount() {
      if (mountBusy) return;
      mountBusy = true;
      const serial = ++mountSerial;
      try {
        const response = await fetch("/nina/mount", { cache: "no-store" });
        const data = await response.json();
        if (serial !== mountSerial) return;
        applyMountStatus(response.ok ? data : { api_online: false, error: "Status nicht lesbar", mount: null });
      } catch (_err) {
        if (serial !== mountSerial) return;
        applyMountStatus({ api_online: false, error: "NINA nicht erreichbar", mount: null });
      } finally {
        if (serial === mountSerial) mountBusy = false;
      }
    }

    applyLook();
    refreshEnterButton();
    useAppPanorama().then((ok) => { if (ok) loadTexture(); });
    pollMount();
    applyMountPoll();
    setInterval(() => {
      if (monitor.visible) void refreshMonitor();
    }, 2000);
    renderer.setAnimationLoop((_time, frame) => {
      if (!renderer.xr.isPresenting) {
        applyLook();
      } else if (!dashboardPlaced && frame) {
        const space = renderer.xr.getReferenceSpace();
        if (space && frame.getViewerPose(space)) placeDashboard();
      }
      if (renderer.xr.isPresenting) {
        updatePointers();
        moveDraggedDashboard();
      }
      if (axisMode && (!renderer.xr.isPresenting || panelMode !== "mount")) {
        leaveAxisMode(renderer.xr.isPresenting ? "" : "XR-Sitzung beendet");
      }
      if (renderer.xr.isPresenting && panelMode === "mount") pollAxisStick();
      if (skyView.seeing) applyMessierSeeing(performance.now());
      placeMountTelrad();
      syncMountAngleLine();
      refreshDashboard();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
