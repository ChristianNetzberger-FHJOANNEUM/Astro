    function tabColor(tab) {
      return panelMode === "prefs" && tab.userData.page === prefsPage ? 0xbae6fd : testRest;
    }

    function setHoveredButton(button) {
      if (hoveredButton === button) return;
      if (hoveredButton) {
        hoveredButton.material.color.setHex(prefTabs.includes(hoveredButton) ? tabColor(hoveredButton) : testRest);
      }
      hoveredButton = button;
      if (hoveredButton) hoveredButton.material.color.setHex(testHoverColor);
    }

    function clearPointerHits() {
      pointerHits.clear();
      setHoveredButton(null);
    }

    function takeNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function roundTo(value, step) {
      const places = (String(step).split(".")[1] || "").length;
      return Number(value.toFixed(places));
    }

    function fmtTune(value, digits) {
      let text = value.toFixed(digits);
      if (text.includes(".")) text = text.replace(/0+$/, "").replace(/\.$/, "");
      return text.replace(".", ",");
    }

    function roleLabel(role) {
      if (role === "select") return "Abzug";
      if (role === "squeeze") return "Griff";
      return "Keine";
    }

    function prefText(pref) {
      if (pref === "acquire") return `Treffer ${fmtTune(vrTune.pickAcquireDeg, 2)}°`;
      if (pref === "hold") return `Halten ${fmtTune(vrTune.pickHoldDeg, 2)}°`;
      if (pref === "switch") return `Wechsel ${fmtTune(vrTune.pickSwitchDeg, 2)}°`;
      if (pref === "ray") return `Strahl ${fmtTune(vrTune.rayMeters, 1)} m`;
      if (pref === "ring0") return `Innen ${fmtTune(vrTune.telradHalfDeg[0] * 2, 1)}°`;
      if (pref === "ring1") return `Mitte ${fmtTune(vrTune.telradHalfDeg[1] * 2, 1)}°`;
      if (pref === "ring2") return `Außen ${fmtTune(vrTune.telradHalfDeg[2] * 2, 1)}°`;
      if (pref === "label") return `Namen ${fmtTune(vrTune.labelHeight, 0)}`;
      if (pref === "panel") return `Tafel ${Math.round(vrTune.panelScale * 100)} %`;
      if (pref === "pano") return `Foto ${Math.round(vrTune.panoBrightness)} %`;
      if (pref === "mark") return "Markierung Telrad";
      if (pref === "dashboard") return `Öffnen ${roleLabel(controlRoles.dashboard)}`;
      if (pref === "aim") return `Zielhilfe ${roleLabel(controlRoles.aimToggle)}`;
      return pref;
    }

    function refreshPrefLabels() {
      for (const row of prefRows) paintTextButton(row.label, prefText(row.pref));
      for (const tab of prefTabs) {
        if (tab !== hoveredButton) tab.material.color.setHex(tabColor(tab));
      }
    }

    function syncPanelButtons() {
      const prefs = panelMode === "prefs";
      const home = panelMode === "home";
      objectsButton.visible = home;
      skyMenuButton.visible = home;
      prefsButton.visible = home;
      backButton.visible = panelMode === "list" || panelMode === "detail" || panelMode === "himmel" || panelMode === "search" || panelMode === "track";
      const backLabel = panelMode === "search" ? "LISTE" : "ZURÜCK";
      if (backButton.userData.face !== backLabel) {
        backButton.userData.face = backLabel;
        paintTextButton(backButton, backLabel);
      }
      const trackable = panelMode === "detail" && itemHasEquatorial(selectedItem);
      goalButton.visible = panelMode === "detail";
      goalButton.position.x = trackable ? -0.16 : 0;
      trackButton.visible = trackable;
      keyboardTestButton.visible = panelMode === "list" || panelMode === "search";
      keyboardTestButton.position.x = panelMode === "search" ? -0.24 : 0;
      const pages = Math.ceil(searchHits.length / 6);
      searchPrevButton.visible = panelMode === "search" && searchPage > 0;
      searchNextButton.visible = panelMode === "search" && searchPage + 1 < pages;
      if (panelMode !== "list" && panelMode !== "search") hideObjectRows();
      for (const tab of prefTabs) tab.visible = prefs;
      for (const row of prefRows) {
        const show = prefs && row.page === prefsPage;
        for (const widget of row.widgets) widget.visible = show;
      }
      prefReset.visible = prefs;
      prefDone.visible = prefs;
      const himmel = panelMode === "himmel";
      for (const button of skyControls) button.visible = himmel;
      if (prefs) refreshPrefLabels();
      if (himmel) paintHimmelButtons();
    }

    function skyClockLabel() {
      const stamp = skyView.live || !skyView.when
        ? formatWhen(skyWhen)
        : formatWhen(skyView.when.toISOString());
      return `${stamp} · ${skyView.live ? "Live" : "fest"}`;
    }

    function paintHimmelButtons() {
      paintTextButton(skyStarsBtn, skyView.stars ? "Sterne EIN" : "Sterne AUS");
      paintTextButton(skyConstBtn, skyView.constellations ? "Sternbilder EIN" : "Sternbilder AUS");
      paintTextButton(skyMessierBtn, skyView.messier ? "Messier EIN" : "Messier AUS");
      paintTextButton(skyMagLabel, `${skyView.mag.toFixed(1).replace(".", ",")} mag`);
      paintTextButton(skyLiveBtn, skyView.live ? "LIVE EIN" : "LIVE AUS");
      paintTextButton(skyIconBtn, skyView.icons ? "Form TYPEN" : "Form SCHEIBE");
      paintTextButton(skySeeingBtn, skyView.seeing ? "Unruhe EIN" : "Unruhe AUS");
      const ngcLabel = skyView.ngcMode === "mine" ? "NGC MEINE" : skyView.ngcMode === "all" ? "NGC ALLE" : "NGC AUS";
      paintTextButton(skyNgcBtn, ngcLabel);
      paintTextButton(skyNgcMinLabel, `≥ ${skyView.ngcMin}`);
      const marksOn = panelMode === "himmel" && (skyView.messier || skyView.ngcMode !== "off");
      skyIconBtn.visible = marksOn;
      skySeeingBtn.visible = marksOn;
      const mine = panelMode === "himmel" && skyView.ngcMode === "mine";
      skyNgcMinMinus.visible = mine;
      skyNgcMinLabel.visible = mine;
      skyNgcMinPlus.visible = mine;
    }

    function applyMessierSeeing(timeMs) {
      for (const object of skyObjects) {
        if (!object.userData.dsoPoints) continue;
        const uniforms = object.material && object.material.uniforms;
        if (!uniforms || !uniforms.uSeeing) continue;
        uniforms.uSeeing.value = skyView.seeing ? 1 : 0;
        if (skyView.seeing && uniforms.uTime) uniforms.uTime.value = timeMs * 0.001;
      }
    }

    function toggleMessierIcons() {
      skyView.icons = !skyView.icons;
      paintHimmelButtons();
      dashboardKey = "";
      rebuildDsoMarks();
      savePrefs();
    }

    function cycleNgcMode() {
      skyView.ngcMode = skyView.ngcMode === "off" ? "mine" : skyView.ngcMode === "mine" ? "all" : "off";
      if (skyKey && !findByKey(skyKey)) {
        skyKey = "";
        skyMark.visible = false;
      }
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
      savePrefs();
    }

    function stepNgcMin(dir) {
      const next = Math.min(5, Math.max(1, skyView.ngcMin + dir));
      if (next === skyView.ngcMin) return;
      skyView.ngcMin = next;
      paintHimmelButtons();
      dashboardKey = "";
      if (skyView.ngcMode === "mine") requestSky(true);
      savePrefs();
    }

    function toggleMessierSeeing() {
      skyView.seeing = !skyView.seeing;
      applyMessierSeeing(performance.now());
      paintHimmelButtons();
      dashboardKey = "";
      savePrefs();
    }

    function toggleSky(which) {
      if (which === "stars") skyView.stars = !skyView.stars;
      else if (which === "const") skyView.constellations = !skyView.constellations;
      else if (which === "messier") {
        skyView.messier = !skyView.messier;
        if (!skyView.messier) hideMessierMarks();
        if (skyKey && !findByKey(skyKey)) {
          skyKey = "";
          skyMark.visible = false;
        }
        refreshObjectPanel();
      }
      else if (which === "live") {
        skyView.live = !skyView.live;
        if (skyView.live) skyView.when = null;
        else if (!skyView.when) skyView.when = skyWhen ? new Date(skyWhen) : new Date();
        syncSkyClock();
        paintHimmelButtons();
        dashboardKey = "";
        if (skyView.live) requestSky(true);
        return;
      }
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
      savePrefs();
    }

    function stepSkyMag(dir) {
      const next = Math.min(9, Math.max(0, Math.round((skyView.mag + dir * 0.5) * 2) / 2));
      if (next === skyView.mag) return;
      skyView.mag = next;
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
      savePrefs();
    }

    function freezeSkyNow() {
      skyView.live = false;
      skyView.when = new Date();
      syncSkyClock();
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function stepSkyTime(seconds) {
      skyView.live = false;
      const base = skyView.when ? skyView.when.getTime() : Date.now();
      skyView.when = new Date(base + seconds * 1000);
      syncSkyClock();
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function showPrefs() {
      panelMode = "prefs";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function closePrefs() {
      showHome();
    }

    function applyRayLength() {
      for (const pointer of pointers) pointer.line.scale.z = vrTune.rayMeters;
    }

    function rebuildTelrad() {
      while (telrad.children.length) {
        const child = telrad.children[0];
        telrad.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      for (const halfDeg of vrTune.telradHalfDeg) {
        const ring = makeRing(
          vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(halfDeg)),
          vrTune.telradColor,
        );
        ring.renderOrder = 5;
        telrad.add(ring);
      }
      fillGreenTelrad();
    }

    function applyPanelScale() {
      dashboard.scale.setScalar(vrTune.panelScale);
    }

    function applyLabelHeight() {
      const height = vrTune.labelHeight;
      sky.traverse((object) => {
        if (!object.userData || !object.userData.labelSprite || !object.material) return;
        const image = object.material.map && object.material.map.image;
        const aspect = image && image.height ? image.width / image.height : 4;
        const factor = Number(object.userData.labelScale) || 1;
        object.scale.set(height * factor * aspect, height * factor, 1);
      });
      if (!skyLabelText) return;
      const name = skyLabelText;
      skyLabelText = "";
      paintSkyLabel(name);
    }

    function enforceRoles() {
      if (controlRoles.dashboard !== "select" && controlRoles.dashboard !== "squeeze") {
        controlRoles.dashboard = controlDefaults.dashboard;
      }
      if (controlRoles.aimToggle !== "" && controlRoles.aimToggle !== "select" && controlRoles.aimToggle !== "squeeze") {
        controlRoles.aimToggle = "";
      }
      if (controlRoles.aimToggle === controlRoles.dashboard) controlRoles.aimToggle = "";
    }

    function bindControlRoles() {
      const session = renderer.xr.getSession();
      if (!session) return;
      unbindControlRoles(session);
      session.addEventListener(controlRoles.dashboard, onSelect);
      session.addEventListener("selectstart", onDragStart);
      session.addEventListener("selectend", onDragEnd);
      if (controlRoles.aimToggle) session.addEventListener(controlRoles.aimToggle, onAimToggle);
    }

    function unbindControlRoles(session) {
      if (!session) return;
      session.removeEventListener("select", onSelect);
      session.removeEventListener("squeeze", onSelect);
      session.removeEventListener("selectstart", onDragStart);
      session.removeEventListener("selectend", onDragEnd);
      session.removeEventListener("select", onAimToggle);
      session.removeEventListener("squeeze", onAimToggle);
    }

    function savePrefs() {
      const payload = {
        v: 1,
        tune: {
          labelHeight: vrTune.labelHeight,
          rayMeters: vrTune.rayMeters,
          telradHalfDeg: vrTune.telradHalfDeg.slice(),
          pickAcquireDeg: vrTune.pickAcquireDeg,
          pickHoldDeg: vrTune.pickHoldDeg,
          pickSwitchDeg: vrTune.pickSwitchDeg,
          panelScale: vrTune.panelScale,
          panoBrightness: vrTune.panoBrightness,
        },
        roles: {
          dashboard: controlRoles.dashboard,
          aimToggle: controlRoles.aimToggle,
        },
        sky: {
          stars: skyView.stars,
          constellations: skyView.constellations,
          messier: skyView.messier,
          icons: skyView.icons,
          seeing: skyView.seeing,
          ngcMode: skyView.ngcMode,
          ngcMin: skyView.ngcMin,
          mag: skyView.mag,
        },
      };
      try {
        localStorage.setItem(prefKey, JSON.stringify(payload));
      } catch (err) {
        /* Der Browser kann die Ablage verweigern. Die Werte gelten dann nur für diese Seite. */
      }
    }

    function loadPrefs() {
      let data = null;
      try {
        data = JSON.parse(localStorage.getItem(prefKey) || "null");
      } catch (err) {
        data = null;
      }
      if (!data || data.v !== 1 || typeof data !== "object") return;
      const tune = data.tune || {};
      vrTune.labelHeight = takeNumber(tune.labelHeight, 4, 12, vrDefaults.labelHeight);
      vrTune.rayMeters = takeNumber(tune.rayMeters, 0.5, 6, vrDefaults.rayMeters);
      vrTune.pickAcquireDeg = takeNumber(tune.pickAcquireDeg, 0.05, 1.5, vrDefaults.pickAcquireDeg);
      vrTune.pickHoldDeg = takeNumber(tune.pickHoldDeg, 0.1, 2, vrDefaults.pickHoldDeg);
      vrTune.pickSwitchDeg = takeNumber(tune.pickSwitchDeg, 0.02, 0.5, vrDefaults.pickSwitchDeg);
      vrTune.panelScale = takeNumber(tune.panelScale, 1, 2, vrDefaults.panelScale);
      vrTune.panoBrightness = takeNumber(tune.panoBrightness, 0, 100, vrDefaults.panoBrightness);
      if (vrTune.pickHoldDeg < vrTune.pickAcquireDeg) vrTune.pickHoldDeg = vrTune.pickAcquireDeg;
      if (Array.isArray(tune.telradHalfDeg) && tune.telradHalfDeg.length === 3) {
        vrTune.telradHalfDeg = [0, 1, 2].map((index) => takeNumber(
          tune.telradHalfDeg[index],
          0.1,
          5,
          vrDefaults.telradHalfDeg[index],
        ));
      }
      const roles = data.roles || {};
      if (roles.dashboard === "select" || roles.dashboard === "squeeze") controlRoles.dashboard = roles.dashboard;
      if (roles.aimToggle === "" || roles.aimToggle === "select" || roles.aimToggle === "squeeze") {
        controlRoles.aimToggle = roles.aimToggle;
      }
      enforceRoles();
      applyRayLength();
      rebuildTelrad();
      applyPanelScale();
      applyPanoBrightness();
      const sky = data.sky || {};
      if (typeof sky.stars === "boolean") skyView.stars = sky.stars;
      if (typeof sky.constellations === "boolean") skyView.constellations = sky.constellations;
      if (typeof sky.messier === "boolean") skyView.messier = sky.messier;
      if (typeof sky.icons === "boolean") skyView.icons = sky.icons;
      if (typeof sky.seeing === "boolean") skyView.seeing = sky.seeing;
      if (sky.ngcMode === "off" || sky.ngcMode === "mine" || sky.ngcMode === "all") skyView.ngcMode = sky.ngcMode;
      skyView.ngcMin = Math.min(5, Math.max(1, Math.round(Number(sky.ngcMin) || skyView.ngcMin)));
      skyView.mag = takeNumber(sky.mag, 0, 9, skyView.mag);
      skyView.live = true;
      skyView.when = null;
    }

    function stepPref(pref, dir) {
      const specs = {
        acquire: [() => vrTune.pickAcquireDeg, (value) => { vrTune.pickAcquireDeg = value; }, 0.05, 1.5, 0.05],
        hold: [() => vrTune.pickHoldDeg, (value) => { vrTune.pickHoldDeg = value; }, 0.1, 2, 0.05],
        switch: [() => vrTune.pickSwitchDeg, (value) => { vrTune.pickSwitchDeg = value; }, 0.02, 0.5, 0.02],
        ray: [() => vrTune.rayMeters, (value) => { vrTune.rayMeters = value; applyRayLength(); }, 0.5, 6, 0.5],
        label: [() => vrTune.labelHeight, (value) => { vrTune.labelHeight = value; applyLabelHeight(); }, 4, 12, 1],
        panel: [() => vrTune.panelScale, (value) => { vrTune.panelScale = value; applyPanelScale(); }, 1, 2, 0.1],
        pano: [() => vrTune.panoBrightness, (value) => { vrTune.panoBrightness = value; applyPanoBrightness(); }, 0, 100, 10],
        ring0: [() => vrTune.telradHalfDeg[0] * 2, (value) => { vrTune.telradHalfDeg[0] = value / 2; }, 0.2, 10, 0.1],
        ring1: [() => vrTune.telradHalfDeg[1] * 2, (value) => { vrTune.telradHalfDeg[1] = value / 2; }, 0.2, 10, 0.1],
        ring2: [() => vrTune.telradHalfDeg[2] * 2, (value) => { vrTune.telradHalfDeg[2] = value / 2; }, 0.2, 10, 0.1],
      };
      const spec = specs[pref];
      if (!spec) return;
      const [read, write, min, max, step] = spec;
      const next = roundTo(Math.min(max, Math.max(min, read() + dir * step)), step);
      if (next === roundTo(read(), step)) return;
      write(next);
      if (vrTune.pickHoldDeg < vrTune.pickAcquireDeg) {
        if (pref === "acquire") vrTune.pickHoldDeg = vrTune.pickAcquireDeg;
        else vrTune.pickAcquireDeg = vrTune.pickHoldDeg;
      }
      if (pref === "ring0" || pref === "ring1" || pref === "ring2") rebuildTelrad();
      savePrefs();
      refreshPrefLabels();
    }

    function cycleRole(pref) {
      if (pref === "dashboard") {
        controlRoles.dashboard = controlRoles.dashboard === "squeeze" ? "select" : "squeeze";
      } else if (pref === "aim") {
        const free = controlRoles.dashboard === "select" ? "squeeze" : "select";
        controlRoles.aimToggle = controlRoles.aimToggle === free ? "" : free;
      } else {
        return;
      }
      aimEnabled = true;
      enforceRoles();
      bindControlRoles();
      savePrefs();
      refreshPrefLabels();
    }

    function resetPrefs() {
      vrTune.labelHeight = vrDefaults.labelHeight;
      vrTune.rayMeters = vrDefaults.rayMeters;
      vrTune.telradHalfDeg = vrDefaults.telradHalfDeg.slice();
      vrTune.pickAcquireDeg = vrDefaults.pickAcquireDeg;
      vrTune.pickHoldDeg = vrDefaults.pickHoldDeg;
      vrTune.pickSwitchDeg = vrDefaults.pickSwitchDeg;
      vrTune.panelScale = vrDefaults.panelScale;
      vrTune.panoBrightness = vrDefaults.panoBrightness;
      controlRoles.dashboard = controlDefaults.dashboard;
      controlRoles.aimToggle = controlDefaults.aimToggle;
      aimEnabled = true;
      try {
        localStorage.removeItem(prefKey);
      } catch (err) {
        /* Bleibt der alte Eintrag stehen, setzt der nächste Wechsel ihn neu. */
      }
      applyRayLength();
      rebuildTelrad();
      applyLabelHeight();
      applyPanelScale();
      applyPanoBrightness();
      bindControlRoles();
      refreshPrefLabels();
    }

    function aimActive() {
      return !controlRoles.aimToggle || aimEnabled;
    }

    function onAimToggle() {
      aimEnabled = !aimEnabled;
      if (aimActive()) return;
      clearNavTarget();
      clearSkyCandidate();
      hideSkyAim();
      for (const pointer of pointers) pointer.line.visible = false;
    }

    function fillGreenTelrad() {
      while (greenTelrad.children.length) {
        const child = greenTelrad.children[0];
        greenTelrad.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      while (navTurn.children.length) {
        const child = navTurn.children[0];
        navTurn.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      const outer = Math.max(...vrTune.telradHalfDeg);
      for (const halfDeg of vrTune.telradHalfDeg) {
        const ring = makeRing(
          vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(halfDeg)),
          navColor,
        );
        ring.renderOrder = 5;
        greenTelrad.add(ring);
      }
      const turn = makeRing(
        vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(outer + 0.35)),
        navColor,
      );
      turn.renderOrder = 7;
      navTurn.add(turn);
      navReachedDrawn = false;
    }

    function paintGreen(reached) {
      if (navReachedDrawn === reached) return;
      navReachedDrawn = reached;
      const color = reached ? navReachedColor : navColor;
      const opacity = reached ? 1 : 0.85;
      for (const ring of greenTelrad.children) {
        ring.material.color.setHex(color);
        ring.material.opacity = opacity;
      }
    }

    function navOuterReach(extra) {
      const outer = Math.max(...vrTune.telradHalfDeg);
      return vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(outer)) + extra;
    }

    function hideNavCue() {
      navArrow.visible = false;
      navTurn.visible = false;
      navReadout.visible = false;
    }

    function clearNavTarget() {
      navTarget.active = false;
      navTarget.key = "";
      navTarget.below = false;
      navTarget.stale = false;
      navTarget.source = "";
      navTarget.query = "";
      navTarget.pending = false;
      resolveSerial += 1;
      greenTelrad.visible = false;
      paintGreen(false);
      hideNavCue();
    }

    function navDisplayOff(target) {
      if (target.kind === "messier") return !skyView.messier;
      if (target.kind === "ngc") return skyView.ngcMode === "off";
      if (target.kind === "star") return !skyView.stars;
      return false;
    }

    function findNavSource(key) {
      if (!key) return null;
      for (const body of lastBodies) if (objectKey(body) === key) return body;
      for (const star of lastStars) if (objectKey(star) === key) return star;
      for (const item of lastDso) if (objectKey(item) === key) return item;
      for (const item of lastNgc) if (objectKey(item) === key) return item;
      return null;
    }

    function syncNavTarget() {
      if (!navTarget.active || !navTarget.key) return;
      const found = findNavSource(navTarget.key);
      if (found && Number.isFinite(Number(found.az)) && Number.isFinite(Number(found.alt))) {
        navTarget.az = Number(found.az);
        navTarget.alt = Number(found.alt);
        navTarget.name = found.name || found.id || navTarget.name;
        navTarget.below = false;
        navTarget.stale = false;
        return;
      }
      if (navTarget.source === "resolve") {
        refreshResolveTarget();
        return;
      }
      if (navDisplayOff(navTarget)) {
        navTarget.below = false;
        navTarget.stale = true;
        return;
      }
      navTarget.below = true;
      navTarget.stale = false;
    }

    function adoptNavTarget(item, source) {
      const az = Number(item && item.az);
      const alt = Number(item && item.alt);
      if (!Number.isFinite(az) || !Number.isFinite(alt)) return;
      navTarget.active = true;
      navTarget.key = objectKey(item);
      navTarget.name = item.name || item.id || "Objekt";
      navTarget.kind = item.kind || (item.hip ? "star" : "");
      navTarget.id = item.id || "";
      navTarget.az = az;
      navTarget.alt = alt;
      navTarget.ra = Number.isFinite(Number(item.ra)) ? Number(item.ra) : null;
      navTarget.dec = Number.isFinite(Number(item.dec)) ? Number(item.dec) : null;
      const origin = source || "overlay";
      navTarget.source = origin;
      navTarget.query = catalogQueryOf(item);
      navTarget.pending = false;
      navTarget.below = origin === "resolve" && (item.above === false || alt <= 0);
      navTarget.stale = false;
      if (origin !== "resolve") syncNavTarget();
    }

    async function refreshResolveTarget() {
      if (!navTarget.active || navTarget.source !== "resolve" || !navTarget.query) return;
      if (findNavSource(navTarget.key)) return;
      const serial = ++resolveSerial;
      const query = navTarget.query;
      try {
        const response = await fetch(`/catalog/resolve?${catalogResolveParams(query)}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== resolveSerial || navTarget.query !== query || navTarget.source !== "resolve") return;
        const obj = data.object;
        if (!response.ok || !data.ok || !obj || !Number.isFinite(Number(obj.az)) || !Number.isFinite(Number(obj.alt))) {
          navTarget.pending = true;
          return;
        }
        navTarget.az = Number(obj.az);
        navTarget.alt = Number(obj.alt);
        navTarget.below = obj.above === false || Number(obj.alt) <= 0;
        navTarget.pending = false;
        navTarget.stale = false;
        if (panelMode === "detail" && selectedItem && selectedItem.fromSearch && objectKey(selectedItem) === navTarget.key) {
          selectedItem.az = navTarget.az;
          selectedItem.alt = navTarget.alt;
          selectedItem.above = obj.above;
          selectedItem.ra = obj.ra;
          selectedItem.dec = obj.dec;
          dashboardKey = "";
        }
      } catch (_err) {
        if (serial !== resolveSerial) return;
        navTarget.pending = true;
      }
    }

    function navCaption(angle, reached) {
      const name = navTarget.name || "Ziel";
      if (navTarget.pending) return `${name} · Position nicht erneuert`;
      if (navTarget.below) return `${name} · Ziel unter Horizont`;
      if (!Number.isFinite(angle)) return "";
      let text = `${name} · ${angle.toFixed(1).replace(".", ",")}°`;
      if (reached) text += " · erreicht";
      else if (navTarget.stale) text += " · fest";
      return text;
    }

    function paintNavReadout(text) {
      if (text !== navReadoutText) {
        navReadoutText = text;
        const previous = navReadout.material.map;
        const texture = makeLabelTexture(text);
        navReadout.material.map = texture;
        navReadout.material.needsUpdate = true;
        if (previous) previous.dispose();
      }
      const height = Math.max(7, vrTune.labelHeight);
      const image = navReadout.material.map && navReadout.material.map.image;
      const aspect = image && image.height ? image.width / image.height : 4;
      navReadout.scale.set(height * aspect, height, 1);
    }

    function tangentUp(radial, target) {
      const scale = radial.length() || 1;
      target.set(0, 1, 0).addScaledVector(radial, -(radial.y / scale) / scale);
      if (target.lengthSq() < 1e-4) target.set(1, 0, 0);
      else target.normalize();
      return target;
    }

    function placeNavReadout(hitPoint, text) {
      if (!text) {
        navReadout.visible = false;
        return;
      }
      paintNavReadout(text);
      tangentUp(hitPoint, navLocalY);
      navReadout.position.copy(hitPoint).addScaledVector(navLocalY, navOuterReach(22));
      navReadout.visible = true;
    }

    function placeNavArrow(hitPoint, heading) {
      navArrow.position.copy(hitPoint).addScaledVector(heading, navOuterReach(7));
      navArrow.up.copy(heading);
      navArrow.lookAt(0, 0, 0);
      navArrow.visible = true;
    }

    function placeNavTurn(hitPoint) {
      navTurn.position.copy(hitPoint);
      navTurn.up.set(0, 1, 0);
      navTurn.lookAt(0, 0, 0);
      navTurn.visible = true;
    }

    function placeGreenTelrad() {
      if (!navTarget.active || navTarget.below || navTarget.pending || !Number.isFinite(navTarget.az) || !Number.isFinite(navTarget.alt)) {
        greenTelrad.visible = false;
        return;
      }
      navPoint.copy(azAltToVec(navTarget.az, navTarget.alt, vrTune.shellRadius));
      sphere.localToWorld(navPoint);
      if (navPoint.lengthSq() < 1) {
        greenTelrad.visible = false;
        return;
      }
      greenTelrad.position.copy(navPoint);
      greenTelrad.lookAt(0, 0, 0);
      greenTelrad.visible = true;
    }

    function updateNavCue(direction, hitPoint) {
      if (!navTarget.active) {
        hideNavCue();
        paintGreen(false);
        return;
      }
      const aimOk = Boolean(direction && direction.lengthSq() > 0.5 && hitPoint);
      if (navTarget.below || navTarget.pending || !Number.isFinite(navTarget.az) || !Number.isFinite(navTarget.alt)) {
        navArrow.visible = false;
        navTurn.visible = false;
        paintGreen(false);
        if (aimOk && (navTarget.below || navTarget.pending)) placeNavReadout(hitPoint, navCaption(null, false));
        else navReadout.visible = false;
        return;
      }
      if (!objectWorldDir(navTarget, navTargetDir)) {
        hideNavCue();
        return;
      }
      const dot = THREE.MathUtils.clamp(direction.dot(navTargetDir), -1, 1);
      const angle = THREE.MathUtils.radToDeg(Math.acos(dot));
      const reached = angle <= vrTune.pickAcquireDeg;
      paintGreen(reached);
      if (aimOk) placeNavReadout(hitPoint, navCaption(angle, reached));
      else navReadout.visible = false;
      if (!aimOk) {
        navArrow.visible = false;
        navTurn.visible = false;
        return;
      }
      if (angle >= 165) {
        navArrow.visible = false;
        placeNavTurn(hitPoint);
        return;
      }
      navTurn.visible = false;
      if (angle < 3) {
        navArrow.visible = false;
        return;
      }
      navPerp.copy(navTargetDir).addScaledVector(direction, -dot);
      if (navPerp.lengthSq() < 1e-4) {
        navArrow.visible = false;
        return;
      }
      navPerp.normalize();
      placeNavArrow(hitPoint, navPerp);
    }

    function hideSkyAim() {
      telrad.visible = false;
      skyMark.visible = false;
    }

    function clearSkyCandidate() {
      skyKey = "";
      skyMark.visible = false;
    }

    function paintSkyLabel(name) {
      if (name === skyLabelText) return;
      skyLabelText = name;
      const previous = skyLabel.material.map;
      const texture = makeLabelTexture(name);
      skyLabel.material.map = texture;
      skyLabel.material.needsUpdate = true;
      if (previous) previous.dispose();
      const height = vrTune.labelHeight;
      skyLabel.scale.set(height * (texture.image.width / texture.image.height), height, 1);
      skyLabel.position.set(0, height * 0.55 + vrTune.markRadius, 0);
    }

    function skyHit(origin, direction) {
      const radius = vrTune.shellRadius;
      const b = origin.dot(direction);
      const disc = b * b - origin.lengthSq() + radius * radius;
      if (disc < 0) return null;
      const t = -b + Math.sqrt(disc);
      if (t <= 0) return null;
      skyPoint.copy(origin).addScaledVector(direction, t);
      return skyPoint;
    }

    function objectWorldDir(item, target) {
      target.copy(azAltToVec(Number(item.az), Number(item.alt), vrTune.shellRadius));
      sphere.localToWorld(target);
      if (target.lengthSq() < 1) return false;
      target.normalize();
      return true;
    }

    function angleDeg(a, b) {
      return THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)));
    }

    function chooseCandidate(direction) {
      let best = null;
      let bestAng = Infinity;
      const pool = lastBodies.concat(lastStars.filter((star) => star && star.name));
      if (skyView.messier) {
        for (const item of lastDso) pool.push(item);
      }
      if (skyView.ngcMode !== "off") {
        for (const item of lastNgc) pool.push(item);
      }
      for (const item of pool) {
        if (!objectWorldDir(item, objDir)) continue;
        const angle = angleDeg(direction, objDir);
        if (angle < bestAng) {
          bestAng = angle;
          best = item;
        }
      }
      if (skyKey) {
        const held = findByKey(skyKey);
        let heldAng = Infinity;
        if (held && objectWorldDir(held, objDir)) heldAng = angleDeg(direction, objDir);
        if (held && heldAng <= vrTune.pickHoldDeg) {
          if (best && objectKey(best) !== skyKey && bestAng <= heldAng - vrTune.pickSwitchDeg) {
            return { item: best, key: objectKey(best) };
          }
          return { item: held, key: skyKey };
        }
      }
      if (best && bestAng <= vrTune.pickAcquireDeg) return { item: best, key: objectKey(best) };
      return null;
    }

    function updateSkyAim() {
      placeGreenTelrad();
      if (!aimActive()) {
        hideSkyAim();
        hideNavCue();
        return;
      }
      const pointer = activeAim >= 0 ? pointers[activeAim] : null;
      if (!pointer || !pointer.ready || pointer.buttonHit) {
        hideSkyAim();
        hideNavCue();
        if (!pointer || !pointer.ready) clearSkyCandidate();
        return;
      }
      const hit = skyHit(pointer.origin, pointer.direction);
      if (!hit) {
        hideSkyAim();
        hideNavCue();
        clearSkyCandidate();
        return;
      }
      telrad.position.copy(hit);
      telrad.lookAt(0, 0, 0);
      telrad.visible = true;
      aimDir.copy(hit).normalize();
      updateNavCue(aimDir, hit);
      const pick = chooseCandidate(aimDir);
      if (!pick) {
        clearSkyCandidate();
        return;
      }
      skyKey = pick.key;
      if (!objectWorldDir(pick.item, objDir)) {
        clearSkyCandidate();
        return;
      }
      objDir.multiplyScalar(vrTune.shellRadius);
      skyMark.position.copy(objDir);
      skyMark.lookAt(0, 0, 0);
      skyMark.visible = true;
      paintSkyLabel(pick.item.name || pick.item.id || "Objekt");
    }

    function updatePointers() {
      let nextHover = null;
      const live = new Set();
      let movedIndex = -1;
      let movedAmount = vrTune.aimMotion;
      if (!renderer.xr.isPresenting) {
        clearPointerHits();
        clearSkyCandidate();
        hideSkyAim();
        hideNavCue();
        greenTelrad.visible = false;
        for (const pointer of pointers) pointer.line.visible = false;
        return;
      }
      if (dashboard.visible) dashboard.updateWorldMatrix(true, true);
      for (const pointer of pointers) {
        const index = pointers.indexOf(pointer);
        const source = pointer.source;
        const ready = Boolean(
          source && source.targetRayMode === "tracked-pointer" && pointer.space.visible
        );
        pointer.ready = ready;
        pointer.buttonHit = false;
        pointer.line.visible = ready && aimActive();
        if (!ready) {
          if (source) pointerHits.delete(source);
          continue;
        }
        live.add(source);
        pointer.space.updateWorldMatrix(true, false);
        pointer.origin.setFromMatrixPosition(pointer.space.matrixWorld);
        pointer.direction.set(0, 0, -1).transformDirection(pointer.space.matrixWorld);
        const rot = pointer.seenPose
          ? 2 * Math.acos(THREE.MathUtils.clamp(Math.abs(pointer.space.quaternion.dot(pointer.lastQuat)), 0, 1))
          : 0;
        const motion = pointer.seenPose
          ? pointer.origin.distanceTo(pointer.lastPos) + rot * vrTune.aimRotWeight
          : 0;
        pointer.seenPose = true;
        pointer.lastPos.copy(pointer.origin);
        pointer.lastQuat.copy(pointer.space.quaternion);
        if (motion > movedAmount) {
          movedAmount = motion;
          movedIndex = index;
        }
        if (!dashboard.visible) {
          pointerHits.delete(source);
          continue;
        }
        pointerRaycaster.set(pointer.origin, pointer.direction);
        const hits = pointerRaycaster.intersectObjects(pointerButtons, false);
        let button = null;
        for (const hit of hits) {
          const object = hit.object;
          if (object.visible && object.userData.action && object.parent === dashboard) {
            button = object;
            break;
          }
        }
        if (button) {
          pointer.buttonHit = true;
          pointerHits.set(source, button);
          nextHover = button;
        } else {
          pointerHits.delete(source);
        }
      }
      if (movedIndex >= 0) {
        if (movedIndex !== activeAim) skyKey = "";
        activeAim = movedIndex;
      } else if (activeAim < 0) {
        const first = pointers.findIndex((item) => item.ready);
        if (first >= 0) activeAim = first;
      }
      for (const source of pointerHits.keys()) {
        if (!live.has(source)) pointerHits.delete(source);
      }
      if (!dashboard.visible) {
        pointerHits.clear();
        nextHover = null;
      }
      setHoveredButton(nextHover);
      updateSkyAim();
    }

    function onDragStart(event) {
      const source = event && event.inputSource;
      if (!dragSource && dragArm === source) dragArm = null;
      const pointer = pointers.find((item) => item.source === source);
      if (!pointer || !pointer.ready || !dashboard.visible) return;
      pointerRaycaster.set(pointer.origin, pointer.direction);
      const hits = pointerRaycaster.intersectObject(dragHandle, false);
      if (!hits.length || !dragHandle.visible) return;
      dashboard.updateMatrixWorld(true);
      dragLocal.copy(dashboard.worldToLocal(hits[0].point.clone()));
      dragDistance = hits[0].distance;
      dragSource = source;
      dragArm = source;
    }

    function moveDraggedDashboard() {
      if (!dragSource) return;
      const pointer = pointers.find((item) => item.source === dragSource);
      if (!pointer || !pointer.ready) return;
      renderer.xr.getCamera().getWorldPosition(dragHead);
      dragRayPoint.copy(pointer.origin).addScaledVector(pointer.direction, dragDistance);
      dashboard.lookAt(dragHead);
      dashboard.updateMatrixWorld(true);
      dragGrabWorld.copy(dragLocal).applyMatrix4(dashboard.matrixWorld);
      dashboard.position.add(dragRayPoint.sub(dragGrabWorld));
    }

    function onDragEnd(event) {
      if (event && event.inputSource === dragSource) dragSource = null;
    }

    function onSelect(event) {
      const source = event && event.inputSource;
      if (dragArm && source === dragArm) {
        dragArm = null;
        dragSource = null;
        return;
      }
      const now = performance.now();
      if (now - dashboardToggleAt < vrTune.selectGapMs) return;
      dashboardToggleAt = now;
      const hit = source && dashboard.visible ? pointerHits.get(source) : null;
      const sameHand = Boolean(
        hit && hit.visible && hit.parent === dashboard && hit.userData.action && dashboard.visible
      );
      if (source && !sameHand) pointerHits.delete(source);
      if (sameHand && hit.userData.action === "objects") {
        showObjectList();
        return;
      }
      if (sameHand && hit.userData.action === "himmel") {
        showHimmel();
        return;
      }
      if (sameHand && hit.userData.action === "back") {
        goBack();
        return;
      }
      if (sameHand && hit.userData.action === "object" && hit.userData.item) {
        showObjectDetail(hit.userData.item);
        return;
      }
      if (sameHand && hit.userData.action === "prefs") {
        showPrefs();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-page") {
        prefsPage = hit.userData.page;
        syncPanelButtons();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-step") {
        stepPref(hit.userData.pref, hit.userData.dir);
        return;
      }
      if (sameHand && hit.userData.action === "prefs-cycle") {
        cycleRole(hit.userData.pref);
        return;
      }
      if (sameHand && hit.userData.action === "prefs-reset") {
        resetPrefs();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-done" || sameHand && hit.userData.action === "prefs-hold") {
        if (hit.userData.action === "prefs-done") closePrefs();
        return;
      }
      if (sameHand && hit.userData.action === "sky-toggle") {
        toggleSky(hit.userData.sky);
        return;
      }
      if (sameHand && hit.userData.action === "sky-mag") {
        stepSkyMag(hit.userData.dir);
        return;
      }
      if (sameHand && hit.userData.action === "sky-now") {
        freezeSkyNow();
        return;
      }
      if (sameHand && hit.userData.action === "sky-step") {
        stepSkyTime(hit.userData.seconds);
        return;
      }
      if (sameHand && hit.userData.action === "sky-hold") return;
      if (sameHand && hit.userData.action === "sky-icons") {
        toggleMessierIcons();
        return;
      }
      if (sameHand && hit.userData.action === "sky-seeing") {
        toggleMessierSeeing();
        return;
      }
      if (sameHand && hit.userData.action === "sky-ngc") {
        cycleNgcMode();
        return;
      }
      if (sameHand && hit.userData.action === "sky-ngc-min") {
        stepNgcMin(hit.userData.dir || 0);
        return;
      }
      if (sameHand && hit.userData.action === "day-track") {
        showDayTrack();
        return;
      }
      if (sameHand && hit.userData.action === "nav-goal") {
        if (selectedItem && selectedItem.fromSearch) aimResolvedTarget(selectedItem);
        else if (selectedItem) adoptNavTarget(selectedItem, "overlay");
        return;
      }
      if (sameHand && hit.userData.action === "kb-test") {
        openKeyboardTest();
        return;
      }
      if (sameHand && hit.userData.action === "search-page") {
        stepSearchPage(hit.userData.dir || 0);
        return;
      }
      if (sameHand && hit.userData.action === "search-hit" && hit.userData.item) {
        openSearchHit(hit.userData.item);
        return;
      }
      const aim = activeAim >= 0 ? pointers[activeAim] : null;
      const skyPick = aimActive() && aim && source === aim.source && !aim.buttonHit
        ? findByKey(skyKey) : null;
      if (skyPick) {
        if (!dashboard.visible) placeDashboard();
        showObjectDetail(skyPick);
        return;
      }
      if (dashboard.visible) {
        dashboard.visible = false;
        resetObjectPanel();
        clearPointerHits();
        return;
      }
      placeDashboard();
    }

    function placeDashboard() {
      const xrCamera = renderer.xr.getCamera();
      const headPos = new THREE.Vector3();
      const headQuat = new THREE.Quaternion();
      xrCamera.getWorldPosition(headPos);
      xrCamera.getWorldQuaternion(headQuat);
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(headQuat);
      const down = new THREE.Vector3(0, -1, 0).applyQuaternion(headQuat);
      dashboard.position.copy(headPos).addScaledVector(forward, 1.75).addScaledVector(down, 0.22);
      dashboard.lookAt(headPos);
      resetObjectPanel();
      dashboard.visible = true;
      dashboardPlaced = true;
      dashboardKey = "";
      refreshDashboard();
    }

    applyLook();
    refreshEnterButton();
    useAppPanorama().then((ok) => { if (ok) loadTexture(); });
    renderer.setAnimationLoop((_time, frame) => {
      if (!renderer.xr.isPresenting) {
        applyLook();
      } else if (!dashboardPlaced && frame) {
        const space = renderer.xr.getReferenceSpace();
        if (space && frame.getViewerPose(space)) placeDashboard();
      }
      if (renderer.xr.isPresenting) {
        updatePointers();
        moveDraggedDashboard();
      }
      if (skyView.seeing) applyMessierSeeing(performance.now());
      refreshDashboard();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
