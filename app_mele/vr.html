<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeLE VR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #020617; color: #e2e8f0;
                 font-family: sans-serif; }
    #bar { position: absolute; z-index: 2; left: 0; right: 0; top: 0; display: flex; gap: 8px;
           align-items: center; flex-wrap: wrap; padding: 8px 12px; background: rgba(15,23,42,.88); }
    #bar button { color: #e2e8f0; background: #1f4e5f; border: 0; border-radius: 4px;
                  padding: 7px 10px; cursor: pointer; font-size: 13px; }
    #bar button:disabled { opacity: .45; cursor: not-allowed; }
    #status, #diag { flex: 1 1 220px; font-size: 12px; line-height: 1.35; }
    #diag { flex-basis: 100%; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="enter" type="button" disabled>Enter VR</button>
    <div id="status">Lade …</div>
    <div id="diag">protocol: … · isSecureContext: … · immersive-vr: …</div>
  </div>
  <!-- Three.js 0.170.0 lokal unter /mele-static — kein CDN. -->
  <script type="module">
    import * as THREE from "/mele-static/three/three.module.js";

    const params = new URLSearchParams(location.search);
    let urls = {
      preview: params.get("preview") || "",
      png: params.get("png") || "",
      original: params.get("original") || "",
    };
    let tex = params.get("tex") || "preview";
    let imageUrl = urls[tex] || urls.preview || urls.png || "";
    const northParam = Number(params.get("north") || 0);
    const srcwParam = Number(params.get("srcw") || 0);
    let northOffset = srcwParam > 0 ? (360 * northParam / srcwParam) : 0;
    const debugDirections = params.get("debugDirections") === "1";
    let siteLat = params.get("lat") || "";
    let siteLon = params.get("lon") || "";
    let siteStem = params.get("stem") || "";
    const starLimit = "5.5";
    const skyView = {
      stars: true,
      constellations: true,
      messier: false,
      icons: false,
      seeing: false,
      mag: Number(starLimit),
      live: true,
      when: null,
    };
    const prefKey = "astro-vr-prefs-v1";
    const vrDefaults = {
      labelHeight: 7,
      shellRadius: 480,
      rayMeters: 2,
      selectGapMs: 400,
      telradHalfDeg: [0.25, 1, 2],
      telradColor: 0xef4444,
      markRadius: 1.8,
      markColor: 0xfde68a,
      pickAcquireDeg: 0.25,
      pickHoldDeg: 0.40,
      pickSwitchDeg: 0.08,
      aimMotion: 0.01,
      aimRotWeight: 0.2,
      panelScale: 1.5,
    };
    const controlDefaults = { dashboard: "select", aimToggle: "" };
    const vrTune = {
      labelHeight: vrDefaults.labelHeight,
      shellRadius: vrDefaults.shellRadius,
      rayMeters: vrDefaults.rayMeters,
      selectGapMs: vrDefaults.selectGapMs,
      telradHalfDeg: vrDefaults.telradHalfDeg.slice(),
      telradColor: vrDefaults.telradColor,
      markRadius: vrDefaults.markRadius,
      markColor: vrDefaults.markColor,
      pickAcquireDeg: vrDefaults.pickAcquireDeg,
      pickHoldDeg: vrDefaults.pickHoldDeg,
      pickSwitchDeg: vrDefaults.pickSwitchDeg,
      aimMotion: vrDefaults.aimMotion,
      aimRotWeight: vrDefaults.aimRotWeight,
      panelScale: vrDefaults.panelScale,
    };
    const controlRoles = {
      dashboard: controlDefaults.dashboard,
      aimToggle: controlDefaults.aimToggle,
    };
    let aimEnabled = true;
    const labelTextures = new Map();
    let skyObjects = [];
    let skyTimer = 0;
    let skySerial = 0;
    let skyBusy = false;
    let skyDirty = false;
    let skyNote = "";
    let skyStars = 0;
    let skyNames = 0;
    let skyWhen = "";
    let skyLink = "warte";
    let skyFault = "";

    const statusEl = document.getElementById("status");
    const diagEl = document.getElementById("diag");
    const enterBtn = document.getElementById("enter");

    function setStatus(text) {
      statusEl.textContent = skyNote ? `${text} · ${skyNote}` : text;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 0);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local");
    renderer.xr.setFramebufferScaleFactor(1);
    document.body.appendChild(renderer.domElement);

    const sphere = new THREE.Group();
    const sky = new THREE.Group();
    // Dieselbe Innenansicht wie pano.html: scale(-1,1,1), kein zusätzliches BackSide.
    // Y-Drehung legt Azimut 0 (Nord) auf die Blickrichtung −Z, passend zu applyLook.
    function applyNorth(offset) {
      northOffset = offset;
      sphere.rotation.y = THREE.MathUtils.degToRad(northOffset + 90);
      placeDirectionMarks();
    }

    // Dieselbe Abbildung wie azAltToVec in pano.html. Lokal in der Gruppe,
    // damit die Gruppen-Drehung Marken und Foto gemeinsam schiebt.
    function azAltToVec(az, alt, radius) {
      const viewLon = ((az + northOffset) % 360 + 360) % 360;
      const phi = THREE.MathUtils.degToRad(90 - alt);
      const theta = THREE.MathUtils.degToRad(viewLon);
      return new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta) * radius,
        Math.cos(phi) * radius,
        Math.sin(phi) * Math.sin(theta) * radius,
      );
    }

    const directionMarks = [];

    function makeDirectionSprite(label, color) {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(64, 64, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#020617";
      ctx.font = "bold 72px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, 64, 70);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      }));
      sprite.scale.set(22, 22, 1);
      sprite.renderOrder = 2;
      return sprite;
    }

    function placeDirectionMarks() {
      if (!debugDirections) return;
      if (!directionMarks.length) {
        for (const [label, az, color] of [
          ["N", 0, "#f8fafc"],
          ["O", 90, "#fbbf24"],
          ["S", 180, "#38bdf8"],
          ["W", 270, "#fb7185"],
        ]) {
          const sprite = makeDirectionSprite(label, color);
          sprite.userData.az = az;
          sphere.add(sprite);
          directionMarks.push(sprite);
        }
      }
      for (const sprite of directionMarks) {
        sprite.position.copy(azAltToVec(sprite.userData.az, 20, 480));
      }
    }

    function starDisc(mag) {
      const m = Number.isFinite(mag) ? mag : 5;
      const size = Math.max(1.8, 12 * Math.pow(2.512, -0.28 * (m + 0.3)));
      const tone = THREE.MathUtils.clamp((7.2 - m) / 8.0, 0.22, 1);
      const gray = 0.32 + 0.68 * tone;
      return { size, gray };
    }

    function disposeSkyObject(object) {
      if (object.geometry) object.geometry.dispose();
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      for (const material of materials) {
        if (!material) continue;
        if (material.map && !material.userData.sharedMap) material.map.dispose();
        material.dispose();
      }
    }

    function makeStarPoints(stars) {
      if (!stars.length) return null;
      const positions = new Float32Array(stars.length * 3);
      const colors = new Float32Array(stars.length * 3);
      const sizes = new Float32Array(stars.length);
      stars.forEach((star, index) => {
        const vec = azAltToVec(Number(star.az), Number(star.alt), vrTune.shellRadius);
        const disc = starDisc(Number(star.mag));
        positions[index * 3] = vec.x;
        positions[index * 3 + 1] = vec.y;
        positions[index * 3 + 2] = vec.z;
        colors[index * 3] = disc.gray;
        colors[index * 3 + 1] = disc.gray;
        colors[index * 3 + 2] = disc.gray;
        sizes[index] = disc.size;
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      const points = new THREE.Points(geo, new THREE.ShaderMaterial({
        uniforms: { uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
        vertexShader: `
          attribute float aSize;
          attribute vec3 aColor;
          uniform float uPixelRatio;
          varying vec3 vColor;
          void main() {
            vColor = aColor;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = aSize * uPixelRatio;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main() {
            vec2 p = gl_PointCoord - vec2(0.5);
            float r = length(p);
            if (r > 0.5) discard;
            float edge = smoothstep(0.5, 0.22, r);
            gl_FragColor = vec4(vColor, edge);
          }
        `,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      }));
      points.renderOrder = 1;
      points.frustumCulled = false;
      return points;
    }

    function makeConstellationLines(lines) {
      const usable = lines.filter((line) => (
        Number.isFinite(Number(line.az1)) && Number.isFinite(Number(line.alt1))
        && Number.isFinite(Number(line.az2)) && Number.isFinite(Number(line.alt2))
      ));
      if (!usable.length) return null;
      const positions = new Float32Array(usable.length * 6);
      usable.forEach((line, index) => {
        const a = azAltToVec(Number(line.az1), Number(line.alt1), 478);
        const b = azAltToVec(Number(line.az2), Number(line.alt2), 478);
        positions.set([a.x, a.y, a.z, b.x, b.y, b.z], index * 6);
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const segments = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.85,
        depthTest: false,
        depthWrite: false,
      }));
      segments.renderOrder = 1;
      segments.frustumCulled = false;
      return segments;
    }

    function makeLabelTexture(name) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const font = "bold 42px sans-serif";
      ctx.font = font;
      const textWidth = Math.ceil(ctx.measureText(name).width);
      canvas.width = Math.max(64, textWidth + 28);
      canvas.height = 64;
      ctx.font = font;
      ctx.fillStyle = "rgba(2, 6, 23, 0.62)";
      ctx.fillRect(0, 8, canvas.width, 48);
      ctx.fillStyle = "#e0f2fe";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(name, canvas.width / 2, 34);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.userData.label = name;
      return texture;
    }

    function textureForLabel(iau, name) {
      const key = String(iau || name);
      const cached = labelTextures.get(key);
      if (cached && cached.userData.label === name) return cached;
      if (cached) {
        cached.dispose();
        labelTextures.delete(key);
      }
      const texture = makeLabelTexture(name);
      labelTextures.set(key, texture);
      return texture;
    }

    function makeLabelSprite(label) {
      const name = String(label.name || label.iau || "");
      const az = Number(label.az);
      const alt = Number(label.alt);
      if (!name || !Number.isFinite(az) || !Number.isFinite(alt)) return null;
      const texture = textureForLabel(label.iau || name, name);
      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      });
      material.userData.sharedMap = true;
      const sprite = new THREE.Sprite(material);
      const height = vrTune.labelHeight;
      sprite.scale.set(height * (texture.image.width / texture.image.height), height, 1);
      sprite.position.copy(azAltToVec(az, alt, 470));
      sprite.renderOrder = 2;
      sprite.frustumCulled = false;
      sprite.userData.labelSprite = true;
      return sprite;
    }

    const bodyColors = {
      Sonne: 0xfde68a,
      Mond: 0xe5e7eb,
      Merkur: 0xa8a29e,
      Venus: 0xfef3c7,
      Mars: 0xf87171,
      Jupiter: 0xfdba74,
      Saturn: 0xfbbf24,
      Uranus: 0x67e8f9,
      Neptun: 0x60a5fa,
    };

    function makeBodyMark(body) {
      if (!body || body.kind === "earth" || body.name === "Erde") return [];
      const az = Number(body.az);
      const alt = Number(body.alt);
      if (!Number.isFinite(az) || !Number.isFinite(alt)) return [];
      const kind = body.kind || "planet";
      const discRadius = kind === "sun" ? 3.2 : (kind === "moon" ? 3.0 : 1.8);
      const mesh = new THREE.Mesh(
        new THREE.CircleGeometry(discRadius, 32),
        new THREE.MeshBasicMaterial({
          color: bodyColors[body.name] || 0xe2e8f0,
          transparent: true,
          opacity: kind === "sun" ? 0.72 : 0.9,
          depthTest: false,
          depthWrite: false,
          side: THREE.DoubleSide,
        }),
      );
      mesh.position.copy(azAltToVec(az, alt, 476));
      mesh.renderOrder = 2;
      mesh.frustumCulled = false;
      mesh.userData.faceOrigin = true;
      const objects = [mesh];
      let caption = String(body.name || body.id || "");
      if (kind === "moon" && Number.isFinite(Number(body.phase))) {
        caption = `${caption} ${Math.round(Number(body.phase) * 100)}%`;
      }
      try {
        const sprite = makeLabelSprite({ iau: body.id || caption, name: caption, az, alt: alt + 1.6 });
        if (sprite) objects.push(sprite);
      } catch (_err) {
        // Das Schild darf die Scheibe nicht verhindern.
      }
      return objects;
    }

    function faceOrigin(object) {
      if (!object.userData.faceOrigin) return;
      if (Math.abs(object.position.y) > 0.95 * object.position.length()) object.up.set(1, 0, 0);
      object.lookAt(0, 0, 0);
    }

    function buildSky(stars, lines, labels, bodies, dsos) {
      const objects = [];
      try {
        const points = makeStarPoints(stars);
        if (points) objects.push(points);
        const segments = makeConstellationLines(lines);
        if (segments) objects.push(segments);
        for (const label of labels) {
          try {
            const sprite = makeLabelSprite(label);
            if (sprite) objects.push(sprite);
          } catch (_err) {
            // Ein einzelnes Schild darf den Himmel nicht leeren.
          }
        }
        for (const body of bodies) {
          try {
            objects.push(...makeBodyMark(body));
          } catch (_err) {
            // Ein Gestirn darf den übrigen Himmel nicht leeren.
          }
        }
        try {
          objects.push(...makeMessierLayer(dsos || []));
        } catch (_err) {
          // Die Messier-Schicht darf den übrigen Himmel nicht leeren.
        }
        return objects;
      } catch (err) {
        for (const object of objects) disposeSkyObject(object);
        throw err;
      }
    }

    function messierKind(type) {
      const code = String(type || "").trim();
      if (!code) return 0;
      if (code === "G" || code === "GPair" || code === "GTrpl" || code === "GGroup") return 1;
      if (code === "GCl") return 2;
      if (code === "OCl" || code === "*Ass" || code === "Cl+N") return 3;
      if (code === "PN") return 4;
      if (code === "Neb" || code === "HII" || code === "EmN" || code === "RfN" || code === "DrkN" || code === "SNR") return 5;
      return 6;
    }

    const messierTints = [0xfbbf24, 0xbfdbfe, 0xfcd34d, 0xfef3c7, 0x5eead4, 0xf9a8d4, 0xe7e5e4];

    function makeMessierLayer(items) {
      const usable = items.filter((item) => Number.isFinite(Number(item.az)) && Number.isFinite(Number(item.alt)));
      if (!usable.length) return [];
      const positions = new Float32Array(usable.length * 3);
      const colors = new Float32Array(usable.length * 3);
      const sizes = new Float32Array(usable.length);
      const shapes = new Float32Array(usable.length);
      const seeds = new Float32Array(usable.length);
      const tint = new THREE.Color();
      usable.forEach((item, index) => {
        const vec = azAltToVec(Number(item.az), Number(item.alt), vrTune.shellRadius);
        const kind = messierKind(item.type);
        const shape = skyView.icons ? kind : 0;
        tint.setHex(shape === 0 ? 0xfbbf24 : messierTints[kind]);
        positions[index * 3] = vec.x;
        positions[index * 3 + 1] = vec.y;
        positions[index * 3 + 2] = vec.z;
        colors[index * 3] = tint.r;
        colors[index * 3 + 1] = tint.g;
        colors[index * 3 + 2] = tint.b;
        sizes[index] = shape === 0 ? 12 : 18;
        shapes[index] = shape;
        seeds[index] = (index % 17) / 17;
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute("aShape", new THREE.BufferAttribute(shapes, 1));
      geo.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
      const points = new THREE.Points(geo, new THREE.ShaderMaterial({
        uniforms: {
          uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
          uTime: { value: 0 },
          uSeeing: { value: skyView.seeing ? 1 : 0 },
        },
        vertexShader: `
          attribute float aSize;
          attribute vec3 aColor;
          attribute float aShape;
          attribute float aSeed;
          uniform float uPixelRatio;
          varying vec3 vColor;
          varying float vShape;
          varying float vSeed;
          void main() {
            vColor = aColor;
            vShape = aShape;
            vSeed = aSeed;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = aSize * uPixelRatio;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vShape;
          varying float vSeed;
          uniform float uTime;
          uniform float uSeeing;
          void main() {
            vec2 uv = gl_PointCoord;
            float wobble = 0.0;
            if (uSeeing > 0.5) {
              wobble = sin(uTime * 2.8 + vSeed * 6.28318);
              uv += vec2(wobble, sin(uTime * 1.9 + vSeed * 11.2)) * 0.045;
            }
            vec2 p = (uv - vec2(0.5)) * (1.0 + 0.18 * max(wobble, 0.0));
            float alpha = 0.0;
            if (vShape < 0.5) {
              float r = length(p);
              if (r > 0.5) discard;
              alpha = smoothstep(0.5, 0.22, r);
            } else if (vShape < 1.5) {
              vec2 g = p / 0.7;
              float r = length(vec2(g.x * 0.76, g.y));
              if (r > 0.5) discard;
              alpha = smoothstep(0.5, 0.18, r);
            } else if (vShape < 2.5) {
              float r = length(p);
              if (r > 0.48) discard;
              alpha = max(smoothstep(0.48, 0.16, r) * 0.55, smoothstep(0.2, 0.0, r));
            } else if (vShape < 3.5) {
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.30, 0.34))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.70, 0.30))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.50, 0.56))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.26, 0.70))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.74, 0.72))));
              if (alpha < 0.04) discard;
            } else if (vShape < 4.5) {
              float r = length(p);
              alpha = smoothstep(0.16, 0.28, r) * smoothstep(0.48, 0.34, r);
              if (alpha < 0.04) discard;
            } else if (vShape < 5.5) {
              float blob = smoothstep(0.50, 0.02, length(p));
              float puff = smoothstep(0.28, 0.0, length(p - vec2(0.10, -0.08)));
              alpha = max(blob * 0.72, puff * 0.45);
              if (alpha < 0.05) discard;
            } else {
              float m = abs(p.x) + abs(p.y);
              if (m > 0.46) discard;
              alpha = smoothstep(0.46, 0.22, m);
            }
            float gleam = uSeeing > 0.5 ? (0.62 + 0.38 * (0.5 + 0.5 * wobble)) : 1.0;
            gl_FragColor = vec4(vColor, alpha * gleam);
          }
        `,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      }));
      points.renderOrder = 2;
      points.frustumCulled = false;
      points.userData.messier = true;
      points.userData.messierPoints = true;
      const objects = [points];
      for (const item of usable) {
        const caption = String(item.id || "").trim();
        const az = Number(item.az);
        const alt = Number(item.alt);
        if (!caption) continue;
        try {
          const sprite = makeLabelSprite({ iau: `M:${caption}`, name: caption, az, alt: alt + 1.2 });
          if (!sprite) continue;
          sprite.userData.labelScale = 0.72;
          sprite.userData.messier = true;
          const height = vrTune.labelHeight * sprite.userData.labelScale;
          const aspect = sprite.scale.y ? sprite.scale.x / sprite.scale.y : 2;
          sprite.scale.set(height * aspect, height, 1);
          objects.push(sprite);
        } catch (_err) {
          // Ein Schild darf die übrigen Messier-Punkte nicht verhindern.
        }
      }
      return objects;
    }

    function showSky(stars, lines, labels, bodies, dsos) {
      const next = buildSky(stars, lines, labels, bodies, dsos || []);
      try {
        for (const object of next) sky.add(object);
        for (const object of next) faceOrigin(object);
      } catch (err) {
        for (const object of next) sky.remove(object);
        for (const object of next) disposeSkyObject(object);
        throw err;
      }
      const previous = skyObjects;
      skyObjects = next;
      for (const object of previous) {
        sky.remove(object);
        disposeSkyObject(object);
      }
    }

    function hideMessierMarks() {
      const kept = [];
      for (const object of skyObjects) {
        if (!object.userData.messier) {
          kept.push(object);
          continue;
        }
        sky.remove(object);
        disposeSkyObject(object);
      }
      skyObjects = kept;
    }

    function rebuildMessierMarks() {
      hideMessierMarks();
      if (!skyView.messier || !lastDso.length) return;
      const layer = [];
      try {
        layer.push(...makeMessierLayer(lastDso));
        for (const object of layer) sky.add(object);
        for (const object of layer) faceOrigin(object);
        skyObjects.push(...layer);
      } catch (err) {

    function makeRing(radius, color) {
      const points = [];

      }
      const ring = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({
          color,
          transparent: true,
          opacity: 0.85,
          depthTest: false,

      );
      ring.frustumCulled = false;
      ring.raycast = () => {};

    });

    function formatCoord(value, positive, negative) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "fehlt";
      const hemisphere = number >= 0 ? positive : negative;
      return `${Math.abs(number).toFixed(5)}° ${hemisphere}`;
    }

    function formatWhen(value) {
      if (!value) return "noch keins";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 19);
      return date.toISOString().slice(0, 19).replace("T", " ") + " UTC";
    }

    function dashboardSections() {

      const when = formatWhen(skyWhen);

        : ["Overlay " + skyLink, "Abruf " + when];
      return [
        { title: "Zeit", lines: [utc, skyView.live ? "Live" : "Fest"] },
        { title: "Standort", lines: [formatCoord(siteLat, "N", "S"), formatCoord(siteLon, "E", "W")] },
        { title: "Himmel", lines: [`${skyStars} Sterne`, `${skyNames} Sternbilder`, "Overlay " + when] },
        { title: "System", lines: system },
      ];
    }

    function fmtRa(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      const hours = (((value % 360) + 360) % 360) / 15;
      const h = Math.floor(hours);
      const minutes = (hours - h) * 60;
      const m = Math.floor(minutes);
      const s = (minutes - m) * 60;
      return `${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${s.toFixed(2)}s`;
    }

    function fmtDec(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      const sign = value >= 0 ? "+" : "-";
      const abs = Math.abs(value);
      const d = Math.floor(abs);
      const minutes = (abs - d) * 60;
      const m = Math.floor(minutes);
      const s = (minutes - m) * 60;
      return `${sign}${String(d).padStart(2, "0")}° ${String(m).padStart(2, "0")}' ${s.toFixed(1)}"`;
    }

    function fmtDeg(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      return `${value >= 0 ? "+" : ""}${value.toFixed(1)}°`;
    }

    function objectKey(item) {
      if (!item) return "";
      const kind = item.kind || (item.hip ? "star" : "object");
      if (item.hip) return `${kind}:hip:${item.hip}`;

      return `${kind}:name:${item.name || ""}`;
    }

    function objectChoices() {
      const named = lastStars.filter((star) => star && star.name).slice().sort((a, b) => {
        const mag = Number(a.mag) - Number(b.mag);
        if (mag) return mag;
        return String(a.name).localeCompare(String(b.name), "de");
      });
      return lastBodies.concat(named).slice(0, 6);
    }

    function findByKey(key) {
      if (!key) return null;
      for (const body of lastBodies) if (objectKey(body) === key) return body;
      for (const star of lastStars) if (objectKey(star) === key) return star;
      if (skyView.messier) {
        for (const item of lastDso) if (objectKey(item) === key) return item;
      }
      return null;
    }

    function kindLabel(item) {
      if (item.kind === "sun") return "Sonne";
      if (item.kind === "moon") return "Mond";
      if (item.kind === "planet") return "Planet";
      if (item.kind === "messier") return "Messier";
      if (item.kind === "star" || item.hip) return "Stern";
      return item.kind || "Objekt";
    }

    function dsoTypeLabel(code) {
      const names = {
        "*": "Stern",
        "**": "Doppelstern",
        "*Ass": "Sterngruppe",
        OCl: "Offener Sternhaufen",
        GCl: "Kugelsternhaufen",
        "Cl+N": "Haufen mit Nebel",
        G: "Galaxie",
        PN: "Planetarischer Nebel",
        Neb: "Nebel",
        HII: "H-II-Gebiet",
        SNR: "Supernovaüberrest",
      };
      const text = String(code || "").trim();
      if (!text) return "";
      return names[text] || text;
    }

    function detailLines(item, missing) {
      const lines = [
        item.name || item.id || "Objekt",
        kindLabel(item),
      ];
      if (item.type) {
        const type = dsoTypeLabel(item.type);
        if (type) lines.push(type);
      }
      lines.push(
        `RA ${fmtRa(item.ra)}`,
        `Dec ${fmtDec(item.dec)}`,
        `Az ${fmtDeg(item.az)}`,
        `Höhe ${fmtDeg(item.alt)}`,
      );
      if (item.mag != null && Number.isFinite(Number(item.mag))) {
        const band = item.mag_band ? ` ${item.mag_band}` : "";
        lines.push(`${Number(item.mag).toFixed(2)} mag${band}`);
      }
      if (item.phase != null && Number.isFinite(Number(item.phase))) {
        lines.push(`Phase ${Math.round(Number(item.phase) * 100)}%`);
      }
      if (missing) lines.push("nicht mehr in der Liste");
      return lines;
    }

    function hideObjectRows() {
      for (const row of objectRows) {
        row.visible = false;
        row.userData.item = null;
      }
    }

    function updateObjectRows() {
      const choices = objectChoices();
      objectRows.forEach((row, index) => {
        const item = choices[index];
        if (!item) {
          row.visible = false;
          row.userData.item = null;
          row.userData.key = "";
          return;
        }
        const key = objectKey(item);
        const label = item.name || item.id || "Objekt";
        row.visible = true;
        row.userData.item = item;
        if (row.userData.key === key && row.userData.label === label) return;
        row.userData.key = key;
        row.userData.label = label;
        paintTextButton(row, label);
      });
    }

    function showHome() {
      panelMode = "home";
      panelReturn = "home";
      selectedItem = null;
      selectedKey = "";
      selectedMissing = false;
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showHimmel() {
      panelMode = "himmel";
      panelReturn = "home";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showObjectList() {
      panelMode = "list";
      panelReturn = "home";
      selectedItem = null;
      selectedKey = "";
      selectedMissing = false;
      syncPanelButtons();
      updateObjectRows();
      dashboardKey = "";
      paintDashboard();
    }

    function showObjectDetail(item) {
      if (panelMode !== "detail") {
        panelReturn = panelMode === "list" || panelMode === "himmel" || panelMode === "prefs"
          ? panelMode
          : "home";
      }
      panelMode = "detail";
      selectedItem = item;
      selectedKey = objectKey(item);
      selectedMissing = false;
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function goBack() {
      if (panelMode === "detail" && panelReturn === "list") {
        showObjectList();
        return;
      }
      if (panelMode === "detail" && panelReturn === "himmel") {
        showHimmel();
        return;
      }
      if (panelMode === "detail" && panelReturn === "prefs") {
        showPrefs();
        return;
      }
      showHome();
    }

    function resetObjectPanel() {
      showHome();
    }

    function refreshObjectPanel() {
      if (panelMode === "list") {
        updateObjectRows();
        return;
      }
      if (panelMode !== "detail" || !selectedKey || !selectedItem) return;
      const found = findByKey(selectedKey);
      if (found) {
        selectedItem = found;
        selectedMissing = false;
      } else {
        selectedMissing = true;
      }
    }

    function paintDashboard() {
      const ctx = dashboardCanvas.getContext("2d");
      const width = dashboardCanvas.width;
      const height = dashboardCanvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(15, 23, 42, 0.86)";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(125, 211, 252, 0.85)";
      ctx.lineWidth = 6;
      ctx.strokeRect(8, 8, width - 16, height - 16);
      if (panelMode === "list") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Objekte", 48, 28);
        if (!objectChoices().length) {
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "34px sans-serif";
          ctx.fillText("Keine Gestirne in der letzten Antwort.", 48, 100);
        }
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "prefs") {
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "himmel") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Himmel", 48, 22);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "26px sans-serif";
        const messierNote = skyView.messier
          ? `  ·  ${lastDso.length} Messier · ${skyView.icons ? "Typen" : "Scheiben"}${skyView.seeing ? " · Unruhe" : ""}`
          : "";
        ctx.fillText(`${skyClockLabel()}${messierNote}`, 48, 68);
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "detail" && selectedItem) {
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        detailLines(selectedItem, selectedMissing).forEach((line, index) => {
          ctx.fillStyle = index === 0 ? "#7dd3fc" : "#e2e8f0";
          ctx.font = index === 0 ? "bold 40px sans-serif" : "32px sans-serif";
          ctx.fillText(line, 48, 36 + index * 52);
        });
        dashboardTexture.needsUpdate = true;
        return;
      }
      ctx.fillStyle = "#7dd3fc";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Astro-VR", 48, 28);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "28px sans-serif";
      const sections = dashboardSections();
      const clock = sections[0] && sections[0].lines ? sections[0].lines[0] : "";
      const fault = skyFault ? `  ·  ${String(skyFault).slice(0, 42)}` : "";
      ctx.fillText(`${clock}  ·  ${skyStars} Sterne${fault}`, 48, 78);
      dashboardTexture.needsUpdate = true;
    }

    function refreshDashboard() {
      if (!dashboard.visible) return;
      const key = panelMode === "prefs"
        ? "prefs"
        : panelMode === "himmel"
        ? `himmel|${skyClockLabel()}|${skyView.mag}|${skyView.live}|${skyView.stars}|${skyView.constellations}|${skyView.messier}|${skyView.icons}|${skyView.seeing}|${lastDso.length}`
        : panelMode === "list"
        ? `list|${objectChoices().map(objectKey).join(",")}`
        : (panelMode === "detail" && selectedItem
          ? `detail|${detailLines(selectedItem, selectedMissing).join("|")}`
          : `home|${dashboardSections().map((section) => section.title + section.lines.join("|")).join("||")}|${skyStars}`);
      if (key === dashboardKey) return;
      dashboardKey = key;
      paintDashboard();
    }

    function paintMenuButton(mesh, title, subtitle) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(title, canvas.width / 2, 34);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "28px sans-serif";
      ctx.fillText(subtitle, canvas.width / 2, 70);
      mesh.userData.texture.needsUpdate = true;
    }

    function paintTextButton(mesh, text) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 40px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      mesh.userData.texture.needsUpdate = true;
    }

    function makeTextButton(label, action, x, y, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 96;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({
          map: texture,
          color: testRest,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          side: THREE.FrontSide,
        }),
      );
      mesh.position.set(x, y, 0.004);
      mesh.renderOrder = 11;
      mesh.userData.action = action;
      mesh.userData.canvas = canvas;
      mesh.userData.texture = texture;
      dashboard.add(mesh);
      paintTextButton(mesh, label);
      return mesh;
    }

    function tabColor(tab) {
      return panelMode === "prefs" && tab.userData.page === prefsPage ? 0xbae6fd : testRest;
    }

    function setHoveredButton(button) {
      if (hoveredButton === button) return;
      if (hoveredButton) {
        hoveredButton.material.color.setHex(prefTabs.includes(hoveredButton) ? tabColor(hoveredButton) : testRest);
      }
      hoveredButton = button;
      if (hoveredButton) hoveredButton.material.color.setHex(testHoverColor);
    }

    function clearPointerHits() {
      pointerHits.clear();
      setHoveredButton(null);
    }

    function takeNumber(value, min, max, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function roundTo(value, step) {
      const places = (String(step).split(".")[1] || "").length;
      return Number(value.toFixed(places));
    }

    function fmtTune(value, digits) {
      let text = value.toFixed(digits);
      if (text.includes(".")) text = text.replace(/0+$/, "").replace(/\.$/, "");
      return text.replace(".", ",");
    }

    function roleLabel(role) {
      if (role === "select") return "Abzug";
      if (role === "squeeze") return "Griff";
      return "Keine";
    }

    function prefText(pref) {
      if (pref === "acquire") return `Treffer ${fmtTune(vrTune.pickAcquireDeg, 2)}°`;
      if (pref === "hold") return `Halten ${fmtTune(vrTune.pickHoldDeg, 2)}°`;
      if (pref === "switch") return `Wechsel ${fmtTune(vrTune.pickSwitchDeg, 2)}°`;
      if (pref === "ray") return `Strahl ${fmtTune(vrTune.rayMeters, 1)} m`;
      if (pref === "ring0") return `Innen ${fmtTune(vrTune.telradHalfDeg[0] * 2, 1)}°`;
      if (pref === "ring1") return `Mitte ${fmtTune(vrTune.telradHalfDeg[1] * 2, 1)}°`;
      if (pref === "ring2") return `Außen ${fmtTune(vrTune.telradHalfDeg[2] * 2, 1)}°`;
      if (pref === "label") return `Namen ${fmtTune(vrTune.labelHeight, 0)}`;
      if (pref === "panel") return `Tafel ${Math.round(vrTune.panelScale * 100)} %`;
      if (pref === "mark") return "Markierung Telrad";
      if (pref === "dashboard") return `Öffnen ${roleLabel(controlRoles.dashboard)}`;
      if (pref === "aim") return `Zielhilfe ${roleLabel(controlRoles.aimToggle)}`;
      return pref;
    }

    function refreshPrefLabels() {
      for (const row of prefRows) paintTextButton(row.label, prefText(row.pref));
      for (const tab of prefTabs) {
        if (tab !== hoveredButton) tab.material.color.setHex(tabColor(tab));
      }
    }

    function syncPanelButtons() {
      const prefs = panelMode === "prefs";
      const home = panelMode === "home";
      objectsButton.visible = home;
      skyMenuButton.visible = home;
      prefsButton.visible = home;
      backButton.visible = panelMode === "list" || panelMode === "detail" || panelMode === "himmel";
      if (panelMode !== "list") hideObjectRows();
      for (const tab of prefTabs) tab.visible = prefs;
      for (const row of prefRows) {
        const show = prefs && row.page === prefsPage;
        for (const widget of row.widgets) widget.visible = show;
      }
      prefReset.visible = prefs;
      prefDone.visible = prefs;
      const himmel = panelMode === "himmel";
      for (const button of skyControls) button.visible = himmel;
      if (prefs) refreshPrefLabels();
      if (himmel) paintHimmelButtons();
    }

    function skyClockLabel() {
      const stamp = skyView.live || !skyView.when
        ? formatWhen(skyWhen)
        : formatWhen(skyView.when.toISOString());
      return `${stamp} · ${skyView.live ? "Live" : "fest"}`;
    }

    function paintHimmelButtons() {
      paintTextButton(skyStarsBtn, skyView.stars ? "Sterne EIN" : "Sterne AUS");
      paintTextButton(skyConstBtn, skyView.constellations ? "Sternbilder EIN" : "Sternbilder AUS");
      paintTextButton(skyMessierBtn, skyView.messier ? "Messier EIN" : "Messier AUS");
      paintTextButton(skyMagLabel, `${skyView.mag.toFixed(1).replace(".", ",")} mag`);
      paintTextButton(skyLiveBtn, skyView.live ? "LIVE EIN" : "LIVE AUS");
      paintTextButton(skyIconBtn, skyView.icons ? "Form TYPEN" : "Form SCHEIBE");
      paintTextButton(skySeeingBtn, skyView.seeing ? "Unruhe EIN" : "Unruhe AUS");
      const messierOn = panelMode === "himmel" && skyView.messier;
      skyIconBtn.visible = messierOn;
      skySeeingBtn.visible = messierOn;
    }

    function messierPointsObject() {
      for (const object of skyObjects) if (object.userData.messierPoints) return object;
      return null;
    }

    function applyMessierSeeing(timeMs) {
      const points = messierPointsObject();
      const uniforms = points && points.material && points.material.uniforms;
      if (!uniforms || !uniforms.uSeeing) return;
      uniforms.uSeeing.value = skyView.seeing ? 1 : 0;
      if (skyView.seeing && uniforms.uTime) uniforms.uTime.value = timeMs * 0.001;
    }

    function toggleMessierIcons() {
      skyView.icons = !skyView.icons;
      paintHimmelButtons();
      dashboardKey = "";
      if (skyView.messier) rebuildMessierMarks();
    }

    function toggleMessierSeeing() {
      skyView.seeing = !skyView.seeing;
      applyMessierSeeing(performance.now());
      paintHimmelButtons();
      dashboardKey = "";
    }

    function toggleSky(which) {
      if (which === "stars") skyView.stars = !skyView.stars;
      else if (which === "const") skyView.constellations = !skyView.constellations;
      else if (which === "messier") {
        skyView.messier = !skyView.messier;
        if (!skyView.messier) hideMessierMarks();
        if (skyKey && !findByKey(skyKey)) {
          skyKey = "";
          skyMark.visible = false;
        }
        refreshObjectPanel();
      }
      else if (which === "live") {
        skyView.live = !skyView.live;
        if (skyView.live) skyView.when = null;
        else if (!skyView.when) skyView.when = skyWhen ? new Date(skyWhen) : new Date();
        syncSkyClock();
        paintHimmelButtons();
        dashboardKey = "";
        if (skyView.live) requestSky(true);
        return;
      }
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function stepSkyMag(dir) {
      const next = Math.min(9, Math.max(0, Math.round((skyView.mag + dir * 0.5) * 2) / 2));
      if (next === skyView.mag) return;
      skyView.mag = next;
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function freezeSkyNow() {
      skyView.live = false;
      skyView.when = new Date();
      syncSkyClock();
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function stepSkyTime(seconds) {
      skyView.live = false;
      const base = skyView.when ? skyView.when.getTime() : Date.now();
      skyView.when = new Date(base + seconds * 1000);
      syncSkyClock();
      paintHimmelButtons();
      dashboardKey = "";
      requestSky(true);
    }

    function showPrefs() {
      panelMode = "prefs";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function closePrefs() {
      showHome();
    }

    function applyRayLength() {
      for (const pointer of pointers) pointer.line.scale.z = vrTune.rayMeters;
    }

    function rebuildTelrad() {
      while (telrad.children.length) {
        const child = telrad.children[0];
        telrad.remove(child);
        child.geometry.dispose();
        child.material.dispose();
      }
      for (const halfDeg of vrTune.telradHalfDeg) {
        const ring = makeRing(
          vrTune.shellRadius * Math.tan(THREE.MathUtils.degToRad(halfDeg)),
          vrTune.telradColor,
        );
        ring.renderOrder = 5;
        telrad.add(ring);
      }
    }

    function applyPanelScale() {
      dashboard.scale.setScalar(vrTune.panelScale);
    }

    function applyLabelHeight() {
      const height = vrTune.labelHeight;
      sky.traverse((object) => {
        if (!object.userData || !object.userData.labelSprite || !object.material) return;
        const image = object.material.map && object.material.map.image;
        const aspect = image && image.height ? image.width / image.height : 4;
        const factor = Number(object.userData.labelScale) || 1;
        object.scale.set(height * factor * aspect, height * factor, 1);
      });
      if (!skyLabelText) return;
      const name = skyLabelText;
      skyLabelText = "";
      paintSkyLabel(name);
    }

    function enforceRoles() {
      if (controlRoles.dashboard !== "select" && controlRoles.dashboard !== "squeeze") {
        controlRoles.dashboard = controlDefaults.dashboard;
      }
      if (controlRoles.aimToggle !== "" && controlRoles.aimToggle !== "select" && controlRoles.aimToggle !== "squeeze") {
        controlRoles.aimToggle = "";
      }
      if (controlRoles.aimToggle === controlRoles.dashboard) controlRoles.aimToggle = "";
    }

    function bindControlRoles() {
      const session = renderer.xr.getSession();
      if (!session) return;
      unbindControlRoles(session);
      session.addEventListener(controlRoles.dashboard, onSelect);
      if (controlRoles.aimToggle) session.addEventListener(controlRoles.aimToggle, onAimToggle);
    }

    function unbindControlRoles(session) {
      if (!session) return;
      session.removeEventListener("select", onSelect);
      session.removeEventListener("squeeze", onSelect);
      session.removeEventListener("select", onAimToggle);
      session.removeEventListener("squeeze", onAimToggle);
    }

    function savePrefs() {
      const payload = {
        v: 1,
        tune: {
          labelHeight: vrTune.labelHeight,
          rayMeters: vrTune.rayMeters,
          telradHalfDeg: vrTune.telradHalfDeg.slice(),
          pickAcquireDeg: vrTune.pickAcquireDeg,
          pickHoldDeg: vrTune.pickHoldDeg,
          pickSwitchDeg: vrTune.pickSwitchDeg,
          panelScale: vrTune.panelScale,
        },
        roles: {
          dashboard: controlRoles.dashboard,
          aimToggle: controlRoles.aimToggle,
        },
      };
      try {
        localStorage.setItem(prefKey, JSON.stringify(payload));
      } catch (err) {
        /* Der Browser kann die Ablage verweigern. Die Werte gelten dann nur für diese Seite. */
      }
    }

    function loadPrefs() {
      let data = null;
      try {
        data = JSON.parse(localStorage.getItem(prefKey) || "null");
      } catch (err) {
        data = null;
      }
      if (!data || data.v !== 1 || typeof data !== "object") return;
      const tune = data.tune || {};
      vrTune.labelHeight = takeNumber(tune.labelHeight, 4, 12, vrDefaults.labelHeight);
      vrTune.rayMeters = takeNumber(tune.rayMeters, 0.5, 6, vrDefaults.rayMeters);
      vrTune.pickAcquireDeg = takeNumber(tune.pickAcquireDeg, 0.05, 1.5, vrDefaults.pickAcquireDeg);
      vrTune.pickHoldDeg = takeNumber(tune.pickHoldDeg, 0.1, 2, vrDefaults.pickHoldDeg);
      vrTune.pickSwitchDeg = takeNumber(tune.pickSwitchDeg, 0.02, 0.5, vrDefaults.pickSwitchDeg);
      vrTune.panelScale = takeNumber(tune.panelScale, 1, 2, vrDefaults.panelScale);
      if (vrTune.pickHoldDeg < vrTune.pickAcquireDeg) vrTune.pickHoldDeg = vrTune.pickAcquireDeg;
      if (Array.isArray(tune.telradHalfDeg) && tune.telradHalfDeg.length === 3) {
        vrTune.telradHalfDeg = [0, 1, 2].map((index) => takeNumber(
          tune.telradHalfDeg[index],
          0.1,
          5,
          vrDefaults.telradHalfDeg[index],
        ));
      }
      const roles = data.roles || {};
      if (roles.dashboard === "select" || roles.dashboard === "squeeze") controlRoles.dashboard = roles.dashboard;
      if (roles.aimToggle === "" || roles.aimToggle === "select" || roles.aimToggle === "squeeze") {
        controlRoles.aimToggle = roles.aimToggle;
      }
      enforceRoles();
      applyRayLength();
      rebuildTelrad();
      applyPanelScale();
    }

    function stepPref(pref, dir) {
      const specs = {
        acquire: [() => vrTune.pickAcquireDeg, (value) => { vrTune.pickAcquireDeg = value; }, 0.05, 1.5, 0.05],
        hold: [() => vrTune.pickHoldDeg, (value) => { vrTune.pickHoldDeg = value; }, 0.1, 2, 0.05],
        switch: [() => vrTune.pickSwitchDeg, (value) => { vrTune.pickSwitchDeg = value; }, 0.02, 0.5, 0.02],
        ray: [() => vrTune.rayMeters, (value) => { vrTune.rayMeters = value; applyRayLength(); }, 0.5, 6, 0.5],
        label: [() => vrTune.labelHeight, (value) => { vrTune.labelHeight = value; applyLabelHeight(); }, 4, 12, 1],
        panel: [() => vrTune.panelScale, (value) => { vrTune.panelScale = value; applyPanelScale(); }, 1, 2, 0.1],
        ring0: [() => vrTune.telradHalfDeg[0] * 2, (value) => { vrTune.telradHalfDeg[0] = value / 2; }, 0.2, 10, 0.1],
        ring1: [() => vrTune.telradHalfDeg[1] * 2, (value) => { vrTune.telradHalfDeg[1] = value / 2; }, 0.2, 10, 0.1],
        ring2: [() => vrTune.telradHalfDeg[2] * 2, (value) => { vrTune.telradHalfDeg[2] = value / 2; }, 0.2, 10, 0.1],
      };
      const spec = specs[pref];
      if (!spec) return;
      const [read, write, min, max, step] = spec;
      const next = roundTo(Math.min(max, Math.max(min, read() + dir * step)), step);
      if (next === roundTo(read(), step)) return;
      write(next);
      if (vrTune.pickHoldDeg < vrTune.pickAcquireDeg) {
        if (pref === "acquire") vrTune.pickHoldDeg = vrTune.pickAcquireDeg;
        else vrTune.pickAcquireDeg = vrTune.pickHoldDeg;
      }
      if (pref === "ring0" || pref === "ring1" || pref === "ring2") rebuildTelrad();
      savePrefs();
      refreshPrefLabels();
    }

    function cycleRole(pref) {
      if (pref === "dashboard") {
        controlRoles.dashboard = controlRoles.dashboard === "squeeze" ? "select" : "squeeze";
      } else if (pref === "aim") {
        const free = controlRoles.dashboard === "select" ? "squeeze" : "select";
        controlRoles.aimToggle = controlRoles.aimToggle === free ? "" : free;
      } else {
        return;
      }
      aimEnabled = true;
      enforceRoles();
      bindControlRoles();
      savePrefs();
      refreshPrefLabels();
    }

    function resetPrefs() {
      vrTune.labelHeight = vrDefaults.labelHeight;
      vrTune.rayMeters = vrDefaults.rayMeters;
      vrTune.telradHalfDeg = vrDefaults.telradHalfDeg.slice();
      vrTune.pickAcquireDeg = vrDefaults.pickAcquireDeg;
      vrTune.pickHoldDeg = vrDefaults.pickHoldDeg;
      vrTune.pickSwitchDeg = vrDefaults.pickSwitchDeg;
      vrTune.panelScale = vrDefaults.panelScale;
      controlRoles.dashboard = controlDefaults.dashboard;
      controlRoles.aimToggle = controlDefaults.aimToggle;
      aimEnabled = true;
      try {
        localStorage.removeItem(prefKey);
      } catch (err) {
        /* Bleibt der alte Eintrag stehen, setzt der nächste Wechsel ihn neu. */
      }
      applyRayLength();
      rebuildTelrad();
      applyLabelHeight();
      applyPanelScale();
      bindControlRoles();
      refreshPrefLabels();
    }

    function aimActive() {
      return !controlRoles.aimToggle || aimEnabled;
    }

    function onAimToggle() {
      aimEnabled = !aimEnabled;
      if (aimActive()) return;
      clearSkyCandidate();
      hideSkyAim();
      for (const pointer of pointers) pointer.line.visible = false;
    }

    function hideSkyAim() {
      telrad.visible = false;
      skyMark.visible = false;
    }

    function clearSkyCandidate() {
      skyKey = "";
      skyMark.visible = false;
    }

    function paintSkyLabel(name) {
      if (name === skyLabelText) return;
      skyLabelText = name;
      const previous = skyLabel.material.map;
      const texture = makeLabelTexture(name);
      skyLabel.material.map = texture;
      skyLabel.material.needsUpdate = true;
      if (previous) previous.dispose();
      const height = vrTune.labelHeight;
      skyLabel.scale.set(height * (texture.image.width / texture.image.height), height, 1);
      skyLabel.position.set(0, height * 0.55 + vrTune.markRadius, 0);
    }

    function skyHit(origin, direction) {
      const radius = vrTune.shellRadius;
      const b = origin.dot(direction);
      const disc = b * b - origin.lengthSq() + radius * radius;
      if (disc < 0) return null;
      const t = -b + Math.sqrt(disc);
      if (t <= 0) return null;
      skyPoint.copy(origin).addScaledVector(direction, t);
      return skyPoint;
    }

    function objectWorldDir(item, target) {
      target.copy(azAltToVec(Number(item.az), Number(item.alt), vrTune.shellRadius));
      sphere.localToWorld(target);
      if (target.lengthSq() < 1) return false;
      target.normalize();
      return true;
    }

    function angleDeg(a, b) {
      return THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1)));
    }

    function chooseCandidate(direction) {
      let best = null;
      let bestAng = Infinity;
      const pool = lastBodies.concat(lastStars.filter((star) => star && star.name));
      if (skyView.messier) {
        for (const item of lastDso) pool.push(item);
      }
      for (const item of pool) {
        if (!objectWorldDir(item, objDir)) continue;
        const angle = angleDeg(direction, objDir);
        if (angle < bestAng) {
          bestAng = angle;
          best = item;
        }
      }
      if (skyKey) {
        const held = findByKey(skyKey);
        let heldAng = Infinity;
        if (held && objectWorldDir(held, objDir)) heldAng = angleDeg(direction, objDir);
        if (held && heldAng <= vrTune.pickHoldDeg) {
          if (best && objectKey(best) !== skyKey && bestAng <= heldAng - vrTune.pickSwitchDeg) {
            return { item: best, key: objectKey(best) };
          }
          return { item: held, key: skyKey };
        }
      }
      if (best && bestAng <= vrTune.pickAcquireDeg) return { item: best, key: objectKey(best) };
      return null;
    }

    function updateSkyAim() {
      if (!aimActive()) {
        hideSkyAim();
        return;
      }
      const pointer = activeAim >= 0 ? pointers[activeAim] : null;
      if (!pointer || !pointer.ready || pointer.buttonHit) {
        hideSkyAim();
        if (!pointer || !pointer.ready) clearSkyCandidate();
        return;
      }
      const hit = skyHit(pointer.origin, pointer.direction);
      if (!hit) {
        hideSkyAim();
        clearSkyCandidate();
        return;
      }
      telrad.position.copy(hit);
      telrad.lookAt(0, 0, 0);
      telrad.visible = true;
      aimDir.copy(hit).normalize();
      const pick = chooseCandidate(aimDir);
      if (!pick) {
        clearSkyCandidate();
        return;
      }
      skyKey = pick.key;
      if (!objectWorldDir(pick.item, objDir)) {
        clearSkyCandidate();
        return;
      }
      objDir.multiplyScalar(vrTune.shellRadius);
      skyMark.position.copy(objDir);
      skyMark.lookAt(0, 0, 0);
      skyMark.visible = true;
      paintSkyLabel(pick.item.name || pick.item.id || "Objekt");
    }

    function updatePointers() {
      let nextHover = null;
      const live = new Set();
      let movedIndex = -1;
      let movedAmount = vrTune.aimMotion;
      if (!renderer.xr.isPresenting) {
        clearPointerHits();
        clearSkyCandidate();
        hideSkyAim();
        for (const pointer of pointers) pointer.line.visible = false;
        return;
      }
      if (dashboard.visible) dashboard.updateWorldMatrix(true, true);
      for (const pointer of pointers) {
        const index = pointers.indexOf(pointer);
        const source = pointer.source;
        const ready = Boolean(
          source && source.targetRayMode === "tracked-pointer" && pointer.space.visible
        );
        pointer.ready = ready;
        pointer.buttonHit = false;
        pointer.line.visible = ready && aimActive();
        if (!ready) {
          if (source) pointerHits.delete(source);
          continue;
        }
        live.add(source);
        pointer.space.updateWorldMatrix(true, false);
        pointer.origin.setFromMatrixPosition(pointer.space.matrixWorld);
        pointer.direction.set(0, 0, -1).transformDirection(pointer.space.matrixWorld);
        const rot = pointer.seenPose
          ? 2 * Math.acos(THREE.MathUtils.clamp(Math.abs(pointer.space.quaternion.dot(pointer.lastQuat)), 0, 1))
          : 0;
        const motion = pointer.seenPose
          ? pointer.origin.distanceTo(pointer.lastPos) + rot * vrTune.aimRotWeight
          : 0;
        pointer.seenPose = true;
        pointer.lastPos.copy(pointer.origin);
        pointer.lastQuat.copy(pointer.space.quaternion);
        if (motion > movedAmount) {
          movedAmount = motion;
          movedIndex = index;
        }
        if (!dashboard.visible) {
          pointerHits.delete(source);
          continue;
        }
        pointerRaycaster.set(pointer.origin, pointer.direction);
        const hits = pointerRaycaster.intersectObjects(pointerButtons, false);
        let button = null;
        for (const hit of hits) {
          const object = hit.object;
          if (object.visible && object.userData.action && object.parent === dashboard) {
            button = object;
            break;
          }
        }
        if (button) {
          pointer.buttonHit = true;
          pointerHits.set(source, button);
          nextHover = button;
        } else {
          pointerHits.delete(source);
        }
      }
      if (movedIndex >= 0) {
        if (movedIndex !== activeAim) skyKey = "";
        activeAim = movedIndex;
      } else if (activeAim < 0) {
        const first = pointers.findIndex((item) => item.ready);
        if (first >= 0) activeAim = first;
      }
      for (const source of pointerHits.keys()) {
        if (!live.has(source)) pointerHits.delete(source);
      }
      if (!dashboard.visible) {
        pointerHits.clear();
        nextHover = null;
      }
      setHoveredButton(nextHover);
      updateSkyAim();
    }

    function onSelect(event) {
      const now = performance.now();
      if (now - dashboardToggleAt < vrTune.selectGapMs) return;
      dashboardToggleAt = now;
      const source = event && event.inputSource;
      const hit = source && dashboard.visible ? pointerHits.get(source) : null;
      const sameHand = Boolean(
        hit && hit.visible && hit.parent === dashboard && hit.userData.action && dashboard.visible
      );
      if (source && !sameHand) pointerHits.delete(source);
      if (sameHand && hit.userData.action === "objects") {
        showObjectList();
        return;
      }
      if (sameHand && hit.userData.action === "himmel") {
        showHimmel();
        return;
      }
      if (sameHand && hit.userData.action === "back") {
        goBack();
        return;
      }
      if (sameHand && hit.userData.action === "object" && hit.userData.item) {
        showObjectDetail(hit.userData.item);
        return;
      }
      if (sameHand && hit.userData.action === "prefs") {
        showPrefs();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-page") {
        prefsPage = hit.userData.page;
        syncPanelButtons();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-step") {
        stepPref(hit.userData.pref, hit.userData.dir);
        return;
      }
      if (sameHand && hit.userData.action === "prefs-cycle") {
        cycleRole(hit.userData.pref);
        return;
      }
      if (sameHand && hit.userData.action === "prefs-reset") {
        resetPrefs();
        return;
      }
      if (sameHand && hit.userData.action === "prefs-done" || sameHand && hit.userData.action === "prefs-hold") {
        if (hit.userData.action === "prefs-done") closePrefs();
        return;
      }
      if (sameHand && hit.userData.action === "sky-toggle") {
        toggleSky(hit.userData.sky);
        return;
      }
      if (sameHand && hit.userData.action === "sky-mag") {
        stepSkyMag(hit.userData.dir);
        return;
      }
      if (sameHand && hit.userData.action === "sky-now") {
        freezeSkyNow();
        return;
      }
      if (sameHand && hit.userData.action === "sky-step") {
        stepSkyTime(hit.userData.seconds);
        return;
      }
      if (sameHand && hit.userData.action === "sky-hold") return;
      if (sameHand && hit.userData.action === "sky-icons") {
        toggleMessierIcons();
        return;
      }
      if (sameHand && hit.userData.action === "sky-seeing") {
        toggleMessierSeeing();
        return;
      }
      const aim = activeAim >= 0 ? pointers[activeAim] : null;
      const skyPick = aimActive() && aim && source === aim.source && !aim.buttonHit
        ? findByKey(skyKey) : null;
      if (skyPick) {
        if (!dashboard.visible) placeDashboard();
        showObjectDetail(skyPick);
        return;
      }
      if (dashboard.visible) {
        dashboard.visible = false;
        resetObjectPanel();
        clearPointerHits();
        return;
      }
      placeDashboard();
    }

    function placeDashboard() {
      const xrCamera = renderer.xr.getCamera();
      const headPos = new THREE.Vector3();
      const headQuat = new THREE.Quaternion();
      xrCamera.getWorldPosition(headPos);
      xrCamera.getWorldQuaternion(headQuat);
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(headQuat);
      const down = new THREE.Vector3(0, -1, 0).applyQuaternion(headQuat);
      dashboard.position.copy(headPos).addScaledVector(forward, 1.75).addScaledVector(down, 0.22);
      dashboard.lookAt(headPos);
      resetObjectPanel();
      dashboard.visible = true;
      dashboardPlaced = true;
      dashboardKey = "";
      refreshDashboard();
    }

    applyLook();
    refreshEnterButton();
    useAppPanorama().then((ok) => { if (ok) loadTexture(); });
    renderer.setAnimationLoop((_time, frame) => {
      if (!renderer.xr.isPresenting) {
        applyLook();
      } else if (!dashboardPlaced && frame) {
        const space = renderer.xr.getReferenceSpace();
        if (space && frame.getViewerPose(space)) placeDashboard();
      }
      if (renderer.xr.isPresenting) updatePointers();
      if (skyView.seeing) applyMessierSeeing(performance.now());
      refreshDashboard();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
