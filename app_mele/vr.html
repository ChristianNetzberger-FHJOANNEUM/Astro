<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeLE VR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #020617; color: #e2e8f0;
                 font-family: sans-serif; }
    #bar { position: absolute; z-index: 2; left: 0; right: 0; top: 0; display: flex; gap: 8px;
           align-items: center; flex-wrap: wrap; padding: 8px 12px; background: rgba(15,23,42,.88); }
    #bar button { color: #e2e8f0; background: #1f4e5f; border: 0; border-radius: 4px;
                  padding: 7px 10px; cursor: pointer; font-size: 13px; }
    #bar button:disabled { opacity: .45; cursor: not-allowed; }
    #status, #diag { flex: 1 1 220px; font-size: 12px; line-height: 1.35; }
    #diag { flex-basis: 100%; font-variant-numeric: tabular-nums; }
    #xr-overlay { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
                  display: flex; justify-content: center; padding: 0 16px 7vh;
                  pointer-events: none; }
    #kb-test { visibility: hidden; pointer-events: none; width: min(36rem, 100%);
               padding: 14px 16px; border-radius: 12px; background: rgba(15, 23, 42, .94);
               border: 2px solid #38bdf8; color: #e2e8f0; font-size: 22px; }
    #kb-test.open { visibility: visible; pointer-events: auto; }
    #kb-test p { margin: 8px 0; font-size: 18px; line-height: 1.35; }
    #kb-test label { display: flex; gap: 10px; align-items: center; }
    #kb-input { flex: 1; font-size: 22px; padding: 10px 12px; border-radius: 8px;
                border: 1px solid #7dd3fc; background: #020617; color: #f8fafc; }
    #kb-test .row { display: flex; gap: 10px; margin-top: 10px; }
    #kb-test button { font-size: 20px; padding: 10px 14px; border: 0; border-radius: 8px;
                      background: #1f4e5f; color: #e2e8f0; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="enter" type="button" disabled>Enter VR</button>
    <div id="status">Lade …</div>
    <div id="diag">protocol: … · isSecureContext: … · immersive-vr: …</div>
  </div>
  <div id="xr-overlay">
    <form id="kb-test">
      <p id="kb-head">Suche</p>
      <p id="kb-last"></p>
      <label>Objekt: <input id="kb-input" type="text" inputmode="text" enterkeyhint="done"
        autocomplete="off" spellcheck="false" placeholder="M13"></label>
      <div class="row">
        <button id="kb-ok" type="submit">Übernehmen</button>
        <button id="kb-again" type="button" hidden>Nochmal</button>
        <button id="kb-close" type="button">Schließen</button>
      </div>
      <p id="kb-taken"></p>
      <p id="kb-note"></p>
    </form>
  </div>
  <!-- Three.js 0.170.0 lokal unter /mele-static — kein CDN. -->
  <script type="module">
    import * as THREE from "/mele-static/three/three.module.js";

    const params = new URLSearchParams(location.search);
    let urls = {
      preview: params.get("preview") || "",
      png: params.get("png") || "",
      original: params.get("original") || "",
    };
    let tex = params.get("tex") || "preview";
    let imageUrl = urls[tex] || urls.preview || urls.png || "";
    const northParam = Number(params.get("north") || 0);
    const srcwParam = Number(params.get("srcw") || 0);
    let northOffset = srcwParam > 0 ? (360 * northParam / srcwParam) : 0;
    const debugDirections = params.get("debugDirections") === "1";
    let siteLat = params.get("lat") || "";
    let siteLon = params.get("lon") || "";
    let siteStem = params.get("stem") || "";
    const starLimit = "5.5";
    const skyView = {
      stars: true,
      constellations: true,
      messier: false,
      icons: false,
      seeing: false,
      ngcMode: "off",
      ngcMin: 1,
      mag: Number(starLimit),
      live: true,
      when: null,
    };
    const prefKey = "astro-vr-prefs-v1";
    const vrDefaults = {
      labelHeight: 7,
      shellRadius: 480,
      rayMeters: 2,
      selectGapMs: 400,
      telradHalfDeg: [0.25, 1, 2],
      telradColor: 0xef4444,
      markRadius: 1.8,
      markColor: 0xfde68a,
      pickAcquireDeg: 0.25,
      pickHoldDeg: 0.40,
      pickSwitchDeg: 0.08,
      aimMotion: 0.01,
      aimRotWeight: 0.2,
      panelScale: 1.5,
      panoBrightness: 100,
    };
    const controlDefaults = { dashboard: "select", aimToggle: "" };
    const vrTune = {
      labelHeight: vrDefaults.labelHeight,
      shellRadius: vrDefaults.shellRadius,
      rayMeters: vrDefaults.rayMeters,
      selectGapMs: vrDefaults.selectGapMs,
      telradHalfDeg: vrDefaults.telradHalfDeg.slice(),
      telradColor: vrDefaults.telradColor,
      markRadius: vrDefaults.markRadius,
      markColor: vrDefaults.markColor,
      pickAcquireDeg: vrDefaults.pickAcquireDeg,
      pickHoldDeg: vrDefaults.pickHoldDeg,
      pickSwitchDeg: vrDefaults.pickSwitchDeg,
      aimMotion: vrDefaults.aimMotion,
      aimRotWeight: vrDefaults.aimRotWeight,
      panelScale: vrDefaults.panelScale,
      panoBrightness: vrDefaults.panoBrightness,
    };
    const controlRoles = {
      dashboard: controlDefaults.dashboard,
      aimToggle: controlDefaults.aimToggle,
    };
    let aimEnabled = true;
    const labelTextures = new Map();
    let skyObjects = [];
    let skyTimer = 0;
    let skySerial = 0;
    let skyBusy = false;
    let skyDirty = false;
    let skyNote = "";
    let skyStars = 0;
    let skyNames = 0;
    let skyWhen = "";
    let skyLink = "warte";
    let skyFault = "";

    const statusEl = document.getElementById("status");
    const diagEl = document.getElementById("diag");
    const enterBtn = document.getElementById("enter");

    function setStatus(text) {
      statusEl.textContent = skyNote ? `${text} · ${skyNote}` : text;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 0);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local");
    renderer.xr.setFramebufferScaleFactor(1);
    document.body.appendChild(renderer.domElement);

    const sphere = new THREE.Group();
    const sky = new THREE.Group();
    // Dieselbe Innenansicht wie pano.html: scale(-1,1,1), kein zusätzliches BackSide.
    // Y-Drehung legt Azimut 0 (Nord) auf die Blickrichtung −Z, passend zu applyLook.
    function applyNorth(offset) {
      northOffset = offset;
      sphere.rotation.y = THREE.MathUtils.degToRad(northOffset + 90);
      placeDirectionMarks();
    }

    // Dieselbe Abbildung wie azAltToVec in pano.html. Lokal in der Gruppe,
    // damit die Gruppen-Drehung Marken und Foto gemeinsam schiebt.
    function azAltToVec(az, alt, radius) {
      const viewLon = ((az + northOffset) % 360 + 360) % 360;
      const phi = THREE.MathUtils.degToRad(90 - alt);
      const theta = THREE.MathUtils.degToRad(viewLon);
      return new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta) * radius,
        Math.cos(phi) * radius,
        Math.sin(phi) * Math.sin(theta) * radius,
      );
    }

    const directionMarks = [];

    function makeDirectionSprite(label, color) {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(64, 64, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#020617";
      ctx.font = "bold 72px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, 64, 70);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      }));
      sprite.scale.set(22, 22, 1);
      sprite.renderOrder = 2;
      return sprite;
    }

    function placeDirectionMarks() {
      if (!debugDirections) return;
      if (!directionMarks.length) {
        for (const [label, az, color] of [
          ["N", 0, "#f8fafc"],
          ["O", 90, "#fbbf24"],
          ["S", 180, "#38bdf8"],
          ["W", 270, "#fb7185"],
        ]) {
          const sprite = makeDirectionSprite(label, color);
          sprite.userData.az = az;
          sphere.add(sprite);
          directionMarks.push(sprite);
        }
      }
      for (const sprite of directionMarks) {
        sprite.position.copy(azAltToVec(sprite.userData.az, 20, 480));
      }
    }

    function starDisc(mag) {
      const m = Number.isFinite(mag) ? mag : 5;
      const size = Math.max(1.8, 12 * Math.pow(2.512, -0.28 * (m + 0.3)));
      const tone = THREE.MathUtils.clamp((7.2 - m) / 8.0, 0.22, 1);
      const gray = 0.32 + 0.68 * tone;
      return { size, gray };
    }

    function disposeSkyObject(object) {
      if (object.geometry) object.geometry.dispose();
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      for (const material of materials) {
        if (!material) continue;
        if (material.map && !material.userData.sharedMap) material.map.dispose();
        material.dispose();
      }
    }

    function makeStarPoints(stars) {
      if (!stars.length) return null;
      const positions = new Float32Array(stars.length * 3);
      const colors = new Float32Array(stars.length * 3);
      const sizes = new Float32Array(stars.length);
      stars.forEach((star, index) => {
        const vec = azAltToVec(Number(star.az), Number(star.alt), vrTune.shellRadius);
        const disc = starDisc(Number(star.mag));
        positions[index * 3] = vec.x;
        positions[index * 3 + 1] = vec.y;
        positions[index * 3 + 2] = vec.z;
        colors[index * 3] = disc.gray;
        colors[index * 3 + 1] = disc.gray;
        colors[index * 3 + 2] = disc.gray;
        sizes[index] = disc.size;
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      const points = new THREE.Points(geo, new THREE.ShaderMaterial({
        uniforms: { uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
        vertexShader: `
          attribute float aSize;
          attribute vec3 aColor;
          uniform float uPixelRatio;
          varying vec3 vColor;
          void main() {
            vColor = aColor;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = aSize * uPixelRatio;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main() {
            vec2 p = gl_PointCoord - vec2(0.5);
            float r = length(p);
            if (r > 0.5) discard;
            float edge = smoothstep(0.5, 0.22, r);
            gl_FragColor = vec4(vColor, edge);
          }
        `,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      }));
      points.renderOrder = 1;
      points.frustumCulled = false;
      return points;
    }

    function makeConstellationLines(lines) {
      const usable = lines.filter((line) => (
        Number.isFinite(Number(line.az1)) && Number.isFinite(Number(line.alt1))
        && Number.isFinite(Number(line.az2)) && Number.isFinite(Number(line.alt2))
      ));
      if (!usable.length) return null;
      const positions = new Float32Array(usable.length * 6);
      usable.forEach((line, index) => {
        const a = azAltToVec(Number(line.az1), Number(line.alt1), 478);
        const b = azAltToVec(Number(line.az2), Number(line.alt2), 478);
        positions.set([a.x, a.y, a.z, b.x, b.y, b.z], index * 6);
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const segments = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
        color: 0x7dd3fc,
        transparent: true,
        opacity: 0.85,
        depthTest: false,
        depthWrite: false,
      }));
      segments.renderOrder = 1;
      segments.frustumCulled = false;
      return segments;
    }

    function makeLabelTexture(name) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const font = "bold 42px sans-serif";
      ctx.font = font;
      const textWidth = Math.ceil(ctx.measureText(name).width);
      canvas.width = Math.max(64, textWidth + 28);
      canvas.height = 64;
      ctx.font = font;
      ctx.fillStyle = "rgba(2, 6, 23, 0.62)";
      ctx.fillRect(0, 8, canvas.width, 48);
      ctx.fillStyle = "#e0f2fe";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(name, canvas.width / 2, 34);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.userData.label = name;
      return texture;
    }

    function textureForLabel(iau, name) {
      const key = String(iau || name);
      const cached = labelTextures.get(key);
      if (cached && cached.userData.label === name) return cached;
      if (cached) {
        cached.dispose();
        labelTextures.delete(key);
      }
      const texture = makeLabelTexture(name);
      labelTextures.set(key, texture);
      return texture;
    }

    function makeLabelSprite(label) {
      const name = String(label.name || label.iau || "");
      const az = Number(label.az);
      const alt = Number(label.alt);
      if (!name || !Number.isFinite(az) || !Number.isFinite(alt)) return null;
      const texture = textureForLabel(label.iau || name, name);
      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      });
      material.userData.sharedMap = true;
      const sprite = new THREE.Sprite(material);
      const height = vrTune.labelHeight;
      sprite.scale.set(height * (texture.image.width / texture.image.height), height, 1);
      sprite.position.copy(azAltToVec(az, alt, 470));
      sprite.renderOrder = 2;
      sprite.frustumCulled = false;
      sprite.userData.labelSprite = true;
      return sprite;
    }

    const bodyColors = {
      Sonne: 0xfde68a,
      Mond: 0xe5e7eb,
      Merkur: 0xa8a29e,
      Venus: 0xfef3c7,
      Mars: 0xf87171,
      Jupiter: 0xfdba74,
      Saturn: 0xfbbf24,
      Uranus: 0x67e8f9,
      Neptun: 0x60a5fa,
    };

    function makeBodyMark(body) {
      if (!body || body.kind === "earth" || body.name === "Erde") return [];
      const az = Number(body.az);
      const alt = Number(body.alt);
      if (!Number.isFinite(az) || !Number.isFinite(alt)) return [];
      const kind = body.kind || "planet";
      const discRadius = kind === "sun" ? 3.2 : (kind === "moon" ? 3.0 : 1.8);
      const mesh = new THREE.Mesh(
        new THREE.CircleGeometry(discRadius, 32),
        new THREE.MeshBasicMaterial({
          color: bodyColors[body.name] || 0xe2e8f0,
          transparent: true,
          opacity: kind === "sun" ? 0.72 : 0.9,
          depthTest: false,
          depthWrite: false,
          side: THREE.DoubleSide,
        }),
      );
      mesh.position.copy(azAltToVec(az, alt, 476));
      mesh.renderOrder = 2;
      mesh.frustumCulled = false;
      mesh.userData.faceOrigin = true;
      const objects = [mesh];
      let caption = String(body.name || body.id || "");
      if (kind === "moon" && Number.isFinite(Number(body.phase))) {
        caption = `${caption} ${Math.round(Number(body.phase) * 100)}%`;
      }
      try {
        const sprite = makeLabelSprite({ iau: body.id || caption, name: caption, az, alt: alt + 1.6 });
        if (sprite) objects.push(sprite);
      } catch (_err) {
        // Das Schild darf die Scheibe nicht verhindern.
      }
      return objects;
    }

    function faceOrigin(object) {
      if (!object.userData.faceOrigin) return;
      if (Math.abs(object.position.y) > 0.95 * object.position.length()) object.up.set(1, 0, 0);
      object.lookAt(0, 0, 0);
    }

    function buildSky(stars, lines, labels, bodies, messierItems, ngcItems) {
      const objects = [];
      try {
        const points = makeStarPoints(stars);
        if (points) objects.push(points);
        const segments = makeConstellationLines(lines);
        if (segments) objects.push(segments);
        for (const label of labels) {
          try {
            const sprite = makeLabelSprite(label);
            if (sprite) objects.push(sprite);
          } catch (_err) {
            // Ein einzelnes Schild darf den Himmel nicht leeren.
          }
        }
        for (const body of bodies) {
          try {
            objects.push(...makeBodyMark(body));
          } catch (_err) {
            // Ein Gestirn darf den übrigen Himmel nicht leeren.
          }
        }
        try {
          objects.push(...makeDsoLayer(messierItems || [], "messier"));
          objects.push(...makeDsoLayer(ngcItems || [], "ngc"));
        } catch (_err) {
          // Eine Objektschicht darf den übrigen Himmel nicht leeren.
        }
        return objects;
      } catch (err) {
        for (const object of objects) disposeSkyObject(object);
        throw err;
      }
    }

    function messierKind(type) {
      const code = String(type || "").trim();
      if (!code) return 0;
      if (code === "G" || code === "GPair" || code === "GTrpl" || code === "GGroup") return 1;
      if (code === "GCl") return 2;
      if (code === "OCl" || code === "*Ass" || code === "Cl+N") return 3;
      if (code === "PN") return 4;
      if (code === "Neb" || code === "HII" || code === "EmN" || code === "RfN" || code === "DrkN" || code === "SNR") return 5;
      if (code === "*") return 7;
      if (code === "**") return 8;
      return 6;
    }

    const messierTints = [0xfbbf24, 0xbfdbfe, 0xfcd34d, 0xfef3c7, 0x5eead4, 0xf9a8d4, 0xe7e5e4];

    function makeDsoLayer(items, layer) {
      const ngc = layer === "ngc";
      const usable = items.filter((item) => {
        if (!Number.isFinite(Number(item.az)) || !Number.isFinite(Number(item.alt))) return false;
        if (ngc && /^M\d+$/.test(String(item.id || ""))) return false;
        return true;
      });
      if (!usable.length) return [];
      const positions = new Float32Array(usable.length * 3);
      const colors = new Float32Array(usable.length * 3);
      const sizes = new Float32Array(usable.length);
      const shapes = new Float32Array(usable.length);
      const seeds = new Float32Array(usable.length);
      const tint = new THREE.Color();
      usable.forEach((item, index) => {
        const vec = azAltToVec(Number(item.az), Number(item.alt), vrTune.shellRadius);
        const kind = messierKind(item.type);
        const shape = skyView.icons ? kind : 0;
        tint.setHex(shape === 0 ? 0xfbbf24 : (messierTints[kind] || 0xe7e5e4));
        positions[index * 3] = vec.x;
        positions[index * 3 + 1] = vec.y;
        positions[index * 3 + 2] = vec.z;
        colors[index * 3] = tint.r;
        colors[index * 3 + 1] = tint.g;
        colors[index * 3 + 2] = tint.b;
        sizes[index] = shape === 0 ? 12 : shape >= 7 ? 30 : 18;
        shapes[index] = shape;
        seeds[index] = (index % 17) / 17;
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
      geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute("aShape", new THREE.BufferAttribute(shapes, 1));
      geo.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 1));
      const points = new THREE.Points(geo, new THREE.ShaderMaterial({
        uniforms: {
          uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
          uTime: { value: 0 },
          uSeeing: { value: skyView.seeing ? 1 : 0 },
        },
        vertexShader: `
          attribute float aSize;
          attribute vec3 aColor;
          attribute float aShape;
          attribute float aSeed;
          uniform float uPixelRatio;
          varying vec3 vColor;
          varying float vShape;
          varying float vSeed;
          void main() {
            vColor = aColor;
            vShape = aShape;
            vSeed = aSeed;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = aSize * uPixelRatio;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vShape;
          varying float vSeed;
          uniform float uTime;
          uniform float uSeeing;
          void main() {
            vec2 uv = gl_PointCoord;
            float wobble = 0.0;
            if (uSeeing > 0.5) {
              wobble = sin(uTime * 2.8 + vSeed * 6.28318);
              uv += vec2(wobble, sin(uTime * 1.9 + vSeed * 11.2)) * 0.045;
            }
            vec2 p = (uv - vec2(0.5)) * (1.0 + 0.18 * max(wobble, 0.0));
            float alpha = 0.0;
            vec3 tint = vColor;
            if (vShape < 0.5) {
              float r = length(p);
              if (r > 0.5) discard;
              alpha = smoothstep(0.5, 0.22, r);
            } else if (vShape < 1.5) {
              vec2 g = p / 0.7;
              float r = length(vec2(g.x * 0.76, g.y));
              if (r > 0.5) discard;
              alpha = smoothstep(0.5, 0.18, r);
            } else if (vShape < 2.5) {
              float r = length(p);
              if (r > 0.48) discard;
              alpha = max(smoothstep(0.48, 0.16, r) * 0.55, smoothstep(0.2, 0.0, r));
            } else if (vShape < 3.5) {
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.30, 0.34))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.70, 0.30))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.50, 0.56))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.26, 0.70))));
              alpha = max(alpha, smoothstep(0.16, 0.05, length(uv - vec2(0.74, 0.72))));
              if (alpha < 0.04) discard;
            } else if (vShape < 4.5) {
              float r = length(p);
              alpha = smoothstep(0.16, 0.28, r) * smoothstep(0.48, 0.34, r);
              if (alpha < 0.04) discard;
            } else if (vShape < 5.5) {
              float blob = smoothstep(0.50, 0.02, length(p));
              float puff = smoothstep(0.28, 0.0, length(p - vec2(0.10, -0.08)));
              alpha = max(blob * 0.72, puff * 0.45);
              if (alpha < 0.05) discard;
            } else if (vShape < 6.5) {
              float m = abs(p.x) + abs(p.y);
              if (m > 0.46) discard;
              alpha = smoothstep(0.46, 0.22, m);
            } else if (vShape < 7.5) {
              float disc = smoothstep(0.18, 0.05, length(p));
              float spikeH = smoothstep(0.05, 0.01, abs(p.y)) * smoothstep(0.5, 0.14, abs(p.x));
              float spikeV = smoothstep(0.05, 0.01, abs(p.x)) * smoothstep(0.5, 0.14, abs(p.y));
              float spikes = max(spikeH, spikeV);
              alpha = max(disc, spikes);
              if (alpha < 0.04) discard;
              tint = mix(vec3(0.45, 0.78, 1.0), vec3(0.86, 0.95, 1.0), spikes);
            } else {
              vec2 left = p - vec2(-0.16, 0.0);
              vec2 right = p - vec2(0.16, 0.02);
              float yellowStar = smoothstep(0.16, 0.035, length(left));
              float redStar = smoothstep(0.145, 0.03, length(right));
              alpha = max(yellowStar, redStar);
              if (alpha < 0.04) discard;
              tint = (yellowStar * vec3(1.0, 0.84, 0.2) + redStar * vec3(0.96, 0.24, 0.18))
                / max(yellowStar + redStar, 0.001);
            }
            float gleam = uSeeing > 0.5 ? (0.62 + 0.38 * (0.5 + 0.5 * wobble)) : 1.0;
            gl_FragColor = vec4(tint, alpha * gleam);
          }
        `,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      }));
      points.renderOrder = 2;
      points.frustumCulled = false;
      points.userData.messier = !ngc;
      points.userData.ngc = ngc;
      points.userData.dsoPoints = true;
      const objects = [points];
      const showLabels = !ngc || skyView.ngcMode === "mine";
      if (!showLabels) return objects;
      for (const item of usable) {
        const caption = String(item.id || "").trim();
        const az = Number(item.az);
        const alt = Number(item.alt);
        if (!caption) continue;
        try {
          const sprite = makeLabelSprite({ iau: ngc ? caption : `M:${caption}`, name: caption, az, alt: alt + 1.2 });
          if (!sprite) continue;
          sprite.userData.labelScale = 0.72;
          sprite.userData.messier = !ngc;
          sprite.userData.ngc = ngc;
          const height = vrTune.labelHeight * sprite.userData.labelScale;
          const aspect = sprite.scale.y ? sprite.scale.x / sprite.scale.y : 2;
          sprite.scale.set(height * aspect, height, 1);
          objects.push(sprite);
        } catch (_err) {
          // Ein Schild darf die übrigen Messier-Punkte nicht verhindern.
        }
      }
      return objects;
    }

    function showSky(stars, lines, labels, bodies, messierItems, ngcItems) {
      const next = buildSky(stars, lines, labels, bodies, messierItems || [], ngcItems || []);
      try {
        for (const object of next) sky.add(object);
        for (const object of next) faceOrigin(object);
      } catch (err) {
        for (const object of next) sky.remove(object);
        for (const object of next) disposeSkyObject(object);
        throw err;
      }
      const previous = skyObjects;
      skyObjects = next;
      for (const object of previous) {
        sky.remove(object);
        disposeSkyObject(object);
      }
    }

    function hideMarked(flag) {
      const kept = [];
      for (const object of skyObjects) {
        if (!object.userData[flag]) {
          kept.push(object);
          continue;
        }
        sky.remove(object);
        disposeSkyObject(object);
      }
      skyObjects = kept;
    }

      hideMarked("messier");

        if (skyView.messier) layer.push(...makeDsoLayer(lastDso, "messier"));
        if (skyView.ngcMode !== "off") layer.push(...makeDsoLayer(lastNgc, "ngc"));
        for (const object of layer) sky.add(object);
        for (const object of layer) faceOrigin(object);
        skyObjects.push(...layer);
      } catch (err) {

          disposeSkyObject(object);
        }
      }

    async function runSky(serial) {
      if (document.hidden || !textureReady) return;
      if (!siteLat || !siteLon) {
        skyNote = "Sterne: Standort fehlt";

        return;
      }
      skyBusy = true;
      const mag = skyView.mag;
      const liveAtStart = skyView.live;
      const whenAtStart = skyView.when ? skyView.when.getTime() : 0;
      const modeAtStart = skyView.ngcMode;
      const minAtStart = skyView.ngcMin;
      const query = new URLSearchParams({
        lat: siteLat,
        lon: siteLon,
        stars: skyView.stars ? "1" : "0",
        const: skyView.constellations ? "1" : "0",
        messier: skyView.messier ? "1" : "0",
        ngc: "0",
        ngc_mode: skyView.ngcMode,
        planets: "1",
        mag: String(mag),
      });
      if (skyView.ngcMode === "mine") query.set("ngc_min", String(skyView.ngcMin));
      if (!skyView.live && skyView.when) query.set("when", skyView.when.toISOString());
      if (siteStem) query.set("stem", siteStem);
      try {
        const response = await fetch(`/sky-overlay?${query}`, { cache: "no-store" });
        const raw = await response.text();
        const data = JSON.parse(raw);
        if (serial !== skySerial) return;
        if (liveAtStart !== skyView.live) return;
        if ((skyView.when ? skyView.when.getTime() : 0) !== whenAtStart) return;
        if (skyView.ngcMode !== modeAtStart || skyView.ngcMin !== minAtStart) return;
        if (!response.ok || data.error) {
          skyLink = "Fehler";
          skyFault = String(data.error || response.status);
          skyNote = `Himmel: ${skyFault}`;
          setStatus(northLabel());
          return;
        }
        const stars = skyView.stars ? (data.stars || []) : [];
        const lines = skyView.constellations ? (data.lines || []) : [];
        const labels = skyView.constellations ? (data.labels || []) : [];
        const bodies = data.bodies || [];
        const allDso = data.dso || [];
        const messierItems = skyView.messier
          ? allDso.filter((item) => item && item.kind === "messier")
          : [];
        const ngcItems = skyView.ngcMode === "off"
          ? []
          : allDso.filter((item) => item && item.kind === "ngc" && !/^M\d+$/.test(String(item.id || "")));
        showSky(stars, lines, labels, bodies, messierItems, ngcItems);
        lastBodies = bodies;
        lastStars = stars;
        lastDso = messierItems;
        lastNgc = ngcItems;
        skyBytes = raw.length;
        if (skyKey && !findByKey(skyKey)) {
          skyKey = "";
          skyMark.visible = false;

        refreshObjectPanel();
        syncNavTarget();
        skyStars = stars.length;
        skyNames = labels.length;
        skyWhen = String(data.when || "");
        if (trackData && trackItemKey) ensureDayTrack();
        skyLink = "verbunden";
        skyFault = "";
        const picksNote = data.picks_error ? ` · ${data.picks_error}` : "";
        skyNote = `${stars.length} Sterne bis mag ${mag} · ${lines.length} Linien · ${labels.length} Namen · ${messierItems.length} Messier · ${ngcItems.length} NGC · ${Math.round(raw.length / 1024)} kB · ${bodies.length} Gestirne${picksNote}`;
        setStatus(northLabel());
        if (panelMode === "himmel") paintHimmelButtons();
      } catch (err) {
        if (serial !== skySerial) return;
        const message = err && err.message ? err.message : String(err);
        skyLink = "Fehler";
        skyFault = message;
        skyNote = `Himmel nicht geladen: ${message}`;
        setStatus(northLabel());
      } finally {
        skyBusy = false;
        if (skyDirty) {
          skyDirty = false;
          if (!document.hidden && textureReady) runSky(skySerial);
        }
      }
    }

    let fov = 75;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let textureReady = false;

    function applyLook() {
      lat = Math.max(-85, Math.min(85, lat));
      camera.rotation.y = THREE.MathUtils.degToRad(lon);
      camera.rotation.x = THREE.MathUtils.degToRad(lat);
      camera.rotation.z = 0;
    }

    function northLabel() {
      const offset = srcwParam > 0 || northOffset
        ? `Nord-Offset ${northOffset.toFixed(1)}°`
        : "Kein srcw — Nord-Offset 0°";
      const kind = tex === "png" ? "Transparentes PNG" : (tex === "original" ? "Original" : "Vorschau");
      const stars = tex === "png" ? " · Sterne nur in der 360-Ansicht" : "";
      const debug = debugDirections ? " · Himmelsmarken N O S W" : "";
      return `${kind}${stars}${debug} · ${offset}`;
    }

    function showDiag(xrText) {
      diagEl.textContent =
        `protocol: ${location.protocol} (${location.origin})`
        + ` · isSecureContext: ${window.isSecureContext}`
        + ` · immersive-vr: ${xrText}`;
    }

    function refreshEnterButton() {
      const secure = window.isSecureContext;
      const xr = navigator.xr;
      if (!xr) {
        showDiag("nein (navigator.xr fehlt)");
        enterBtn.disabled = true;
        if (textureReady) {
          setStatus(`${northLabel()} · Ziehen: umsehen. Dieser Browser hat kein WebXR.`);
        }
        return;
      }
      xr.isSessionSupported("immersive-vr").then((ok) => {
        showDiag(ok ? "ja" : "nein");
        enterBtn.disabled = !(textureReady && secure && ok);
        if (!textureReady) return;
        if (!secure) {
          setStatus(
            `${northLabel()} · Ziehen: umsehen. isSecureContext ist false. `
            + "Das Chrome-Flag hat diesen Origin nicht als sicher gewertet. "
            + `Eingetragen sein muss exakt ${location.origin}`
          );
          return;
        }
        setStatus(ok
          ? `${northLabel()} · Ziehen: umsehen, oder Enter VR. Ein Foto hat keine Tiefenparallaxe.`
          : `${northLabel()} · Ziehen: umsehen. immersive-vr wird hier nicht unterstützt.`);
      }).catch((err) => {
        const message = err && err.message ? err.message : String(err);
        showDiag(`Fehler: ${message}`);
        enterBtn.disabled = true;
        if (textureReady) {
          setStatus(`${northLabel()} · WebXR-Abfrage fehlgeschlagen: ${message}`);
        }
      });
    }

    const canvas = renderer.domElement;
    canvas.addEventListener("pointerdown", (event) => {
      if (renderer.xr.isPresenting) return;
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      try { canvas.setPointerCapture(event.pointerId); } catch { /* bereits beendet */ }
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragging || renderer.xr.isPresenting) return;
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      lon += dx * 0.12 * (fov / 75);
      lat -= dy * 0.12 * (fov / 75);
      lastX = event.clientX;
      lastY = event.clientY;
      applyLook();
    });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointercancel", () => { dragging = false; });
    canvas.addEventListener("wheel", (event) => {
      if (renderer.xr.isPresenting) return;
      event.preventDefault();
      fov = THREE.MathUtils.clamp(fov + Math.sign(event.deltaY) * 4, 18, 100);
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }, { passive: false });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function readOverlayState(session) {
      const state = session && session.domOverlayState;
      const type = state && typeof state.type === "string" ? state.type : "";
      overlayStateText = type ? `DOM-Overlay: ${type}` : "DOM-Overlay: nicht aktiv";
    }

    async function requestImmersiveSession() {
      const root = document.getElementById("xr-overlay");
      try {
        const session = await navigator.xr.requestSession("immersive-vr", {
          optionalFeatures: ["local", "dom-overlay"],
          domOverlay: { root },
        });
        readOverlayState(session);
        return session;
      } catch (err) {
        const message = err && err.message ? err.message : String(err);
        const session = await navigator.xr.requestSession("immersive-vr", {
          optionalFeatures: ["local"],
        });
        readOverlayState(session);
        if (!session.domOverlayState || !session.domOverlayState.type) {
          overlayStateText = `DOM-Overlay abgelehnt (${message}). Sitzung ohne Overlay.`;
        }
        return session;
      }
    }

    function paintKeyboardPanel(extra) {
      const head = document.getElementById("kb-head");
      const note = document.getElementById("kb-note");
      if (head) head.textContent = "Suche";
      if (note) note.textContent = extra || "";
    }

    function showStoredQuery() {
      const last = document.getElementById("kb-last");
      const again = document.getElementById("kb-again");
      if (last) last.textContent = searchQuery ? `Zuletzt: ${searchQuery}` : "";
      if (again) {
        again.hidden = !searchQuery;
        again.textContent = searchQuery ? `${searchQuery} suchen` : "Nochmal";
      }
    }

    function openKeyboardTest() {
      const box = document.getElementById("kb-test");
      const input = document.getElementById("kb-input");
      if (!box || !input) return;
      box.classList.add("open");
      showStoredQuery();
      input.value = "";
      input.focus({ preventScroll: true });
      const focused = document.activeElement === input;
      const live = renderer.xr.isPresenting ? "XR-Sitzung aktiv." : "XR-Sitzung nicht aktiv.";
      paintKeyboardPanel(focused
        ? `${live} Feld hat den Fokus.`
        : `${live} Fokus nicht gesetzt. Das Feld antippen, falls es sichtbar ist.`);
    }

    function closeKeyboardTest() {
      const box = document.getElementById("kb-test");
      const input = document.getElementById("kb-input");
      if (box) box.classList.remove("open");
      if (input) input.blur();
    }

    function bindKeyboardTest() {
      const form = document.getElementById("kb-test");
      const input = document.getElementById("kb-input");
      const close = document.getElementById("kb-close");
      const ok = document.getElementById("kb-ok");
      const again = document.getElementById("kb-again");
      if (!form || !input || !close || !ok || !again || form.dataset.bound) return;
      form.dataset.bound = "1";
      let committing = false;
      let cancelSearch = false;
      const commitSearch = () => {
        if (committing || cancelSearch) return;
        committing = true;
        const text = input.value.trim();
        if (text) searchQuery = text;
        closeKeyboardTest();
        committing = false;
        runCatalogSearch(text || searchQuery);
      };
      const repeatSearch = () => {
        if (committing || !searchQuery) return;
        closeKeyboardTest();
        runCatalogSearch(searchQuery);
      };
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        commitSearch();
      });
      ok.addEventListener("click", (event) => {
        event.preventDefault();
        commitSearch();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        commitSearch();
      });
      again.addEventListener("click", (event) => {
        event.preventDefault();
        repeatSearch();
      });
      input.addEventListener("change", () => {
        if (committing || cancelSearch || !form.classList.contains("open")) return;
        if (!input.value.trim()) return;
        commitSearch();
      });
      close.addEventListener("pointerdown", () => { cancelSearch = true; });
      close.addEventListener("click", () => {
        closeKeyboardTest();
        cancelSearch = false;
      });
    }

    bindKeyboardTest();

    enterBtn.addEventListener("click", async () => {
      if (!navigator.xr || !window.isSecureContext) return;
      if (renderer.xr.isPresenting) {
        const session = renderer.xr.getSession();
        if (session) await session.end();
        return;
      }
      try {
        const session = await requestImmersiveSession();
        await renderer.xr.setSession(session);
        enterBtn.textContent = "VR beenden";
        setStatus(`${northLabel()} · ${overlayStateText}`);
        dashboardKey = "";
        bindControlRoles();
        session.addEventListener("end", () => {
          unbindControlRoles(session);
          closeKeyboardTest();
          dashboard.visible = false;
          dashboardPlaced = false;
          dashboardKey = "";
          dashboardToggleAt = 0;
          dragSource = null;
          dragArm = null;
          clearPointerHits();
          clearSkyCandidate();
          hideSkyAim();
          hideNavCue();
          greenTelrad.visible = false;
          activeAim = -1;
          aimEnabled = true;
          for (const pointer of pointers) pointer.line.visible = false;
          enterBtn.textContent = "Enter VR";
          applyLook();
          refreshEnterButton();
        });
      } catch (err) {
        setStatus(`VR-Start abgelehnt: ${err && err.message ? err.message : err}`);
      }
    });

    async function useAppPanorama() {
      if (imageUrl) return true;
      setStatus("Lade das in der MeLE-App gewählte Panorama …");
      try {
        const response = await fetch("/vr/current", { cache: "no-store" });
        if (!response.ok) {
          setStatus("In der MeLE-App ist kein Panorama gewählt.");
          return false;
        }
        const data = await response.json();
        rememberSite(data);
        urls = {
          preview: data.preview || "",
          png: data.png || "",
          original: data.original || "",
        };
        tex = data.tex || "preview";
        imageUrl = urls[tex] || urls.preview || urls.png || "";
        const srcw = Number(data.srcw || 0);
        const north = Number(data.north || 0);
        applyNorth(srcw > 0 ? (360 * north / srcw) : 0);
      } catch {
        setStatus("Panorama der MeLE-App nicht erreichbar.");
        return false;
      }
      if (!imageUrl) {
        setStatus("In der MeLE-App ist kein Panorama gewählt.");
        return false;
      }
      return true;
    }

    function loadTexture() {
      if (!imageUrl) {
        setStatus("In der MeLE-App ist kein Panorama gewählt.");
        return;
      }
      setStatus("Lade Panorama …");
      const loader = new THREE.TextureLoader();
      loader.load(
        imageUrl,
        (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.minFilter = THREE.LinearFilter;
          texture.generateMipmaps = false;
          material.map = texture;
          material.needsUpdate = true;
          textureReady = true;
          const kind = tex === "png" ? "Transparentes PNG" : (tex === "original" ? "Original" : "Vorschau");
          setStatus(`${kind} · ${northLabel()} · lade Ansicht …`);
          refreshEnterButton();
          startSky();
        },
        undefined,
        () => {
          textureReady = false;
          enterBtn.disabled = true;
          setStatus(`Panorama konnte nicht geladen werden: ${imageUrl}`);
        },
      );
    }

    function formatCoord(value, positive, negative) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "fehlt";
      const hemisphere = number >= 0 ? positive : negative;
      return `${Math.abs(number).toFixed(5)}° ${hemisphere}`;
    }

    function formatWhen(value) {
      if (!value) return "noch keins";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 19);
      return date.toISOString().slice(0, 19).replace("T", " ") + " UTC";
    }

    function dashboardSections() {
      const utc = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
      const when = formatWhen(skyWhen);
      const system = skyFault
        ? ["Overlay Fehler", skyFault.slice(0, 42)]
        : ["Overlay " + skyLink, "Abruf " + when];
      return [
        { title: "Zeit", lines: [utc, skyView.live ? "Live" : "Fest"] },
        { title: "Standort", lines: [formatCoord(siteLat, "N", "S"), formatCoord(siteLon, "E", "W")] },
        { title: "Himmel", lines: [`${skyStars} Sterne`, `${skyNames} Sternbilder`, "Overlay " + when] },
        { title: "System", lines: system },
      ];
    }

    function fmtRa(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      const hours = (((value % 360) + 360) % 360) / 15;
      const h = Math.floor(hours);
      const minutes = (hours - h) * 60;
      const m = Math.floor(minutes);
      const s = (minutes - m) * 60;
      return `${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${s.toFixed(2)}s`;
    }

    function fmtDec(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      const sign = value >= 0 ? "+" : "-";
      const abs = Math.abs(value);
      const d = Math.floor(abs);
      const minutes = (abs - d) * 60;
      const m = Math.floor(minutes);
      const s = (minutes - m) * 60;
      return `${sign}${String(d).padStart(2, "0")}° ${String(m).padStart(2, "0")}' ${s.toFixed(1)}"`;
    }

    function fmtDeg(deg) {
      const value = Number(deg);
      if (!Number.isFinite(value)) return "—";
      return `${value >= 0 ? "+" : ""}${value.toFixed(1)}°`;
    }

    function objectKey(item) {
      if (!item) return "";
      const kind = item.kind || (item.hip ? "star" : "object");
      if (item.hip) return `${kind}:hip:${item.hip}`;
      if (item.id) return `${kind}:id:${item.id}`;
      return `${kind}:name:${item.name || ""}`;
    }

    function objectChoices() {
      const named = lastStars.filter((star) => star && star.name).slice().sort((a, b) => {
        const mag = Number(a.mag) - Number(b.mag);
        if (mag) return mag;
        return String(a.name).localeCompare(String(b.name), "de");
      });
      return lastBodies.concat(named).slice(0, 6);
    }

    function findByKey(key) {
      if (!key) return null;
      for (const body of lastBodies) if (objectKey(body) === key) return body;
      for (const star of lastStars) if (objectKey(star) === key) return star;
      if (skyView.messier) {
        for (const item of lastDso) if (objectKey(item) === key) return item;
      }
      if (skyView.ngcMode !== "off") {
        for (const item of lastNgc) if (objectKey(item) === key) return item;
      }
      return null;
    }

    function kindLabel(item) {
      if (item.kind === "sun") return "Sonne";
      if (item.kind === "moon") return "Mond";
      if (item.kind === "planet") return "Planet";
      if (item.kind === "messier") return "Messier";
      if (item.kind === "ngc") return String(item.id || "").startsWith("IC") ? "IC" : "NGC";
      if (item.kind === "star" || item.hip) return "Stern";
      return item.kind || "Objekt";
    }

    function dsoTypeLabel(code) {
      const names = {
        "*": "Stern",
        "**": "Doppelstern",
        "*Ass": "Sterngruppe",
        OCl: "Offener Sternhaufen",
        GCl: "Kugelsternhaufen",
        "Cl+N": "Haufen mit Nebel",
        G: "Galaxie",
        PN: "Planetarischer Nebel",
        Neb: "Nebel",
        HII: "H-II-Gebiet",
        SNR: "Supernovaüberrest",
      };
      const text = String(code || "").trim();
      if (!text) return "";
      return names[text] || text;
    }

    function detailLines(item, missing) {
      const lines = [
        item.name || item.id || "Objekt",
        kindLabel(item),
      ];
      if (item.type) {
        const type = dsoTypeLabel(item.type);
        if (type) lines.push(type);
      }
      lines.push(
        `RA ${fmtRa(item.ra)}`,
        `Dec ${fmtDec(item.dec)}`,
        `Az ${fmtDeg(item.az)}`,
        `Höhe ${fmtDeg(item.alt)}`,
      );
      if (item.mag != null && Number.isFinite(Number(item.mag))) {
        const band = item.mag_band ? ` ${item.mag_band}` : "";
        lines.push(`${Number(item.mag).toFixed(2)} mag${band}`);
      }
      if (item.phase != null && Number.isFinite(Number(item.phase))) {
        lines.push(`Phase ${Math.round(Number(item.phase) * 100)}%`);
      }
      if (item.above === false || (item.fromSearch && Number(item.alt) <= 0)) lines.push("unter Horizont");
      if (detailNote) lines.push(detailNote);
      if (missing) lines.push("nicht mehr in der Liste");
      return lines;
    }

    function hideObjectRows() {
      for (const row of objectRows) {
        row.visible = false;
        row.userData.item = null;
      }
    }

    function updateObjectRows() {
      const choices = objectChoices();
      objectRows.forEach((row, index) => {
        const item = choices[index];
        if (!item) {
          row.visible = false;
          row.userData.item = null;
          row.userData.key = "";
          return;
        }
        const key = objectKey(item);
        const label = item.name || item.id || "Objekt";
        row.visible = true;
        row.userData.action = "object";
        row.userData.item = item;
        if (row.userData.key === key && row.userData.label === label) return;
        row.userData.key = key;
        row.userData.label = label;
        paintTextButton(row, label);
      });
    }

    function showHome() {
      panelMode = "home";
      panelReturn = "home";
      selectedItem = null;
      selectedKey = "";
      selectedMissing = false;
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showHimmel() {
      panelMode = "himmel";
      panelReturn = "home";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function showObjectList() {
      panelMode = "list";
      panelReturn = "home";
      selectedItem = null;
      selectedKey = "";
      selectedMissing = false;
      syncPanelButtons();
      updateObjectRows();
      dashboardKey = "";
      paintDashboard();
    }

    function showObjectDetail(item) {
      if (trackItemKey && trackItemKey !== objectKey(item)) clearDayTrack();
      if (panelMode !== "detail") {
        panelReturn = panelMode === "list" || panelMode === "himmel" || panelMode === "prefs"
          ? panelMode
          : "home";
      }
      panelMode = "detail";
      if (!item.fromSearch) detailNote = "";
      selectedItem = item;
      selectedKey = objectKey(item);
      selectedMissing = false;
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function catalogQueryOf(item) {
      if (!item) return "";
      if (item.kind === "planet" || item.kind === "sun" || item.kind === "moon") {
        return String(item.name || item.id || "").trim();
      }
      return String(item.key || item.id || item.name || "").trim();
    }

    function searchHitLabel(hit) {
      const name = String(hit.name || "").trim();
      if (hit.kind === "planet") return `${name || "Planet"} · Planet`;
      if (hit.kind === "sun") return `${name || "Sonne"} · Sonne`;
      if (hit.kind === "moon") return `${name || "Mond"} · Mond`;
      const key = String(hit.key || hit.id || "").trim();
      if (key && name && name !== key) return `${key} · ${name}`;
      return name || key || "Objekt";
    }

    function updateSearchRows() {
      if (!searchHits.length) {
        objectRows.forEach((row, index) => {
          if (index !== 0 || !searchNote) {
            row.visible = false;
            row.userData.item = null;
            row.userData.action = "object";
            return;
          }
          row.visible = true;
          row.userData.action = "";
          row.userData.item = null;
          row.userData.key = "";
          paintTextButton(row, searchNote);
        });
        return;
      }
      const pageHits = searchHits.slice(searchPage * 6, searchPage * 6 + 6);
      objectRows.forEach((row, index) => {
        const hit = pageHits[index];
        if (!hit) {
          row.visible = false;
          row.userData.item = null;
          row.userData.key = "";
          return;
        }
        const label = searchHitLabel(hit);
        row.visible = true;
        row.userData.action = "search-hit";
        row.userData.item = hit;
        row.userData.key = hit.key || hit.id || label;
        row.userData.label = label;
        paintTextButton(row, label);
      });
    }

    function showSearchResults() {
      panelMode = "search";
      panelReturn = "list";
      syncPanelButtons();
      updateSearchRows();
      dashboardKey = "";
      paintDashboard();
    }

    function stepSearchPage(dir) {
      const pages = Math.max(1, Math.ceil(searchHits.length / 6));
      const next = Math.min(pages - 1, Math.max(0, searchPage + dir));
      if (next === searchPage) return;
      searchPage = next;
      updateSearchRows();
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function skyWhenParam() {
      if (skyView.live || !skyView.when) return "";
      return skyView.when.toISOString();
    }

    function catalogResolveParams(query) {
      const params = new URLSearchParams({
        q: String(query || "").trim(),
        lat: String(siteLat),
        lon: String(siteLon),
      });
      const when = skyWhenParam();
      if (when) params.set("when", when);
      if (siteStem) params.set("stem", siteStem);
      return params;
    }

    async function runCatalogSearch(query) {
      const serial = ++searchSerial;
      const q = String(query || "").trim();
      searchQuery = q;
      searchPage = 0;
      searchHits = [];
      searchBusyNote(q ? `Suche ${q} …` : "Suchbegriff fehlt");
      if (!q) return;
      try {
        const response = await fetch(`/catalog/search?q=${encodeURIComponent(q)}&limit=48`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== searchSerial) return;
        if (!response.ok || data.ok === false) {
          searchHits = [];
          searchNote = data.error || "Suche fehlgeschlagen";
        } else {
          searchHits = Array.isArray(data.hits) ? data.hits : [];
          searchNote = searchHits.length ? "" : "Keine Treffer";
        }
      } catch (_err) {
        if (serial !== searchSerial) return;
        searchHits = [];
        searchNote = "Suche nicht erreichbar";
      }
      showSearchResults();
    }

    function searchBusyNote(text) {
      searchNote = text;
      showSearchResults();
    }

    async function openSearchHit(hit) {
      const serial = ++hitSerial;
      const query = catalogQueryOf(hit);
      searchNote = "Auflösen …";
      dashboardKey = "";
      if (panelMode === "search") paintDashboard();
      try {
        const response = await fetch(`/catalog/resolve?${catalogResolveParams(query)}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== hitSerial) return;
        if (!response.ok || !data.ok || !data.object) {
          searchNote = data.error || "Nicht aufgelöst";
          showSearchResults();
          return;
        }
        searchNote = "";
        detailNote = "";
        const item = data.object;
        item.fromSearch = true;
        showObjectDetail(item);
        panelReturn = "search";
      } catch (_err) {
        if (serial !== hitSerial) return;
        searchNote = "Auflösen nicht erreichbar";
        showSearchResults();
      }
    }

    async function aimResolvedTarget(item) {
      const serial = ++aimSerial;
      const query = catalogQueryOf(item);
      detailNote = "Auflösen …";
      dashboardKey = "";
      if (panelMode === "detail") paintDashboard();
      try {
        const response = await fetch(`/catalog/resolve?${catalogResolveParams(query)}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== aimSerial) return;
        if (!response.ok || !data.ok || !data.object) {
          detailNote = data.error || "Nicht aufgelöst";
          dashboardKey = "";
          if (panelMode === "detail") paintDashboard();
          return;
        }
        const obj = data.object;
        obj.fromSearch = true;
        detailNote = "";
        selectedItem = obj;
        selectedKey = objectKey(obj);
        adoptNavTarget(obj, "resolve");
        dashboardKey = "";
        if (panelMode === "detail") paintDashboard();
      } catch (_err) {
        if (serial !== aimSerial) return;
        detailNote = "Auflösen nicht erreichbar";
        dashboardKey = "";
        if (panelMode === "detail") paintDashboard();
      }
    }

    function itemHasEquatorial(item) {
      return Boolean(item) && Number.isFinite(Number(item.ra)) && Number.isFinite(Number(item.dec));
    }

    function trackSkyWhen() {
      if (!skyView.live && skyView.when) return skyView.when;
      return skyWhen ? new Date(skyWhen) : new Date();
    }

    function trackClock(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    function disposeTrackMeshes() {
      while (trackGroup.children.length) {
        const child = trackGroup.children[0];
        trackGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
    }

    function clearDayTrack() {
      trackSerial += 1;
      trackData = null;
      trackNote = "";
      trackItemKey = "";
      disposeTrackMeshes();
    }

    function trackStyle(light, above) {
      if (light === "night") {
        return above
          ? { kind: "solid", color: 0x5eead4, radius: 1.45, opacity: 0.95 }
          : { kind: "solid", color: 0x64748b, radius: 0.45, opacity: 0.35 };
      }
      if (light === "twilight") {
        return above
          ? { kind: "dash", color: 0xfbbf24, radius: 0.9, opacity: 0.92, on: 2, off: 1 }
          : { kind: "dash", color: 0x78716c, radius: 0.4, opacity: 0.3, on: 2, off: 1 };
      }
      return above
        ? { kind: "dot", color: 0xfb923c, radius: 0.45, opacity: 0.75, on: 1, off: 2 }
        : { kind: "dot", color: 0x57534e, radius: 0.32, opacity: 0.25, on: 1, off: 2 };
    }

    function trackRuns(points) {
      const runs = [];
      let run = [];
      const joined = (left, right) => {
        if (!left) return false;
        if (left.light !== right.light || left.above !== right.above) return false;
        const turn = Math.abs(((((left.az - right.az) % 360) + 540) % 360) - 180);
        return turn < 25;
      };
      for (const point of points) {
        if (run.length && !joined(run[run.length - 1], point)) {
          runs.push(run);
          run = [];
        }
        run.push(point);
      }
      if (run.length) runs.push(run);
      return runs;
    }

    function addTrackTube(points, radius, color, opacity) {
      if (points.length < 2) return;
      const vectors = points.map((item) => azAltToVec(item.az, item.alt, vrTune.shellRadius - 8));
      const curve = new THREE.CatmullRomCurve3(vectors);
      const geometry = new THREE.TubeGeometry(curve, Math.max(2, (vectors.length - 1) * 3), radius, 5, false);
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        color, transparent: true, opacity, depthWrite: false,
      }));
      trackGroup.add(mesh);
    }

    function drawSkyTrack(points) {
      disposeTrackMeshes();
      const list = Array.isArray(points) ? points : [];
      for (const run of trackRuns(list)) {
        if (run.length < 2) continue;
        const style = trackStyle(run[0].light || "night", run[0].above);
        if (style.kind === "solid") {
          addTrackTube(run, style.radius, style.color, style.opacity);
          continue;
        }
        let index = 0;
        while (index < run.length - 1) {
          addTrackTube(run.slice(index, index + style.on + 1), style.radius, style.color, style.opacity);
          index += style.on + style.off;
        }
      }
      const now = trackSkyWhen().getTime();
      let nearest = null;
      for (const point of list) {
        const distance = Math.abs(new Date(point.when).getTime() - now);
        if (!nearest || distance < nearest.distance) nearest = { point, distance };
      }
      addHourMarks(list);
      if (!nearest || nearest.distance > 20 * 60 * 1000) return;
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(nearest.point.above ? 2.2 : 1.2, 10, 8),
        new THREE.MeshBasicMaterial({
          color: 0xf8fafc,
          transparent: true,
          opacity: nearest.point.above ? 0.95 : 0.45,
          depthWrite: false,
        }),
      );
      marker.position.copy(azAltToVec(nearest.point.az, nearest.point.alt, vrTune.shellRadius - 8));
      trackGroup.add(marker);
    }

    function hourMarks(points) {
      const list = Array.isArray(points) ? points : [];
      const exact = list.filter((item) => {
        if (!item.when) return false;
        const stamp = new Date(item.when);
        return stamp.getMinutes() === 0 && stamp.getSeconds() === 0;
      });
      if (exact.length) return exact;
      const byHour = new Map();
      for (const item of list) {
        if (!item.when) continue;
        const stamp = new Date(item.when);
        const key = `${stamp.getFullYear()}-${stamp.getMonth()}-${stamp.getDate()}-${stamp.getHours()}`;
        const dist = Math.abs(stamp.getMinutes() * 60 + stamp.getSeconds());
        const prev = byHour.get(key);
        if (!prev || dist < prev.dist) byHour.set(key, { item, dist });
      }
      return [...byHour.values()]
        .filter((entry) => entry.dist <= 20 * 60)
        .map((entry) => entry.item);
    }

    function addHourMarks(points) {
      for (const item of hourMarks(points)) {
        const style = trackStyle(item.light || "night", item.above);
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(item.above ? 1.9 : 1.15, 10, 8),
          new THREE.MeshBasicMaterial({
            color: style.color,
            transparent: true,
            opacity: item.above ? 0.95 : 0.4,
            depthWrite: false,
          }),
        );
        dot.position.copy(azAltToVec(item.az, item.alt, vrTune.shellRadius - 8));
        trackGroup.add(dot);
        const stamp = new Date(item.when);
        const label = stamp.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", hour12: false });
        const sprite = makeLabelSprite({
          iau: `hour:${item.when}`,
          name: label,
          az: item.az,
          alt: Number(item.alt) + 1.4,
        });
        if (!sprite) continue;
        sprite.material.opacity = item.above ? 1 : 0.5;
        trackGroup.add(sprite);
      }
    }

    function trackSlice(data, start) {
      const from = start.getTime();
      const to = from + 12 * 60 * 60 * 1000;
      return (data && data.points ? data.points : []).filter((point) => {
        const stamp = new Date(point.when).getTime();
        return stamp >= from - 8 * 60 * 1000 && stamp <= to;
      });
    }

    function trackCovers(start) {
      if (!trackData || !Array.isArray(trackData.points) || !trackData.points.length) return false;
      const end = new Date(trackData.points[trackData.points.length - 1].when).getTime();
      return start.getTime() + 12 * 60 * 60 * 1000 <= end + 16 * 60 * 1000;
    }

    function slicePeak(slice) {
      if (!slice.length) return null;
      let best = slice[0];
      for (const point of slice) if (Number(point.alt) > Number(best.alt)) best = point;
      return {
        point: best,
        interior: best !== slice[0] && best !== slice[slice.length - 1],
      };
    }

    function overlappingWindows(windows, start) {
      const from = start.getTime();
      const to = from + 12 * 60 * 60 * 1000;
      return (Array.isArray(windows) ? windows : []).filter((slot) => {
        const begin = new Date(slot.start).getTime();
        const end = new Date(slot.end).getTime();
        return Number.isFinite(begin) && Number.isFinite(end) && end > from && begin < to;
      });
    }

    async function loadDayTrack() {
      const serial = ++trackSerial;
      const item = selectedItem;
      if (!itemHasEquatorial(item)) {
        trackData = null;
        trackItemKey = "";
        trackNote = "Keine RA/Dec für die Bahn.";
        disposeTrackMeshes();
        dashboardKey = "";
        if (panelMode === "track") paintDashboard();
        return;
      }
      trackNote = "Lade Bahn …";
      dashboardKey = "";
      if (panelMode === "track") paintDashboard();
      const when = trackSkyWhen();
      const params = new URLSearchParams({
        ra: String(item.ra),
        dec: String(item.dec),
        lat: String(siteLat),
        lon: String(siteLon),
        when: when.toISOString(),
        tz_offset_min: String(-new Date().getTimezoneOffset()),
      });
      if (siteStem) params.set("stem", siteStem);
      try {
        const response = await fetch(`/sky-track?${params}`, { cache: "no-store" });
        const data = await response.json();
        if (serial !== trackSerial) return;
        if (!response.ok || data.error || !Array.isArray(data.points) || data.points.length < 2) {
          trackData = null;
          trackItemKey = "";
          trackNote = data.error || "Keine Tagesbahndaten";
          disposeTrackMeshes();
        } else {
          trackData = data;
          trackItemKey = objectKey(item);
          trackNote = "";
          drawSkyTrack(data.points);
        }
      } catch (_err) {
        if (serial !== trackSerial) return;
        trackData = null;
        trackItemKey = "";
        trackNote = "Bahn nicht erreichbar";
        disposeTrackMeshes();
      }
      dashboardKey = "";
      if (panelMode === "track") paintDashboard();
    }

    function ensureDayTrack() {
      const when = trackSkyWhen();
      const same = trackData && trackItemKey === objectKey(selectedItem) && trackCovers(when);
      if (same) {
        drawSkyTrack(trackData.points);
        dashboardKey = "";
        return;
      }
      loadDayTrack();
    }

    function showDayTrack() {
      if (panelMode !== "track") trackReturn = panelReturn;
      panelMode = "track";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
      ensureDayTrack();
    }

    function closeDayTrack() {
      panelMode = "detail";
      panelReturn = trackReturn || "list";
      syncPanelButtons();
      dashboardKey = "";
      paintDashboard();
    }

    function paintAltitudeChart(ctx, slice, start) {
      const left = 78;
      const right = 980;
      const top = 196;
      const bottom = 520;
      let minAlt = 0;
      let maxAlt = 20;
      for (const point of slice) {
        minAlt = Math.min(minAlt, Number(point.alt));
        maxAlt = Math.max(maxAlt, Number(point.alt));
      }
      minAlt = Math.floor(minAlt / 10) * 10;
      maxAlt = Math.ceil(maxAlt / 10) * 10;
      if (maxAlt - minAlt < 20) maxAlt = minAlt + 20;
      const xAt = (index) => left + (right - left) * (index / Math.max(1, slice.length - 1));
      const yAt = (alt) => bottom - (bottom - top) * ((alt - minAlt) / (maxAlt - minAlt));
      ctx.strokeStyle = "rgba(148, 163, 184, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left, bottom);
      ctx.lineTo(right, bottom);
      ctx.stroke();
      if (minAlt < 0 && maxAlt > 0) {
        ctx.strokeStyle = "rgba(248, 250, 252, 0.85)";
        ctx.beginPath();
        ctx.moveTo(left, yAt(0));
        ctx.lineTo(right, yAt(0));
        ctx.stroke();
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "22px sans-serif";
        ctx.fillText("0°", 28, yAt(0) + 6);
      }
      ctx.fillStyle = "#94a3b8";
      ctx.font = "22px sans-serif";
      ctx.fillText(`${Math.round(maxAlt)}°`, 18, top + 8);
      ctx.fillText(`${Math.round(minAlt)}°`, 18, bottom);
      const colors = { night: "#5eead4", twilight: "#fbbf24", day: "#fb923c" };
      for (let index = 1; index < slice.length; index += 1) {
        const point = slice[index];
        ctx.strokeStyle = colors[point.light] || "#e2e8f0";
        ctx.globalAlpha = point.above ? 1 : 0.4;
        ctx.lineWidth = point.above ? 5 : 3;
        ctx.beginPath();
        ctx.moveTo(xAt(index - 1), yAt(Number(slice[index - 1].alt)));
        ctx.lineTo(xAt(index), yAt(Number(point.alt)));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const now = start.getTime();
      let nowIndex = 0;
      let nowDistance = Infinity;
      slice.forEach((point, index) => {
        const distance = Math.abs(new Date(point.when).getTime() - now);
        if (distance < nowDistance) {
          nowDistance = distance;
          nowIndex = index;
        }
      });
      ctx.strokeStyle = "#f8fafc";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(xAt(nowIndex), top);
      ctx.lineTo(xAt(nowIndex), bottom);
      ctx.stroke();
      const peak = slicePeak(slice);
      if (peak) {
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(xAt(slice.indexOf(peak.point)), yAt(Number(peak.point.alt)), 7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#94a3b8";
      ctx.font = "22px sans-serif";
      ctx.fillText(trackClock(slice[0].when), left, bottom + 28);
      ctx.fillText(trackClock(slice[slice.length - 1].when), right - 70, bottom + 28);
    }

    function goBack() {
      if (panelMode === "track") {
        closeDayTrack();
        return;
      }
      if (panelMode === "search") {
        showObjectList();
        return;
      }
      if (panelMode === "detail" && panelReturn === "search") {
        showSearchResults();
        return;
      }
      if (panelMode === "detail" && panelReturn === "list") {
        showObjectList();
        return;
      }
      if (panelMode === "detail" && panelReturn === "himmel") {
        showHimmel();
        return;
      }
      if (panelMode === "detail" && panelReturn === "prefs") {
        showPrefs();
        return;
      }
      showHome();
    }

    function resetObjectPanel() {
      showHome();
    }

    function refreshObjectPanel() {
      if (panelMode === "list") {
        updateObjectRows();
        return;
      }
      if (panelMode === "search") {
        updateSearchRows();
        return;
      }
      if (panelMode !== "detail" || !selectedKey || !selectedItem) return;
      if (selectedItem.fromSearch) return;
      const found = findByKey(selectedKey);
      if (found) {
        selectedItem = found;
        selectedMissing = false;
      } else {
        selectedMissing = true;
      }
    }

    function paintDashboard() {
      const ctx = dashboardCanvas.getContext("2d");
      const width = dashboardCanvas.width;
      const height = dashboardCanvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(15, 23, 42, 0.86)";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(125, 211, 252, 0.85)";
      ctx.lineWidth = 6;
      ctx.strokeRect(8, 8, width - 16, height - 16);
      if (panelMode === "list") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Objekte", 48, 28);
        if (!objectChoices().length) {
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "34px sans-serif";
          ctx.fillText("Keine Gestirne in der letzten Antwort.", 48, 100);
        }
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "search") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Suche", 48, 22);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "28px sans-serif";
        const pages = Math.max(1, Math.ceil(searchHits.length / 6));
        const pageText = searchHits.length ? `   Seite ${searchPage + 1} / ${pages}` : "";
        ctx.fillText(`${searchQuery || "—"}${pageText}`, 48, 72);
        if (searchNote) ctx.fillText(searchNote, 48, 112);
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "prefs") {
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "himmel") {
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 42px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Himmel", 48, 22);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "26px sans-serif";
        const markNote = (skyView.messier || skyView.ngcMode !== "off")
          ? `  ·  ${skyView.icons ? "Typen" : "Scheiben"}${skyView.seeing ? " · Unruhe" : ""}`
          : "";
        const ngcNote = skyView.ngcMode === "off"
          ? ""
          : `  ·  ${lastNgc.length} NGC`;
        ctx.fillText(`${skyClockLabel()}  ·  ${lastDso.length} Messier${ngcNote}${markNote}`, 48, 68);
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "track") {
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#7dd3fc";
        ctx.font = "bold 36px sans-serif";
        const title = selectedItem ? (selectedItem.name || selectedItem.id || "Objekt") : "Tagesbahn";
        ctx.fillText(`Tagesbahn  ${title}`, 48, 22);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "26px sans-serif";
        if (trackNote || !trackData) {
          ctx.fillText(trackNote || "Keine Tagesbahndaten", 48, 78);
          dashboardTexture.needsUpdate = true;
          return;
        }
        const start = trackSkyWhen();
        const slice = trackSlice(trackData, start);
        const peak = slicePeak(slice);
        const summary = trackData.summary || {};
        const nights = overlappingWindows(summary.observable_windows, start);
        const horizon = siteStem ? "Gartenhorizont" : "Horizont 0°";
        const peakText = peak
          ? `${peak.interior ? "Kulmination" : "Höchste Höhe im Abschnitt"} ${Number(peak.point.alt).toFixed(0)}° um ${trackClock(peak.point.when)}`
          : "Keine Höhe im Abschnitt";
        const nightText = nights.length
          ? `Nacht über Horizont ${nights.slice(0, 2).map((slot) => `${trackClock(slot.start)}–${trackClock(slot.end)}`).join(", ")}`
          : "Kein Nachtfenster in den nächsten 12 h";
        const hidden = slice.length && slice.every((point) => point.above === false);
        ctx.fillText(peakText, 48, 68);
        ctx.fillText(hidden ? `${nightText} · im Fenster unter dem Horizont` : nightText, 48, 102);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "22px sans-serif";
        ctx.fillText(`12 h ab ${trackClock(start.toISOString())} · ${horizon} · Nacht türkis, Dämmerung gelb, Tag orange`, 48, 140);
        if (slice.length >= 2) paintAltitudeChart(ctx, slice, start);
        else ctx.fillText("Der gelieferte Abschnitt deckt keine 12 h ab.", 48, 220);
        dashboardTexture.needsUpdate = true;
        return;
      }
      if (panelMode === "detail" && selectedItem) {
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        detailLines(selectedItem, selectedMissing).forEach((line, index) => {
          ctx.fillStyle = index === 0 ? "#7dd3fc" : "#e2e8f0";
          ctx.font = index === 0 ? "bold 40px sans-serif" : "32px sans-serif";
          ctx.fillText(line, 48, 36 + index * 52);
        });
        dashboardTexture.needsUpdate = true;
        return;
      }
      ctx.fillStyle = "#7dd3fc";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Astro-VR", 48, 28);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "28px sans-serif";
      const sections = dashboardSections();
      const clock = sections[0] && sections[0].lines ? sections[0].lines[0] : "";
      const fault = skyFault ? `  ·  ${String(skyFault).slice(0, 42)}` : "";
      ctx.fillText(`${clock}  ·  ${skyStars} Sterne${fault}`, 48, 78);
      ctx.fillStyle = "#fde68a";
      ctx.font = "28px sans-serif";
      ctx.fillText(overlayStateText, 48, 500);
      dashboardTexture.needsUpdate = true;
    }

    function refreshDashboard() {
      if (!dashboard.visible) return;
      const key = panelMode === "prefs"
        ? "prefs"
        : panelMode === "himmel"
        ? `himmel|${skyClockLabel()}|${skyView.mag}|${skyView.live}|${skyView.stars}|${skyView.constellations}|${skyView.messier}|${skyView.ngcMode}|${skyView.ngcMin}|${skyView.icons}|${skyView.seeing}|${lastDso.length}|${lastNgc.length}`
        : panelMode === "list"
        ? `list|${objectChoices().map(objectKey).join(",")}|${overlayStateText}`
        : panelMode === "search"
        ? `search|${searchQuery}|${searchPage}|${searchNote}|${searchHits.map((hit) => hit.key || hit.id).join(",")}`
        : panelMode === "track"
        ? `track|${trackItemKey}|${trackNote}|${skyClockLabel()}|${siteStem}`
        : (panelMode === "detail" && selectedItem
          ? `detail|${detailLines(selectedItem, selectedMissing).join("|")}`
          : `home|${dashboardSections().map((section) => section.title + section.lines.join("|")).join("||")}|${skyStars}|${overlayStateText}`);
      if (key === dashboardKey) return;
      dashboardKey = key;
      paintDashboard();
    }

    function paintMenuButton(mesh, title, subtitle) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(title, canvas.width / 2, 34);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "28px sans-serif";
      ctx.fillText(subtitle, canvas.width / 2, 70);

    function paintTextButton(mesh, text) {
      const canvas = mesh.userData.canvas;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#7dd3fc";
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.fillStyle = "#f8fafc";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      let size = 40;
      ctx.font = `bold ${size}px sans-serif`;
      while (size > 22 && ctx.measureText(text).width > canvas.width - 36) {
        size -= 2;
        ctx.font = `bold ${size}px sans-serif`;
      }
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      mesh.userData.texture.needsUpdate = true;
    }

    function makeTextButton(label, action, x, y, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 96;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({
          map: texture,
          color: testRest,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          side: THREE.FrontSide,
        }),
      );
      mesh.position.set(x, y, 0.004);
      mesh.renderOrder = 11;
      mesh.userData.action = action;
      mesh.userData.canvas = canvas;
      mesh.userData.texture = texture;
      dashboard.add(mesh);
