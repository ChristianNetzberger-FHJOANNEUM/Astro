<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>MeLE Wiki</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --nav-w: 260px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
                 font-family: "Segoe UI", system-ui, sans-serif; }
    #top {
      position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
      flex-wrap: wrap; padding: 10px 16px; background: rgba(15,23,42,.96);
      border-bottom: 1px solid var(--border);
    }
    #top a, #top button {
      color: var(--text); background: #1f4e5f; border: 0; border-radius: 4px;
      padding: 7px 10px; cursor: pointer; text-decoration: none; font-size: 13px;
    }
    #top .meta { opacity: .75; font-size: 12px; flex: 1; min-width: 180px; }
    #layout { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: calc(100vh - 48px); }
    nav {
      border-right: 1px solid var(--border); background: var(--panel);
      padding: 16px 12px 40px; position: sticky; top: 48px; align-self: start;
      max-height: calc(100vh - 48px); overflow: auto;
    }
    nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 14px 8px 8px; }
    nav a {
      display: block; padding: 8px 10px; border-radius: 6px; color: var(--text);
      text-decoration: none; font-size: 14px; margin-bottom: 2px; cursor: pointer;
    }
    nav a:hover { background: rgba(56,189,248,.12); }
    nav a.active { background: rgba(56,189,248,.2); color: var(--accent); }
    main { padding: 24px 28px 60px; max-width: 860px; }
    #article h1 { font-size: 26px; margin: 0 0 8px; }
    #article h2 { font-size: 18px; margin: 28px 0 8px; }
    #article h3 { font-size: 15px; margin: 18px 0 6px; color: #cbd5e1; }
    #article p, #article li { line-height: 1.55; color: #cbd5e1; font-size: 14.5px; }
    #article code { font-family: ui-monospace, Consolas, monospace; font-size: 13px;
                    background: #111827; padding: 1px 5px; border-radius: 3px; }
    #article pre.code {
      background: #111827; border: 1px solid var(--border); border-radius: 6px;
      padding: 12px 14px; overflow: auto; font-size: 13px; line-height: 1.45;
    }
    #article pre.code code { background: transparent; padding: 0; }
    #article .note {
      border-left: 3px solid var(--accent); padding: 8px 12px; margin: 14px 0;
      background: rgba(56,189,248,.08); border-radius: 0 6px 6px 0; font-size: 14px;
    }
    #article table {
      border-collapse: collapse; width: 100%; margin: 12px 0 18px; font-size: 13.5px;
    }
    #article th, #article td {
      border: 1px solid var(--border); padding: 6px 8px; text-align: left;
    }
    #article th { background: rgba(15,23,42,.9); color: #cbd5e1; }
    #article hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
    #article a { color: var(--accent); }
    #article figure.wiki-fig {
      margin: 12px 0 18px; padding: 8px; background: #020617;
      border: 1px solid var(--border); border-radius: 6px; text-align: center;
    }
    #article figure.wiki-fig img {
      max-width: 100%; max-height: 420px; width: auto; height: auto;
      border-radius: 4px; object-fit: contain;
    }
    #article figcaption {
      margin-top: 6px; font-size: 12px; color: var(--muted);
    }
    #article img { max-width: 100%; height: auto; }
    #path {
      margin: 0 0 16px; font-size: 12px; color: var(--muted); word-break: break-all;
      font-family: ui-monospace, Consolas, monospace;
    }
    #empty { color: var(--muted); }
    @media (max-width: 800px) {
      #layout { grid-template-columns: 1fr; }
      nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="top">
    <a href="/">Zurück zur App</a>
    <a href="/help-view">Hilfe (App)</a>
    <span class="meta" id="top-meta">MeLE Wiki · Markdown unter wiki/</span>
  </div>
  <div id="layout">
    <nav id="nav"></nav>
    <main>
      <div id="path"></div>
      <div id="article"><p id="empty">Lade Wiki…</p></div>
    </main>
  </div>
  <script>
    let wikiIndex = null;

    function pageIdFromHash() {
      const h = (location.hash || "").replace(/^#/, "").trim();
      return h || null;
    }

    async function loadIndex() {
      const response = await fetch("/wiki/index");
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "Index fehlgeschlagen");
      wikiIndex = data;
      document.getElementById("top-meta").textContent =
        `MeLE Wiki · Dateien: ${data.wiki_root}`;
      const nav = document.getElementById("nav");
      nav.innerHTML = "";
      (data.sections || []).forEach((section) => {
        const h2 = document.createElement("h2");
        h2.textContent = section.title || section.id;
        nav.appendChild(h2);
        (section.pages || []).forEach((page) => {
          const a = document.createElement("a");
          a.href = `#${page.id}`;
          a.dataset.page = page.id;
          a.textContent = page.title;
          a.addEventListener("click", (ev) => {
            ev.preventDefault();
            location.hash = page.id;
            showPage(page.id);
          });
          nav.appendChild(a);
        });
      });
      const first = (data.sections?.[0]?.pages?.[0]?.id) || "beitragen";
      showPage(pageIdFromHash() || first);
    }

    function setActive(pageId) {
      document.querySelectorAll("#nav a").forEach((a) => {
        a.classList.toggle("active", a.dataset.page === pageId);
      });
    }

    async function showPage(pageId) {
      setActive(pageId);
      const pathEl = document.getElementById("path");
      const article = document.getElementById("article");
      article.innerHTML = "<p id='empty'>Lade…</p>";
      try {
        const response = await fetch(`/wiki/page/${encodeURIComponent(pageId)}`);
        const data = await response.json();
        if (!response.ok || !data.ok) {
          article.innerHTML = `<p id="empty">${data.error || "Seite fehlt"}</p>`;
          pathEl.textContent = "";
          return;
        }
        pathEl.textContent = `Datei: ${data.path}  ·  Format: Markdown`;
        article.innerHTML = data.html || "<p>(leer)</p>";
        document.title = `${data.title} · MeLE Wiki`;
        if (location.hash.replace(/^#/, "") !== pageId) {
          history.replaceState(null, "", `#${pageId}`);
        }
      } catch (err) {
        article.innerHTML = `<p id="empty">${String(err.message || err)}</p>`;
      }
    }

    window.addEventListener("hashchange", () => {
      const id = pageIdFromHash();
      if (id) showPage(id);
    });

    loadIndex().catch((err) => {
      document.getElementById("article").innerHTML =
        `<p id="empty">${String(err.message || err)}</p>`;
    });
  </script>
</body>
</html>
