ui_port: 8082
# LAN-Zugriff (iPad im Heim-WLAN): 0.0.0.0 — nur lokal: 127.0.0.1
ui_host: 0.0.0.0
media_dir: media
# Handyfotos mit GPS-EXIF, getrennt von den 360-Panos in media/.
gps_dir: media/GPS-locations
horizon_dir: data/horizon
preview_width: 2000
# Beobachterstandort fuer RA/Dec (Ost positiv). Osmo-GPS ist ungueltig.
# Handyfoto mit Ortung nach media/GPS-locations legen, in der UI waehlen.
# Zeitzone fuer naive EXIF-Aufnahmezeit (sonst lokale PC-Zeit).
latitude_deg: 48.254750
elevation_m: 250
timezone: Europe/Vienna
catalog_dir: data/catalogs
# Imaging-Profile/Sessions (getrennt von sky.sqlite)
astro_manager_db: data/catalogs/astro_manager.sqlite
# Aufnahme lokal: C:\Astro\Capture\Mele\… (neben anderen Capture-Ordnern); Archiv spaeter NAS
local_capture_root: C:/Astro/Capture/Mele
# ARCHIVE (S4): NAS Share Media — UNC bevorzugen (nicht M:-Laufwerk)
archive_root: //192.168.0.100/Media/Astro/Mele
# WORK (S3): MeLE → Notebook per SMB (Tailscale verifiziert, ohne Passwort hier)
# Transfer: \\100.97.226.18\Astro\Work\Mele  |  Siril lokal: C:\Astro\Work\Mele
# Anmeldung: Windows Credential Manager (TECHNIKUM\net), nicht in YAML.
work_transfer_root: //100.97.226.18/Astro/Work/Mele
work_local_root: C:/Astro/Work/Mele
siril_home_dirname: siril_home
# NINA Advanced API (REST). Default lokal auf dem MeLE-PC.
nina_base_url: http://localhost:1888/v2/api
# NINA Desktop-App (normal installiert).
nina_exe: C:/Program Files/N.I.N.A. - Nighttime Imaging 'N' Astronomy/NINA.exe
# SynScan Pro (Skywatcher-Montierung). Verzeichnis oder Pfad zur .exe.
synscan_pro_exe: C:/Astro/SW/synscanpro_windows_2611/SynScanPro/SynScanPro.exe
# PHD2 Guiding (ASI120). Event-Server typisch Port 4400.
phd2_exe: C:/Program Files (x86)/PHDGuiding2/phd2.exe
phd2_host: 127.0.0.1
phd2_port: 4400
# Fullframe via save_image → FITS → JPEG (Setup/Navigation), nicht jedes Guide-Frame
phd2_fullframe_interval_s: 1.0
# GeoSphere-Forecast-Journal (stündlich via Task Scheduler / CLI).
weather_journal_enabled: true
weather_journal_interval_h: 1
# Lokale Station: Pull von weather_server (eigenstaendig) und/oder Push /weather/observation
local_weather:
  enabled: true
  provider: weather_server
  label: Garten
  server_url: http://127.0.0.1:8765
  poll_interval_s: 20
  journal: true

# Observatory Safety (MeLE-Entscheidung; weather_server bleibt SoR)
weather_safety:
  live_max_age_s: 60
  stale_max_age_s: 180
  dew_caution_k: 3.0
  # wind_caution_ms: null   # optional, z.B. 5.0
  # gust_caution_ms: null   # optional, z.B. 8.0
  rain_unsafe_mmh: 0.01
  dew_trend_window_min: 45
  dew_trend_min_samples: 4
  dew_eta_threshold_k: 3.0
  dew_eta_min_abs_trend_k_per_h: 0.25

longitude_deg: 14.366140
